\nPerla: criterio cardinal: malestar postesfuerzo (IOM 2015)."}, {"esp": "Neurología y Psiquiatría", "q": "¿Qué pareja describe correctamente el cambio hormonal hipofisario con el uso de opioides?", "o": ["Prolactina: disminuye", "LH: aumenta", "TSH: aumenta", "GH: aumenta", "CRH: aumenta"], "a": 3, "e": "Los opioides aumentan GH y PROLACTINA (inhiben la dopamina tuberoinfundibular) y suprimen GnRH/LH (hipogonadismo inducido por opioides), el eje corticotropo (↓CRH/ACTH/cortisol → posible insuficiencia suprarrenal) y la TSH.\nPerla: el hipogonadismo por opioides es frecuente en tratamiento crónico: medir testosterona si síntomas."}, {"esp": "Neurología y Psiquiatría", "q": "Un paciente consulta por adicción a Salvia divinorum. Según la clave de la fuente, ¿qué se recomienda?", "o": ["Acamprosato", "Alprazolam", "Terapia conductual", "Fluoxetina", "Naloxona"], "a": 0, "e": "La clave del banco Harrison da el acamprosato. Contexto: la salvinorina A es un agonista κ-opioide (alucinógeno disociativo de acción muy corta); no existe tratamiento farmacológico aprobado y la evidencia es mínima: el abordaje real es psicosocial/conductual. Las benzodiacepinas no están indicadas (riesgo de dependencia).\nPerla: la naloxona tiene poca afinidad κ a dosis habituales; no se usa en esta adicción."}, {"esp": "Neurología y Psiquiatría", "q": "Niña de 14 años con debilidad proximal progresiva y atrofia leve; CK normal; biopsia con atrofia de patrón neurógeno (denervación). ¿Qué enfermedad sospechar?", "o": ["Distrofia muscular de Duchenne", "Distrofia de Emery-Dreifuss", "Distrofia de cinturas", "MELAS", "Atrofia muscular espinal"], "a": 4, "e": "Debilidad proximal con CK normal y biopsia de DENERVACIÓN → enfermedad de motoneurona: AME (SMN1, tipos III-IV de inicio tardío). Las distrofias muestran patrón miopático con CK elevada (Duchenne ×50-100). Tratamientos: nusinersén, risdiplam, onasemnogén.\nPerla: fasciculaciones linguales y temblor fino de manos apoyan AME."}, {"esp": "Neurología y Psiquiatría", "q": "Al valorar la orientación del paciente, ¿cuál suele afectarse PRIMERO?", "o": ["Espacio", "Persona", "Tiempo", "Ninguna"], "a": 2, "e": "En el delirium y la demencia la orientación se pierde en orden: tiempo → espacio → persona (la orientación personal es la más resistente; su pérdida aislada sugiere origen psicógeno/disociativo).\nPerla: CAM (Confusion Assessment Method) para delirium: inicio agudo/fluctuante + inatención + (pensamiento desorganizado o alteración de consciencia)."}, {"esp": "Neurología y Psiquiatría", "q": "¿Cuál de las siguientes afirmaciones sobre la enfermedad de Parkinson es VERDADERA?", "o": ["El tabaquismo reduce el riesgo de desarrollarla.", "La edad avanzada de inicio sugiere predisposición genética.", "Es un trastorno monogénico por mutaciones de α-sinucleína.", "Su marca patológica son ovillos neurofibrilares de tau en la sustancia negra.", "La edad típica de inicio es >70 años."], "a": 0, "e": "Asociación inversa consistente con tabaco y café (y ácido úrico alto). Patología: pérdida de neuronas dopaminérgicas de la pars compacta con cuerpos de LEWY (α-sinucleína), no tau. La mayoría es esporádica (~10% genética: LRRK2, GBA, PRKN, SNCA), y el inicio JOVEN sugiere causa genética. Edad media de inicio ~60 años.\nPerla: pródromos: anosmia, estreñimiento, trastorno de conducta del sueño REM, depresión."}, {"esp": "Neurología y Psiquiatría", "q": "Mujer de 34 años con debilidad distal (tropiezos, caída de objetos), cara alargada y hueca con atrofia temporal y maseterina, disartria, paladar ojival, miotonía de prensión; hermano con clínica similar y madre levemente afectada. ¿Diagnóstico?", "o": ["Enfermedad de Pompe", "Distrofia de Becker", "Distrofia de Duchenne", "Distrofia miotónica", "Miopatía nemalínica"], "a": 3, "e": "Distrofia miotónica tipo 1 (expansión CTG en DMPK; autosómica dominante con anticipación): debilidad DISTAL y facial ('cara de hacha'), ptosis, miotonía, cataratas, calvicie frontal, defectos de conducción cardiaca (causa de muerte súbita), resistencia insulínica, hipogonadismo. Duchenne/Becker: ligadas al X, proximales, varones.\nPerla: ECG/Holter anual; marcapasos/DAI según trastornos de conducción."}, {"esp": "Neurología y Psiquiatría", "q": "Varón de 24 años con primer episodio psicótico (alucinaciones auditivas imperativas, delirios de control) diagnosticado de esquizofrenia y tratado con antipsicóticos. ¿Cuál es VERDADERA sobre su pronóstico?", "o": ["Los antipsicóticos son eficaces en el 95% de los primeros episodios.", "La remisión completa suele tardar 3-6 meses.", "Si se suspenden los fármacos, la recaída es de ~60% a los 6 meses.", "Más del 25% comete suicidio.", "El pronóstico depende de la gravedad de los síntomas iniciales."], "a": 2, "e": "La suspensión de antipsicóticos tras un primer episodio conlleva recaídas elevadas (60% a 6 meses según la fuente; hasta ~80% a 1-2 años). Respuesta al primer episodio ~70-80%; la remisión suele tardar más; suicidio ~5% (10% de intentos). El pronóstico depende más de síntomas negativos, inicio insidioso, mala función premórbida y duración de la psicosis no tratada que de la gravedad inicial.\nPerla: clozapina para esquizofrenia resistente (≥2 antipsicóticos)."}, {"esp": "Neurología y Psiquiatría", "q": "Mujer de 31 años fumadora, con DM1, neuritis óptica previa, visión borrosa, espasticidad e hiperreflexia: esclerosis múltiple. Todos son factores de riesgo epidemiológicos, EXCEPTO:", "o": ["Edad 20-40 años", "Tabaquismo", "Sexo femenino", "Antecedente de otra enfermedad autoinmune (DM1)", "Raza caucásica"], "a": 3, "e": "Factores de riesgo de EM: sexo femenino (3:1), edad 20-40, ascendencia del norte de Europa/caucásica, latitud alta, déficit de vitamina D, tabaquismo, obesidad adolescente, infección previa por VEB (mononucleosis; el factor más fuerte), HLA-DRB1*15:01. La coexistencia con otras autoinmunes (tiroiditis, DM1) se ha descrito, pero no es un factor de riesgo epidemiológico establecido según la fuente.\nPerla: McDonald 2017: diseminación en tiempo/espacio; las bandas oligoclonales pueden sustituir la diseminación temporal."}, {"esp": "Neurología y Psiquiatría", "q": "Varón de 28 años que bebe 3-4 cervezas/día y 8-12 en fines de semana, con resacas en el trabajo y un blackout; minimiza el consumo. ¿Qué prueba de laboratorio tiene mayor sensibilidad y especificidad para consumo abundante?", "o": ["AST >2×ALT", "CDT >20 U/L o >2,6%", "GGT >35 U/L", "VCM >91", "A y D", "B y C (CDT + GGT combinados)"], "a": 5, "e": "La combinación de CDT (transferrina deficiente en carbohidratos, la más específica de consumo ≥60 g/día durante ≥2 semanas) y GGT (la más sensible) supera a cada marcador aislado (sensibilidad y especificidad ~75-90%). El VCM y el cociente AST/ALT son poco sensibles. El fosfatidiletanol (PEth) en sangre es hoy el biomarcador más específico.\nPerla: AUDIT-C como cribado clínico; la GGT normaliza en 2-6 semanas de abstinencia."}, {"esp": "Neurología y Psiquiatría", "q": "Mujer de 74 años, corredora (FC 52 lpm), con temblor de acción en manos que mejora con alcohol, sin temblor de reposo. ¿Mejor tratamiento inicial?", "o": ["Toxina botulínica bilateral", "L-dopa", "Primidona", "Propranolol", "Dos cervezas por noche"], "a": 2, "e": "Temblor esencial: primera línea propranolol o primidona (similar eficacia). Con bradicardia sinusal de 52 lpm, el propranolol está desaconsejado → primidona (empezar con 12,5-25 mg por la noche; mareo/sedación iniciales). La L-dopa es para Parkinson. Refractarios: topiramato, gabapentina, estimulación del núcleo VIM o ultrasonidos focalizados.\nPerla: la mejoría con alcohol es típica (~50-70%)."}, {"esp": "Neurología y Psiquiatría", "q": "Mujer de 65 años con cáncer de mama previo, dorsalgia de 1 semana que empeora con la tos, paraparesia 3/5, incontinencia, nivel sensitivo T8 y RM con compresión medular metastásica en T8 (múltiples metástasis). ¿Siguiente mejor paso?", "o": ["Dexametasona 10 mg IV", "Oncología para quimioterapia", "Neurocirugía para descompresión", "Radioterapia urgente", "A y C"], "a": 4, "e": "Compresión medular metastásica con déficit: dexametasona inmediata (10 mg IV de carga) + descompresión quirúrgica seguida de RT en pacientes seleccionados (Patchell 2005: la cirugía + RT mejora la deambulación frente a RT sola en compresión de un único nivel, expectativa >3 meses). En tumores muy radiosensibles, múltiples niveles o mal estado general, RT urgente.\nPerla: puntuación de Tokuhashi/NOMS/SINS para decidir."}, {"esp": "Neurología y Psiquiatría", "q": "¿Cuál de los siguientes trastornos puede relacionarse con la miastenia gravis?", "o": ["ERC", "DM", "Artritis reumatoide", "Timoma", "C y D"], "a": 4, "e": "~10-15% de pacientes con MG tiene timoma (y ~65% hiperplasia tímica); >30% de los timomas asocian MG → TC torácica a todos. La MG se asocia a otras autoinmunes: tiroiditis/Graves, AR, LES, anemia perniciosa.\nPerla: timectomía beneficiosa también en MG generalizada AChR+ sin timoma de 18-50/65 años (MGTX)."}, {"esp": "Neurología y Psiquiatría", "q": "Paciente en prevención secundaria con AAS tras un ictus isquémico. ¿Cuánto dura el efecto antiagregante del AAS?", "o": ["12 h", "1 día", "2-3 días", "6 días", "8 días (vida de la plaqueta)"], "a": 4, "e": "El AAS acetila irreversiblemente la COX-1 plaquetaria; como la plaqueta no tiene núcleo, el efecto dura toda su vida (7-10 días). Se recupera ~10% de plaquetas funcionales al día; con ~50% basta para hemostasia normal.\nPerla: suspender 5-7 días antes de cirugía cuando esté indicado; en neurocirugía/cirugía con alto riesgo hemorrágico."}, {"esp": "Neurología y Psiquiatría", "q": "Varón de 72 años hipertenso con crisis tónico-clónica generalizada; somnoliento y desorientado, pulso irregular 90-100 lpm, PA 160/90 y hemiparesia izquierda. ¿Causa más probable de la crisis?", "o": ["Amlodipino", "Ictus embólico", "Hipoglucemia", "Hematoma subdural", "Ictus trombótico"], "a": 1, "e": "Pulso irregularmente irregular (FA no conocida) + déficit focal + crisis → ictus cardioembólico (afectación cortical, más epileptógeno que los lacunares/trombóticos de pequeño vaso). Las crisis agudas ocurren en ~2-5% de ictus, sobre todo corticales, embólicos y hemorrágicos. Debe excluirse la parálisis de Todd.\nPerla: el ictus es la causa más frecuente de epilepsia de nueva aparición en >60 años."}, {"esp": "Neurología y Psiquiatría", "q": "Mujer de 82 años con obesidad, diabetes, HTA, dislipemia, tabaquismo y demencia vascular. ¿Cuál es su MAYOR factor de riesgo de enfermedad cardiovascular e ictus?", "o": ["Edad", "Diabetes", "Hiperlipidemia", "HTA", "Tabaquismo"], "a": 0, "e": "La edad es el factor de riesgo más potente (no modificable): el riesgo de ictus se duplica cada década a partir de los 55 años. Entre los modificables, la HTA es el más importante para el ictus (en fracción atribuible poblacional; INTERSTROKE).\nPerla: diferencia importante en examen: 'mayor factor' (edad) vs 'mayor factor MODIFICABLE' (HTA)."}, {"esp": "Neurología y Psiquiatría", "q": "Paciente con demencia progresiva con apatía, desinhibición, compulsividad, pérdida de empatía e hiperfagia; RM con atrofia del cíngulo anterior y región frontoinsular. ¿Tratamiento eficaz para mejorar la demencia?", "o": ["Memantina", "Fenitoína", "Trazodona", "Vitamina E", "Ninguno de los anteriores"], "a": 4, "e": "Demencia frontotemporal variante conductual (criterios de Rascovsky). No hay fármacos que modifiquen la cognición: los anticolinesterásicos pueden empeorar la conducta y la memantina no es eficaz. Los ISRS y la trazodona pueden mejorar síntomas conductuales, pero no la demencia.\nPerla: genes: C9orf72 (también ELA), GRN, MAPT."}, {"esp": "Neurología y Psiquiatría", "q": "Mujer de 40 años con LES tratada 10 años con hidroxicloroquina y micofenolato; debilidad proximal y distal de piernas y pérdida sensitiva; EMG con potenciales miopáticos proximales y neuropatía axonal; LCR normal. ¿Causa más probable?", "o": ["PDIC", "Guillain-Barré", "Toxicidad por hidroxicloroquina", "EM", "Neuropatía de fibra fina por LES"], "a": 2, "e": "La hidroxicloroquina puede producir neuromiopatía (miopatía vacuolar con cuerpos curvilíneos + neuropatía axonal) y miocardiopatía, además de retinopatía, sobre todo con dosis acumuladas altas y ERC. Mejora al suspender. PDIC/GBS: proteínas elevadas en LCR y desmielinización.\nPerla: dosis máxima de HCQ ≤5 mg/kg de peso real/día; cribado oftalmológico anual tras 5 años."}, {"esp": "Neurología y Psiquiatría", "q": "Mujer de 26 años con cefalea pulsátil periocular derecha que empeora con el movimiento y el ruido, sin aura, desencadenada por falta de sueño, estrés y vino tinto. ¿Qué caracteriza mejor su patogenia?", "o": ["Contracción muscular difusa pericraneal", "Desinhibición de neuronas marcapasos hipotalámicas posteriores", "Disfunción de los sistemas de control sensitivo monoaminérgicos del tronco del encéfalo y el hipotálamo", "Vasodilatación cerebral focal", "Compresión vascular del trigémino"], "a": 2, "e": "Migraña: trastorno primario del procesamiento sensitivo con disfunción de núcleos monoaminérgicos del tronco e hipotálamo, activación del sistema trigeminovascular y liberación de CGRP (base de los anti-CGRP). La vasodilatación es epifenómeno. Hipotálamo posterior = cefalea en racimos; compresión vascular = neuralgia del trigémino.\nPerla: gepantes (ubrogepant, rimegepant) útiles cuando los triptanes están contraindicados (cardiopatía isquémica)."}, {"esp": "Neurología y Psiquiatría", "q": "Varón de 42 años postoperado de fémur con estupor, FR 4 y SatO2 60% tras recibir por error 10 mg de hidromorfona IV. Responde a naloxona, pero 10 min después vuelve a estar obnubilado e hipopneico. ¿Mejor paso?", "o": ["Flumazenilo IV", "Electrolitos", "Intubar y trasladar a UCI", "TC craneal urgente", "Perfusión continua de naloxona"], "a": 4, "e": "La vida media de la naloxona (30-90 min) es más corta que la de la mayoría de opioides → renarcotización. Tratamiento: bolos repetidos y perfusión (≈2/3 de la dosis que revirtió, por hora), con monitorización. Intubar si fracasa.\nPerla: titular dosis bajas (0,04-0,4 mg) en dependientes para evitar abstinencia brusca y EAP."}, {"esp": "Neurología y Psiquiatría", "q": "Varón de 45 años con HSA por aneurisma de ACM derecha, con sangre intraventricular, tratado con embolización y trasladado a UCI neurológica. Todas las intervenciones siguientes están indicadas, EXCEPTO:", "o": ["Reparación endovascular del aneurisma", "Nimodipino oral", "Compresión neumática intermitente de MMII", "Drenaje lumbar profiláctico", "Hiponatremia 'terapéutica' (inducida)"], "a": 4, "e": "La hiponatremia en HSA empeora el edema y el vasoespasmo y debe evitarse/corregirse (normonatremia o incluso Na alto-normal). Indicados: tratamiento precoz del aneurisma, nimodipino 21 días, profilaxis mecánica de TEV (farmacológica tras asegurar el aneurisma), y el drenaje lumbar reduce el vasoespasmo en HSA aneurismática (EARLYDRAIN).\nPerla: el 'triple H' ya no se recomienda; objetivo euvolemia."}, {"esp": "Neurología y Psiquiatría", "q": "Mujer de 42 años con TEPT tras un asalto a mano armada: pesadillas, hipervigilancia, insomnio, irritabilidad; bebe una botella de vino por la noche para dormir. ¿Qué tratamiento se recomienda?", "o": ["Evitar el alcohol", "Terapia cognitivo-conductual (centrada en el trauma)", "Paroxetina 20 mg/día", "Trazodona 50 mg por la noche", "Todo lo anterior"], "a": 4, "e": "TEPT: psicoterapias centradas en el trauma (TCC, exposición prolongada, EMDR) de primera línea; ISRS (paroxetina, sertralina) o venlafaxina; trazodona/prazosina para insomnio y pesadillas; abstinencia de alcohol (empeora pesadillas y síntomas). Evitar benzodiacepinas (empeoran el pronóstico).\nPerla: el debriefing psicológico inmediato no previene el TEPT."}, {"esp": "Neurología y Psiquiatría", "q": "Mujer de 48 años en recuperación de dependencia alcohólica con ictus previo durante crisis hipertensiva. ¿Qué fármaco puede considerarse para prevenir recaídas?", "o": ["Acamprosato", "Disulfiram", "Naltrexona", "A y C", "Cualquiera"], "a": 3, "e": "El disulfiram está contraindicado en enfermedad cardiovascular/cerebrovascular (la reacción disulfiram-alcohol produce hipotensión/taquicardia o crisis hipertensivas). Acamprosato (modulador glutamatérgico; ajustar en ERC) y naltrexona (antagonista opioide; evitar si opioides o hepatopatía grave) son opciones.\nPerla: nalmefeno para reducción del consumo; topiramato y gabapentina fuera de ficha técnica."}, {"esp": "Neurología y Psiquiatría", "q": "Mujer de 26 años con disnea, dolor torácico, palpitaciones, sensación de muerte y mareo de inicio súbito en un centro comercial, mejorando a los 20 min; estrés reciente. FC 108, exploración normal, pH 7,52, PaCO2 28, PaO2 116, ECG con taquicardia sinusal y dímero D normal. ¿Mejor paso?", "o": ["Alprazolam a demanda", "Fluoxetina 20 mg/día", "Angio-TC pulmonar", "Tranquilizar y sugerir tratamiento médico/psicológico si se repiten los episodios", "Derivar a TCC"], "a": 3, "e": "Primera crisis de pánico con causas orgánicas razonablemente excluidas (alcalosis respiratoria con PaO2 alta y dímero D normal hacen improbable TEP): tranquilizar y educar; el trastorno de pánico requiere crisis recurrentes con preocupación persistente ≥1 mes. Si recurren: TCC y/o ISRS; evitar benzodiacepinas de forma crónica.\nPerla: descartar hipertiroidismo, arritmias, feocromocitoma, consumo de estimulantes."}, {"esp": "Neurología y Psiquiatría", "q": "Varón de 65 años inmigrante de Bangladés rural con carcinoma hepatocelular. ¿Factor de riesgo más probable de su neoplasia (entre los siguientes tóxicos)?", "o": ["Aluminio", "Arsénico", "Cadmio", "Plomo", "Mercurio"], "a": 1, "e": "El agua de pozos contaminada con arsénico es un problema masivo de salud pública en Bangladés: se asocia a cáncer de piel, pulmón, vejiga, riñón e hígado (hepatocarcinoma y angiosarcoma hepático), además de lesiones cutáneas (hiperqueratosis palmoplantar, hiperpigmentación), neuropatía y enfermedad vascular (enfermedad del pie negro). (En la práctica, siempre descartar también VHB/VHC y aflatoxinas.)\nPerla: cloruro de vinilo y Thorotrast → angiosarcoma hepático."}];
const ICON = {"Hematología":"🩸","Oncología":"🎗️","Cardiología":"❤️","Neumología y UCI":"🫁","Nefrología":"🫘","Digestivo y Nutrición":"🍏","Reumatología e Inmunología":"🦴","Endocrinología":"🧬","Neurología y Psiquiatría":"🧠"};
const ORDER = Object.keys(ICON);
const KEY = "repaso_fallos_harrison_v1";
DATA.forEach((q,i)=>q.id=i);
let S = {lvl:{}, xp:0, streak:0, last:null, seen:{}, size:10};
try{const r=localStorage.getItem(KEY); if(r) S=Object.assign(S,JSON.parse(r));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
const $=s=>document.querySelector(s);
const app=$("#app"), foot=$("#foot"), footIn=$("#footIn");
const esc=t=>t.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const lvl=q=>S.lvl[q.id]||0;
const mastered=q=>lvl(q)>=2;
function today(){const d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();}
function bumpStreak(){const t=today(); if(S.last===t) return; const y=new Date(Date.now()-864e5); const ys=y.getFullYear()+"-"+(y.getMonth()+1)+"-"+y.getDate(); S.streak = (S.last===ys)? S.streak+1 : 1; S.last=t;}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function home(){
  foot.classList.add("hidden");
  const tot=DATA.length, dom=DATA.filter(mastered).length, pend=DATA.filter(q=>!mastered(q)).length;
  let h=`<header class="top"><div class="logo">⚡</div><div class="brand">REPASO FALLOS<small>Harrison · por especialidades</small></div>
  <div class="chips"><span class="chip">🔥 ${S.streak}</span><span class="chip">⭐ ${S.xp}</span></div></header>
  <section class="hero"><h1>Tus ${tot} fallos, convertidos en aciertos</h1>
  <p>Una pregunta está dominada cuando la aciertas a la primera en 2 sesiones distintas. Si fallas, vuelve al final de la lección hasta que la aciertes.</p>
  <div class="stats"><div class="stat"><b>${tot}</b><span>preguntas</span></div><div class="stat"><b style="color:var(--green)">${dom}</b><span>dominadas</span></div><div class="stat"><b style="color:var(--red)">${pend}</b><span>pendientes</span></div></div>
  <div class="bar" style="margin-top:12px"><i style="width:${tot?dom/tot*100:0}%"></i></div>
  <div class="row"><button class="btn" onclick="start('ALL','pend')">Repaso mixto pendientes</button><button class="btn blue" onclick="start('ALL','all')">Mixto (todas)</button></div>
  <div style="margin-top:14px" class="small">Preguntas por lección:</div>
  <div class="toggle" style="margin-top:6px">${[10,15,25,0].map(n=>`<button class="${S.size===n?'on':''}" onclick="S.size=${n};save();home()">${n?n:'Todas'}</button>`).join("")}</div>
  </section>
  <div class="sec">Especialidades</div><div class="grid">`;
  ORDER.forEach(e=>{const qs=DATA.filter(q=>q.esp===e); if(!qs.length) return; const d=qs.filter(mastered).length;
    h+=`<button class="esp" onclick="start('${e}','pend')"><span class="ic">${ICON[e]}</span><span class="nm">${e}</span><span class="ct">${d}/${qs.length} dominadas</span><div class="bar"><i style="width:${d/qs.length*100}%"></i></div></button>`;});
  h+=`</div><div class="row" style="margin-top:24px"><button class="linkbtn" onclick="if(confirm('¿Borrar todo el progreso?')){S={lvl:{},xp:0,streak:0,last:null,seen:{},size:S.size};save();home();}">Reiniciar progreso</button></div>`;
  app.innerHTML=h; window.scrollTo(0,0);
}

let L=null; // lesson
function start(esp,mode){
  let pool=DATA.filter(q=>esp==='ALL'||q.esp===esp);
  let pend=pool.filter(q=>!mastered(q));
  let chosen = (mode==='pend' && pend.length)? pend : pool;
  chosen = shuffle(chosen.slice()).sort((a,b)=>lvl(a)-lvl(b));
  if(S.size) chosen=chosen.slice(0,S.size);
  chosen=shuffle(chosen);
  L={esp, queue:chosen.map(q=>({q,again:false})), total:chosen.length, done:0, first:{}, wrong:[], xp:0, sel:null, checked:false};
  if(!chosen.length){home();return;}
  render();
}
function render(){
  const it=L.queue[0], q=it.q;
  L.sel=null; L.checked=false;
  const pct=L.done/L.total*100;
  let h=`<div class="qtop"><button class="x" onclick="quit()" aria-label="Salir">✕</button><div class="bar"><i style="width:${pct}%"></i></div><span class="chip">${L.done}/${L.total}</span></div>
  <div class="tag ${it.again?'again':''}">${ICON[q.esp]} ${q.esp}${it.again?' · repetir':''}</div>
  <p class="stem">${esc(q.q)}</p><div class="opts">`;
  q.o.forEach((o,i)=>{h+=`<button class="opt" data-i="${i}" onclick="pick(${i})"><span class="k">${"ABCDEF"[i]}</span><span>${esc(o)}</span></button>`;});
  h+=`</div>`;
  app.innerHTML=h; window.scrollTo(0,0);
  foot.className="foot"; footIn.innerHTML=`<button class="btn" id="chk" disabled onclick="check()">Comprobar</button>`;
}
function pick(i){ if(L.checked) return; L.sel=i; document.querySelectorAll(".opt").forEach(b=>b.classList.toggle("sel",+b.dataset.i===i)); $("#chk").disabled=false; }
function check(){
  if(L.sel===null||L.checked) return; L.checked=true;
  const it=L.queue[0], q=it.q, ok=L.sel===q.a;
  document.querySelectorAll(".opt").forEach(b=>{b.disabled=true;const i=+b.dataset.i; b.classList.remove("sel"); if(i===q.a) b.classList.add("ok"); else if(i===L.sel) b.classList.add("bad");});
  const firstTry = !(q.id in L.first);
  if(firstTry) L.first[q.id]=ok;
  if(ok){ if(firstTry){S.lvl[q.id]=Math.min(3,lvl(q)+1); L.xp+=10;} else L.xp+=5; }
  else { S.lvl[q.id]=0; if(firstTry) L.wrong.push(q); }
  save();
  const ex=esc(q.e).replace(/^(Perla[^:]*:)/m,"<b>$1</b>").replace(/(\(Nota:)/g,"<b>$1</b>");
  foot.className="foot "+(ok?"ok":"bad");
  footIn.innerHTML=`<div class="fb">${ok?'✅ ¡Correcto!':'❌ Respuesta correcta: '+"ABCDEF"[q.a]}</div><div class="exp">${ex}</div><button class="btn" id="cont" onclick="next(${ok})">Continuar</button>`;
}
function next(ok){
  const it=L.queue.shift();
  if(ok){L.done++;} else { it.again=true; const pos=Math.min(L.queue.length, 3+Math.floor(Math.random()*3)); L.queue.splice(pos,0,it); }
  if(!L.queue.length) return finish();
  render();
}
function finish(){
  bumpStreak(); S.xp+=L.xp; save();
  foot.classList.add("hidden");
  const n=L.total, f=L.wrong.length, acc=n?Math.round((n-f)/n*100):0;
  let h=`<div class="end"><div class="big">${acc>=80?'🏆':acc>=50?'💪':'📚'}</div><h2>${acc>=80?'¡Lección superada!':'Lección completada'}</h2>
  <p class="small">${L.esp==='ALL'?'Repaso mixto':L.esp}</p>
  <div class="kpis"><div class="kpi" style="border-color:var(--gold)"><div class="h" style="background:var(--gold)">XP</div><b>+${L.xp}</b></div>
  <div class="kpi" style="border-color:var(--green)"><div class="h" style="background:var(--green)">Precisión</div><b>${acc}%</b></div>
  <div class="kpi" style="border-color:var(--blue)"><div class="h" style="background:var(--blue)">Racha</div><b>🔥 ${S.streak}</b></div></div>`;
  if(f){h+=`<div class="sec" style="text-align:left">Fallos de esta lección (${f})</div><div class="fail-list">`+L.wrong.map(q=>`<div>${esc(q.q.length>140?q.q.slice(0,140)+'…':q.q)}<br><em>→ ${"ABCDEF"[q.a]}. ${esc(q.o[q.a])}</em></div>`).join("")+`</div>`;}
  h+=`<div class="row" style="justify-content:center;margin-top:18px">${f?`<button class="btn red" onclick="retryWrong()">Repetir fallos</button>`:''}<button class="btn" onclick="start('${L.esp}','pend')">Otra lección</button><button class="btn ghost" onclick="home()">Inicio</button></div></div>`;
  app.innerHTML=h; window.scrollTo(0,0);
}
function retryWrong(){const w=L.wrong.slice(); L={esp:L.esp,queue:shuffle(w).map(q=>({q,again:false})),total:w.length,done:0,first:{},wrong:[],xp:0}; render();}
function quit(){ if(confirm("¿Salir de la lección? El progreso de las preguntas ya respondidas se guarda.")) home(); }
document.addEventListener("keydown",e=>{
  if(!L||foot.classList.contains("hidden")) return;
  const n=parseInt(e.key,10);
  if(!L.checked && n>=1 && n<=L.queue[0].q.o.length) pick(n-1);
  const k=e.key.toUpperCase(); if(!L.checked && "ABCDEF".includes(k) && k.length===1 && "ABCDEF".indexOf(k)<L.queue[0].q.o.length) pick("ABCDEF".indexOf(k));
  if(e.key==="Enter"){ if(!L.checked) check(); else { const c=$("#cont"); if(c) c.click(); } }
});
home();
</script>
</body>
</html>
