 será baja.", "La creatinina alcanzará el pico en 3-5 días.", "La diabetes lo predispuso a la nefropatía por contraste.", "La obstrucción tubular por contraste precipitado contribuyó.", "Es probable encontrar cilindros leucocitarios en el sedimento."], "a": 4, "e": "La nefropatía por contraste suele presentar sedimento anodino o con cilindros granulosos/células tubulares, NO cilindros leucocitarios (típicos de NIA/pielonefritis). La FENa puede ser baja (<1%) por vasoconstricción intensa. Cr: se eleva a las 24-48 h, pico a los 3-5 días, recuperación en 7-10 días.\nPerla: prevención: hidratación isotónica en alto riesgo (FG <30); la N-acetilcisteína y el bicarbonato no aportan (PRESERVE)."}, {"esp": "Nefrología", "q": "Mujer de 60 años con HTA y DM2 que inicia diálisis peritoneal por nefropatía diabética. ¿Qué complicaciones de la DP preocupan especialmente?", "o": ["Hiperpotasemia", "Hiperglucemia", "Hiperfosfatemia", "Hipertrigliceridemia", "B y D"], "a": 4, "e": "El líquido de DP usa glucosa como agente osmótico: se absorben 100-300 g/día → hiperglucemia (difícil control en diabéticos), ganancia de peso e hipertrigliceridemia/dislipemia. La DP tiende a producir HIPOpotasemia (pérdida continua de K). Alternativa: icodextrina (y ojo: interfiere con glucómetros GDH-PQQ → falsa hiperglucemia).\nPerla: peritonitis en DP: líquido turbio, >100 leucocitos/µL con >50% PMN."}, {"esp": "Nefrología", "q": "Mujer de 33 años con LMA en remisión, bacteriemia por Pseudomonas resistente a cefepima tratada con gentamicina IV. A los 5 días, Cr de 1,0 a 2,4 sin cilindros hemáticos ni leucocitarios; Mg 1,5 mg/dL; sin hidronefrosis. ¿Mecanismo más probable de la LRA?", "o": ["Nefritis intersticial aguda", "Necrosis tubular aguda (tóxica)", "Glomerulonefritis", "Lesión isquémica", "Obstrucción"], "a": 1, "e": "Los aminoglucósidos se acumulan en el túbulo proximal (captación por megalina) → NTA NO oligúrica a los 5-7 días, con pérdida tubular de Mg, K y Ca (hipomagnesemia típica). Factores de riesgo: duración, dosis, niveles valle altos, depleción de volumen, otros nefrotóxicos.\nPerla: dosis única diaria reduce nefrotoxicidad; monitorizar niveles valle."}, {"esp": "Nefrología", "q": "Paciente de 65 años al 5.º día de ingreso por prerrenal (Cr 3,6 → 2,1). Por lumbalgia se le pauta naproxeno. ¿Por qué mecanismo podría afectar a la función renal?", "o": ["Vasoconstricción de la arteriola aferente", "Nefritis intersticial aguda (hipersensibilidad inmediata)", "Vasoconstricción de la arteriola eferente", "Toxicidad tubular proximal directa", "Obstrucción ureteral"], "a": 0, "e": "En situaciones de hipoperfusión, las prostaglandinas vasodilatan la arteriola aferente para mantener el FG; los AINE bloquean ese mecanismo → vasoconstricción aferente y caída hemodinámica del FG. (Los IECA/ARA-II actúan dilatando la EFERENTE.) La NIA por AINE es más rara y tardía (a menudo con síndrome nefrótico por cambios mínimos).\nPerla: 'triple whammy' = AINE + IECA/ARA-II + diurético.\n(Nota: el enunciado original estaba parcialmente cortado; las opciones A y B se han reconstruido.)"}, {"esp": "Nefrología", "q": "Mujer de 35 años con edemas, proteinuria de 3,5 g/24 h, dolor en flanco izquierdo, Cr 0,7; riñón izquierdo 13 cm y derecho 11,5 cm. Se sospecha trombosis de la vena renal. ¿Qué prueba elegiría?", "o": ["TC de venas renales", "Venografía con contraste", "Angio-RM venosa", "Gammagrafía con DTPA-Tc99m", "Eco-Doppler de venas renales"], "a": 2, "e": "Nefropatía membranosa (la causa más asociada a TVR, 20-35%; también por pérdida de antitrombina) con TVR aguda. Según Harrison, la venografía por RM es la prueba más sensible y específica y no invasiva; la venografía convencional es el patrón oro pero invasiva. En la práctica, la angio-TC es muy utilizada; el Doppler es operador-dependiente.\nPerla: en membranosa con albúmina <2-2,5 g/dL y bajo riesgo hemorrágico, valorar anticoagulación profiláctica (KDIGO 2021)."}, {"esp": "Nefrología", "q": "Todas las siguientes son causas típicas de glomerulonefritis membranosa secundaria, EXCEPTO:", "o": ["Hepatitis B/C", "Neoplasias malignas", "AINE", "LES", "Tuberculosis"], "a": 4, "e": "Membranosa secundaria (~20-30%): infecciones (VHB, VHC, sífilis, paludismo), neoplasias sólidas (pulmón, mama, colon, >60 años), fármacos (AINE, sales de oro, penicilamina, captopril), LES (clase V), sarcoidosis, tiroiditis. La TBC se asocia más a amiloidosis AA.\nPerla: 70-80% de la primaria tiene anti-PLA2R; si PLA2R/THSD7A negativo, buscar causa secundaria (THSD7A también asociado a neoplasia)."}, {"esp": "Digestivo y Nutrición", "q": "Varón de 43 años con disfagia a sólidos y líquidos de 6 meses, dolor retroesternal, regurgitación de alimento no digerido 20-60 min tras comer, pérdida de 7 kg y neumonía previa del LSD. Nunca ha salido de EE. UU. Esofagograma con dilatación esofágica y afilamiento distal 'en pico de pájaro'. ¿Causa más probable?", "o": ["Reacción autoinmune frente a un virus herpes latente", "Espasmo difuso del músculo liso", "Infección por Trypanosoma cruzi", "Adenocarcinoma", "Carcinoma epidermoide"], "a": 0, "e": "Acalasia primaria: pérdida de neuronas inhibitorias (NO/VIP) del plexo mientérico; la hipótesis patogénica más aceptada es una respuesta autoinmune desencadenada por infección latente (VHS-1) en individuos predispuestos (HLA-DQ). Chagas es imposible sin exposición en zona endémica. La pseudoacalasia tumoral sugiere >60 años, evolución <1 año y gran pérdida de peso.\nPerla: diagnóstico con manometría de alta resolución (Chicago 4.0: IRP elevada + aperistalsis); tipo II responde mejor a cualquier tratamiento."}, {"esp": "Digestivo y Nutrición", "q": "Mujer de 44 años con úlcera duodenal de 2 cm H. pylori positiva y melenas. ¿Tratamiento inicial recomendado?", "o": ["Lansoprazol + claritromicina + metronidazol, 14 días", "Pantoprazol + amoxicilina, 21 días", "Pantoprazol + claritromicina, 14 días", "Omeprazol + bismuto + tetraciclina + metronidazol, 14 días", "Omeprazol + metronidazol + claritromicina, 7 días"], "a": 3, "e": "Con resistencia a claritromicina >15% (España y gran parte de Europa/EE. UU.), la triple terapia clásica no es aceptable empíricamente. Primera línea: cuádruple con bismuto 10-14 días (Maastricht VI, ACG 2024, IV Consenso español) o cuádruple concomitante sin bismuto 14 días. Confirmar erradicación ≥4 semanas tras antibiótico y ≥2 semanas sin IBP.\nPerla: en úlcera complicada mantener IBP hasta confirmar erradicación."}, {"esp": "Digestivo y Nutrición", "q": "¿Cuál de las siguientes declaraciones sobre el tratamiento de la ERGE es VERDADERA?", "o": ["Las tasas de C. difficile son menores con IBP.", "Los anti-H2 son más eficaces que los IBP.", "La eficacia de los IBP aumenta sustancialmente al subir la dosis.", "Los IBP son una causa poco frecuente de nefritis intersticial.", "Ensayos aleatorizados han demostrado que la pérdida de peso mejora los síntomas de ERGE."], "a": 3, "e": "Los IBP pueden causar nefritis intersticial aguda (rara, idiosincrásica) y se asocian a ERC. Otros riesgos descritos: C. difficile (mayor, no menor), hipomagnesemia, déficit de B12, fracturas. Doblar dosis aporta beneficio marginal. (La pérdida de peso mejora síntomas en estudios observacionales; la fuente no la considera demostrada en ECA.)\nPerla: pirosis refractaria a IBP doble dosis → pH-impedanciometría sin IBP para distinguir reflujo, hipersensibilidad y pirosis funcional."}, {"esp": "Digestivo y Nutrición", "q": "¿Cuál de los siguientes es un efecto secundario de tratamientos para la enfermedad ulcerosa péptica?", "o": ["La famotidina tiene efecto antiandrogénico con ginecomastia e impotencia.", "La supresión ácida crónica, sobre todo con IBP, se ha vinculado a neumonía comunitaria y a infección por C. difficile.", "El hidróxido de magnesio causa estreñimiento y déficit de fosfato.", "Hay hipersecreción ácida de rebote tras suspender anti-H2 incluso tras 2 meses de uso.", "El hidróxido de aluminio produce síndrome leche-alcalinos."], "a": 1, "e": "Los IBP se asocian (estudios observacionales) a neumonía, C. difficile, hipomagnesemia, déficit de B12/hierro y fracturas. El efecto antiandrogénico es de la CIMETIDINA. El magnesio causa DIARREA; el ALUMINIO estreñimiento e hipofosfatemia. El síndrome leche-alcalinos es por carbonato CÁLCICO. El rebote ácido está descrito sobre todo tras suspender IBP.\nPerla: desprescribir IBP sin indicación clara (reducción escalonada)."}, {"esp": "Digestivo y Nutrición", "q": "Todas las siguientes son indicaciones de endoscopia urgente en la hemorragia digestiva alta aguda, EXCEPTO:", "o": ["Aspirado nasogástrico hemático que no se aclara con lavado", "Hemorragia inicial de gran volumen", "Hipotensión ortostática", "Hipotensión en reposo", "Dolor abdominal intenso"], "a": 4, "e": "Los marcadores de hemorragia grave (inestabilidad, ortostatismo, gran volumen, aspirado persistentemente hemático) indican endoscopia precoz tras estabilización. El dolor intenso no es indicación de endoscopia; al contrario, obliga a descartar perforación antes (Rx/TC).\nPerla (ESGE): endoscopia en ≤24 h tras reanimación en la HDA no varicosa; <12 h si sospecha de varices. Transfundir con Hb <7 g/dL (<8 si cardiopatía). Glasgow-Blatchford ≤1 → manejo ambulatorio."}, {"esp": "Digestivo y Nutrición", "q": "Varón de 64 años con cirrosis, hemorragia digestiva masiva, confusión, Hb 6,9, FC 115, PA 90/55. Además de la reanimación y transfusión, todos los siguientes son apropiados AHORA, EXCEPTO:", "o": ["Escleroterapia endoscópica", "Ligadura endoscópica de varices", "Octreótido", "Propranolol", "TIPS"], "a": 3, "e": "En la hemorragia varicosa aguda: vasoactivos (octreótido/terlipresina/somatostatina) al ingreso, ceftriaxona profiláctica, endoscopia <12 h con ligadura (escleroterapia si no es posible) y TIPS preventivo en Child C 10-13 o B >7 con sangrado activo (Baveno VII). Los betabloqueantes no selectivos están CONTRAINDICADOS en fase aguda con hipotensión (se inician en la profilaxis secundaria).\nPerla: evitar sobretransfusión (Hb objetivo 7-8): aumenta la presión portal."}, {"esp": "Digestivo y Nutrición", "q": "En el mismo paciente cirrótico con hemorragia por varices, todas las siguientes podrían usarse para evitar NUEVAS hemorragias (profilaxis secundaria), EXCEPTO:", "o": ["Betabloqueante no selectivo (propranolol, carvedilol)", "Octreótido subcutáneo diario", "Trasplante hepático", "Ligaduras repetidas", "TIPS"], "a": 1, "e": "Profilaxis secundaria estándar: BBNS + ligaduras periódicas hasta erradicar; TIPS si recidiva; valorar trasplante. El octreótido se usa solo en la fase aguda (2-5 días), no a largo plazo.\nPerla: carvedilol es de elección en profilaxis primaria (Baveno VII), por mayor reducción del GPVH."}, {"esp": "Digestivo y Nutrición", "q": "Varón de 34 años (HSH, ADVP previo) con ictericia, fiebre, dolor en hipocondrio derecho, AST 1.232, ALT 1.560, bilirrubina 13,4, INR 2,3. En este cuadro compatible con hepatitis B aguda, ¿mejor método para prevenir la hepatitis CRÓNICA?", "o": ["IgG contra hepatitis A", "Lamivudina", "Interferón pegilado + ribavirina", "Prednisona 1 mg/kg/día", "No hacer nada y observar: >95-99% de los adultos inmunocompetentes se recupera"], "a": 4, "e": "La hepatitis B aguda en adultos inmunocompetentes se cronifica en <1-5%; el tratamiento antiviral no está indicado para prevenir la cronicidad. Matiz actual: la hepatitis B aguda GRAVE (INR >1,5, ictericia prolongada, fallo hepático) sí se trata con entecavir o tenofovir para evitar fallo hepático, no para prevenir cronicidad (y valorar trasplante).\nPerla: cronificación: 90% en neonatos, 20-50% en niños 1-5 años, <5% en adultos."}, {"esp": "Digestivo y Nutrición", "q": "¿Por qué la infección neonatal por VHB no produce inflamación hepatocelular significativa a edad temprana?", "o": ["La exposición efectiva de linfocitos T específicos produce falta de respuesta.", "El VHB no cruza la placenta fácilmente.", "La exposición intrauterina/perinatal induce tolerancia inmunitaria.", "Los anticuerpos maternos anti-HBc confieren inmunidad.", "Las células NK son poco eficaces a esa edad."], "a": 2, "e": "El HBeAg atraviesa la placenta e induce tolerancia de linfocitos T específicos: fase de 'inmunotolerancia' (HBeAg+, carga viral muy alta, ALT normal, mínima inflamación) que puede durar décadas. El daño hepático en la hepatitis B es inmunomediado (el virus no es citopático).\nPerla: prevenir la transmisión vertical: vacuna + IGHB al neonato en <12 h y tenofovir materno en el 3.er trimestre si DNA >200.000 UI/mL."}, {"esp": "Digestivo y Nutrición", "q": "Mujer de 38 años originaria de Tailandia con transaminasas elevadas: AST 346, ALT 412; HBsAg+, HBeAg+, anti-HBc IgG+, anti-VHC−. DNA-VHB 4,8×10⁴ UI/mL. ¿Qué fármaco está indicado?", "o": ["Aciclovir", "Entecavir", "Ritonavir", "Simeprevir", "No es necesario tratar"], "a": 1, "e": "Hepatitis B crónica HBeAg positiva en fase inmunoactiva: DNA >20.000 UI/mL y ALT >2×LSN → tratar (EASL 2017/AASLD). Primera línea: entecavir o tenofovir (TDF o TAF), alta barrera a resistencias. Peg-IFN es alternativa en casos seleccionados.\nPerla (EASL 2025 amplía indicaciones): tratar también con DNA >2.000 y ALT elevada o fibrosis ≥F2, y cirrosis con DNA detectable."}, {"esp": "Digestivo y Nutrición", "q": "¿Cuál es verdadera sobre la lesión hepática inducida por fármacos (DILI)?", "o": ["La hepatitis tóxica directa es indistinguible de la viral.", "La hepatotoxicidad directa es predecible y dosis-dependiente.", "Las reacciones idiosincrásicas son fáciles de identificar por su histología.", "La incidencia de DILI es mayor en hepatopatía crónica.", "La ictericia en un ensayo fase 3 no predice hepatotoxicidad grave poscomercialización."], "a": 1, "e": "Hepatotoxicidad intrínseca (directa): dosis-dependiente, predecible, latencia corta (paracetamol, metotrexato). Idiosincrásica: impredecible, latencia variable, no dependiente de dosis, sin histología específica (diagnóstico de exclusión; escala RUCAM). La hepatopatía previa no aumenta claramente la incidencia (pero sí la gravedad).\nPerla: ley de Hy: ALT >3×LSN + bilirrubina >2×LSN por DILI hepatocelular → mortalidad ~10% (señal de alarma en ensayos)."}, {"esp": "Digestivo y Nutrición", "q": "Varón de 55 años con cirrosis por MASH que presenta encefalopatía. Todo lo siguiente puede desencadenarla, EXCEPTO:", "o": ["Deshidratación", "Hiperpotasemia", "Hipopotasemia", "Incumplimiento terapéutico (lactulosa)", "Peritonitis bacteriana espontánea"], "a": 1, "e": "La HIPOpotasemia aumenta la amoniogénesis renal (y la alcalosis favorece la difusión de NH3 al SNC). Otros desencadenantes: infecciones (PBE), HDA, estreñimiento, deshidratación/diuréticos, sedantes, hiponatremia, TIPS.\nPerla: tratar el desencadenante + lactulosa (objetivo 2-3 deposiciones blandas); rifaximina añadida para prevenir recurrencias."}, {"esp": "Digestivo y Nutrición", "q": "¿Cuál de los siguientes es verdad sobre las pruebas bioquímicas hepáticas?", "o": ["La GGT elevada es específica de colestasis.", "La IgM elevada es marcador de hepatitis autoinmune.", "El factor VIII bajo indica hepatopatía crónica.", "Los >60 años pueden tener fosfatasa alcalina ligeramente elevada (hasta 1,5×LSN).", "La albúmina es un buen marcador de gravedad en la lesión aguda."], "a": 3, "e": "La FA aumenta fisiológicamente en ancianos, adolescentes (hueso) y embarazo (placenta). La GGT es sensible pero poco específica (alcohol, fármacos inductores). IgM alta → CBP; IgG alta → HAI. El factor VIII es de síntesis endotelial y está NORMAL/ALTO en cirrosis (útil para distinguir de CID). La albúmina (vida media ~20 días) refleja cronicidad, no gravedad aguda.\nPerla: FA elevada + GGT normal → origen óseo."}, {"esp": "Digestivo y Nutrición", "q": "Mujer de 43 años con fatiga: AST 150, ALT 165, FA 125, bilirrubina 1,2, INR 0,9. ¿Qué perfil describe mejor la bioquímica?", "o": ["Colestásico", "Cirrótico", "Hepatocelular", "Mixto", "Peritonítico"], "a": 2, "e": "Índice R = (ALT/LSN)/(FA/LSN): con ALT ~4×LSN y FA ~1×LSN, R >5 → hepatocelular. R <2 colestásico; 2-5 mixto.\nPerla: estudio de hipertransaminasemia: virus, alcohol, MASLD, fármacos, HAI (IgG, ANA, AML), hemocromatosis (IST, ferritina), Wilson (<40 años), α1-AT, celiaquía, tiroides, músculo (CK)."}, {"esp": "Digestivo y Nutrición", "q": "Mujer de 41 años con ictericia y prurito de 1 semana, sin fiebre ni dolor. Bilirrubina 6 (directa 5,1), AST 84, ALT 92, FA 662. TC normal; ecografía: vesícula normal, colédoco no visualizado. ¿Siguiente paso?", "o": ["Antibióticos y observación", "CPRE", "Serología de hepatitis", "Gammagrafía HIDA", "Anticuerpos antimitocondriales"], "a": 1, "e": "Colestasis marcada con colédoco no visualizado en la ecografía: no se ha excluido obstrucción extrahepática (cálculos en colédoco distal escapan a la eco/TC). En el esquema de Harrison, la vía biliar no evaluable obliga a colangiografía directa (CPRE, diagnóstica y terapéutica). En la práctica actual, si la probabilidad de coledocolitiasis es intermedia, se prefiere antes colangio-RM o ecoendoscopia (ASGE 2019).\nPerla: vía biliar no dilatada y bien visualizada → AMA (CBP), fármacos, colangio-RM (CEP)."}, {"esp": "Digestivo y Nutrición", "q": "Mujer de 32 años con anorexia, dolor periumbilical que migra a FID, T 38,2 °C, FC 105, dolor en FID, exploración pélvica normal y test de embarazo negativo. ¿Qué prueba de imagen tiene mayor probabilidad de confirmar el diagnóstico?", "o": ["TC abdominal", "Colonoscopia", "Ecografía pélvica", "Rx simple de abdomen", "Ecografía abdominal"], "a": 0, "e": "En adultos, la TC tiene sensibilidad y especificidad >95% para apendicitis y detecta diagnósticos alternativos (la TC sin contraste o de baja dosis también es muy precisa). La ecografía es la primera opción en niños, embarazadas y jóvenes delgadas, pero es operador-dependiente.\nPerla: puntuación de Alvarado/AIR para estratificar; el tratamiento antibiótico solo es opción en apendicitis no complicada sin apendicolito (CODA)."}, {"esp": "Digestivo y Nutrición", "q": "Varón de 44 años con DM2 insulinizado, obesidad (IMC 32), esteatosis ecográfica y transaminasas 2×LSN, sin alcohol. Se sospecha MASLD/NAFLD. Todas son verdaderas, EXCEPTO:", "o": ["La cirugía bariátrica es segura en NAFLD.", "El ejercicio reduce la esteatosis.", "Las estatinas pueden agravar la inflamación en NAFLD.", "No había tratamientos aprobados por la FDA para NAFLD (en la fecha de la fuente).", "La vitamina E puede reducir aminotransferasas y esteatosis."], "a": 2, "e": "Las estatinas son seguras en MASLD (incluso con transaminasas elevadas) y deben usarse por el alto riesgo cardiovascular; incluso se asocian a menor progresión. Vitamina E (PIVENS) en no diabéticos con MASH; pioglitazona y arGLP-1 útiles.\nPerla (actualización): resmetirom (agonista THR-β, 2024) y semaglutida (2025) aprobados por la FDA para MASH F2-F3; la opción D ya no es cierta hoy."}, {"esp": "Digestivo y Nutrición", "q": "¿Cuál de las siguientes declaraciones sobre la secreción enzimática pancreática es verdadera?", "o": ["La acetilcolina es un neurotransmisor importante que estimula la secreción enzimática.", "Todas las enzimas pancreáticas tienen pH óptimo ácido.", "Todas se secretan en forma activa.", "Los receptores de CCK de las células acinares humanas son clave en la secreción.", "La enterocinasa activa el VIP, que escinde los cimógenos."], "a": 0, "e": "La secreción enzimática está mediada por ACh (vagal) y CCK; en humanos la CCK actúa sobre todo a través de aferencias vagales (hay pocos receptores CCK-A en el acino humano) liberando ACh. Las enzimas actúan a pH alcalino (el bicarbonato neutraliza el ácido). Las proteasas se secretan como cimógenos; la enterocinasa duodenal activa el tripsinógeno a tripsina, que activa el resto.\nPerla: la secretina estimula agua y bicarbonato (células ductales)."}, {"esp": "Digestivo y Nutrición", "q": "Mujer de 26 años, embarazada de 3 meses, con ictericia asintomática. Bilirrubina total 6 (directa 5), AST, ALT y FA normales; sin prurito ni visceromegalias. ¿Causa más probable?", "o": ["Colestasis intrahepática benigna recurrente", "Colestasis del embarazo", "Crigler-Najjar tipo 2", "Síndrome de Dubin-Johnson", "Síndrome HELLP"], "a": 3, "e": "Hiperbilirrubinemia CONJUGADA aislada con enzimas normales = Dubin-Johnson (MRP2/ABCC2) o Rotor. Los estrógenos (embarazo, anticonceptivos) la hacen aflorar. La colestasis gravídica produce prurito y ácidos biliares elevados (3.er trimestre); Crigler-Najjar es NO conjugada; HELLP es del 3.er trimestre con hemólisis y trombopenia.\nPerla: Dubin-Johnson: hígado negro (pigmento), coproporfirina I >80% en orina; benigno."}, {"esp": "Digestivo y Nutrición", "q": "¿Cuál de las siguientes sobre la fisiopatología del síndrome del intestino irritable es verdadera?", "o": ["La distensión y flatulencia se deben a mayor cantidad de gas intestinal.", "Los pacientes tienen respuestas sensitivas REDUCIDAS a la estimulación visceral.", "La disbiosis junto con factores genéticos y ambientales puede alterar la permeabilidad, aumentar la presentación antigénica y activar mastocitos.", "Casi todos tienen inflamación mucosa persistente.", "La mayoría refiere una gastroenteritis al inicio."], "a": 2, "e": "SII = trastorno de la interacción intestino-cerebro: HIPERsensibilidad visceral, alteración de motilidad, disbiosis, permeabilidad aumentada con activación de mastocitos en un subgrupo. El volumen de gas es normal (el problema es su manejo y la percepción). El SII posinfeccioso afecta a ~10% tras gastroenteritis, no a la mayoría.\nPerla: Roma IV: dolor ≥1 día/semana en 3 meses asociado a defecación o cambio de frecuencia/consistencia."}, {"esp": "Digestivo y Nutrición", "q": "Mujer de 32 años, consumo intenso de alcohol, con fiebre 38,4 °C, ictericia, hepatomegalia dolorosa, AST 431/ALT 198, bilirrubina 8,6, TP 29 s (control 13), INR 2,2. ¿Mejor estrategia terapéutica?", "o": ["Fluidos, tiamina, folato y observar", "Fluidos, tiamina, folato e imipenem esperando hemocultivos", "Prednisolona 40 mg/día 4 semanas y luego descenso", "Consulta quirúrgica por colecistitis"], "a": 2, "e": "Hepatitis alcohólica grave: Maddrey = 4,6×(29−13) + 8,6 ≈ 82 (≥32) / MELD >20 → prednisolona 40 mg/día 28 días si no hay infección activa ni HDA (STOPAH: beneficio a 28 días). Evaluar respuesta con Lille al día 7 (≥0,45 → suspender). La fiebre y la leucocitosis son habituales en la hepatitis alcohólica; cribar infecciones antes.\nPerla: abstinencia = principal factor pronóstico a largo plazo; valorar trasplante precoz en no respondedores seleccionados."}, {"esp": "Digestivo y Nutrición", "q": "¿Cuál es verdadera sobre la hepatotoxicidad farmacológica?", "o": ["La lesión por amiodarona se resuelve días después de suspenderla.", "La lesión por fenitoína rara vez se acompaña de síntomas sistémicos.", "La toxicidad por valproato es más frecuente en déficits mitocondriales y puede mejorar con L-carnitina IV.", "El clavulanato reduce la hepatotoxicidad de la amoxicilina.", "La toxicidad por nitrofurantoína aparece poco después de iniciarla."], "a": 2, "e": "Valproato: esteatosis microvesicular/hiperamonemia; riesgo en niños <2 años, politerapia y mitocondriopatías (POLG) → L-carnitina IV. Amiodarona: lipofílica con vida media de semanas-meses (persiste). Fenitoína: hipersensibilidad (DRESS) con fiebre, exantema, adenopatías y eosinofilia. Amoxicilina-clavulánico: la causa más frecuente de DILI (colestásica, atribuida al clavulanato). Nitrofurantoína: hepatitis crónica autoinmune-like tras meses/años.\nPerla: DRESS: RegiSCAR; latencia 2-8 semanas."}, {"esp": "Digestivo y Nutrición", "q": "Mujer de 44 años con cálculos biliares hallados incidentalmente (múltiples, el mayor de 2,8 cm, algunos en el cuello), asintomáticos tras tratar su úlcera gástrica. ¿Qué se le recomienda?", "o": ["Colecistectomía profiláctica por tamaño y número", "No tratar salvo cólicos frecuentes/incapacitantes o complicaciones", "Colecistectomía solo si pancreatitis o colangitis", "El riesgo de colecistitis es del 5-10% anual", "Ácido ursodesoxicólico 6 meses"], "a": 1, "e": "La colelitiasis asintomática tiene riesgo de síntomas/complicaciones ~1-2%/año: no se opera. Excepciones que justifican colecistectomía profiláctica: cálculos >3 cm, vesícula en porcelana, pólipos ≥10 mm, anomalía de la unión biliopancreática, anemias hemolíticas, población de alto riesgo de cáncer vesicular (nativos americanos), cirugía bariátrica.\nPerla: el ursodesoxicólico solo disuelve cálculos de colesterol pequeños (<1 cm) no calcificados con vesícula funcionante."}, {"esp": "Digestivo y Nutrición", "q": "Todas las siguientes son posibles ventajas de la colangio-RM sobre la CPRE, EXCEPTO:", "o": ["Adquisición de imágenes más rápida", "Mayor sensibilidad para lesiones ampulares", "Sin radiación ionizante", "Sin riesgo de pancreatitis", "No requiere contraste"], "a": 1, "e": "La CPRE (con duodenoscopio de visión lateral) permite ver directamente la papila, biopsiarla y es terapéutica; la colangio-RM es peor para lesiones ampulares y cálculos <5 mm. La colangio-RM no es invasiva, no irradia y no requiere contraste (usa agua de la bilis en T2).\nPerla: pancreatitis post-CPRE 3-10% → indometacina rectal + stent pancreático en alto riesgo."}, {"esp": "Digestivo y Nutrición", "q": "¿Cuál de los siguientes trastornos se clasificaría mejor como desnutrición relacionada con INANICIÓN (sin inflamación)?", "o": ["Traumatismo craneal cerrado", "Depresión mayor", "Accidente de tráfico", "Cáncer de páncreas", "Obesidad sarcopénica"], "a": 1, "e": "Clasificación ASPEN/GLIM: desnutrición por inanición pura (sin inflamación: anorexia nerviosa, depresión con hiporexia), asociada a enfermedad crónica con inflamación leve-moderada (cáncer, EPOC, IC, obesidad sarcopénica) y asociada a lesión aguda con inflamación intensa (sepsis, traumatismos, quemados, TCE).\nPerla: criterios GLIM: fenotípico (pérdida de peso, IMC bajo, masa muscular) + etiológico (ingesta reducida o inflamación)."}, {"esp": "Digestivo y Nutrición", "q": "¿Cuál de los siguientes representa la MAYOR pérdida diaria de agua?", "o": ["Evaporación y espiración (pérdidas insensibles)", "Fiebre", "Gasto fecal normal", "Embarazo", "Diuresis con dieta muy pobre en solutos"], "a": 0, "e": "Las pérdidas insensibles (piel y respiración) son ~500-1.000 mL/día (~0,5 mL/kg/h), superiores al agua fecal normal (~100-200 mL). Con una dieta muy pobre en solutos la diuresis obligatoria cae (orina máximamente concentrada se necesita poco volumen). La fiebre añade ~10-15% por cada grado, pero partiendo de lo insensible.\nPerla: necesidades basales de agua ≈ 30-35 mL/kg/día (1 mL/kcal)."}, {"esp": "Digestivo y Nutrición", "q": "Mujer de 78 años con fiebre, anorexia, dolor en FII de 3 días y leucocitosis. ¿Cuál es verdadera sobre su trastorno más probable?", "o": ["Suelen verse niveles hidroaéreos en la Rx simple.", "Menos del 25% presenta signos de irritación peritoneal.", "La hemorragia digestiva baja suele verse en la angio-TC.", "No es necesario encontrar engrosamiento de la pared en la TC para el diagnóstico.", "La ecografía pélvica es la mejor prueba."], "a": 1, "e": "Diverticulitis aguda: la TC con contraste es la prueba de elección (engrosamiento de la pared, trabeculación de la grasa, divertículos ± absceso/perforación). Según la fuente, la mayoría no tiene peritonismo difuso. La hemorragia diverticular no suele coexistir con diverticulitis.\nPerla: diverticulitis no complicada en inmunocompetentes → puede tratarse sin antibióticos (DIABOLO, AVOD); colonoscopia a las 6-8 semanas si complicada o sin colonoscopia reciente."}, {"esp": "Digestivo y Nutrición", "q": "¿Cuál de las siguientes es verdadera sobre el mecanismo de lesión en la hepatitis autoinmune?", "o": ["La hepatitis viral aguda nunca se ha vinculado con el desarrollo de HAI.", "Los autoanticuerpos lesionan directamente los hepatocitos.", "El depósito de inmunocomplejos es un mecanismo principal.", "Los macrófagos son las principales células efectoras.", "El mimetismo molecular con antígenos de reacción cruzada activa linfocitos T citotóxicos."], "a": 4, "e": "La HAI está mediada por linfocitos T (CD4 y CD8 citotóxicos) frente a autoantígenos hepatocitarios, con pérdida de tolerancia favorecida por mimetismo molecular (virus como VHA, VEB, VHS, fármacos como nitrofurantoína, minociclina) en individuos HLA-DR3/DR4. Los autoanticuerpos (ANA, AML, anti-LKM1) son marcadores, no efectores.\nPerla: histología: hepatitis de interfase con células plasmáticas, emperipolesis y rosetas."}, {"esp": "Digestivo y Nutrición", "q": "Mujer de 34 años con fatiga, artralgias, sinovitis leve de manos, febrícula, ictericia, hepatomegalia dolorosa, AST 542, ALT 657, FA 102, bilirrubina 5,3. Solo toma 1-2 comprimidos de paracetamol/día. ¿Qué prueba tendría la MENOR probabilidad de ser positiva en este diagnóstico?", "o": ["ANA con patrón homogéneo", "Anti-LKM", "Anticuerpos antimitocondriales", "Hipergammaglobulinemia", "Factor reumatoide"], "a": 2, "e": "Hepatitis autoinmune (mujer joven, hepatocelular, manifestaciones extrahepáticas): ANA/AML (tipo 1), anti-LKM1 (tipo 2, niños), hipergammaglobulinemia IgG; FR a veces positivo. Los AMA son el marcador de colangitis biliar primaria (patrón colestásico); pueden aparecer en síndromes de solapamiento pero son los menos probables.\nPerla: respuesta rápida a prednisona ± azatioprina apoya el diagnóstico (score simplificado IAIHG)."}, {"esp": "Digestivo y Nutrición", "q": "Mujer de 21 años con torsade de pointes y parada cardiaca; K 1,2 mEq/L; IMC 14,6, lanugo. ¿Cuál es verdadera sobre su estado nutricional?", "o": ["La mortalidad suele deberse a complicaciones de la desnutrición.", "La mala cicatrización e infecciones cutáneas son frecuentes.", "La inflamación sistémica predomina en las pruebas de laboratorio.", "La albúmina casi siempre es <2,8 g/dL.", "Pliegue tricipital <3 mm y circunferencia de brazo <15 cm son criterios diagnósticos útiles."], "a": 4, "e": "Desnutrición por inanición pura (anorexia nerviosa, tipo marasmo): la albúmina suele estar CONSERVADA (sin inflamación, a diferencia del kwashiorkor); la cicatrización y la inmunidad están relativamente preservadas. Las medidas antropométricas (pliegue tricipital, circunferencia del brazo) sí son útiles. La mortalidad se debe sobre todo a arritmias (hipopotasemia, QT largo) y suicidio.\nPerla: riesgo de síndrome de realimentación → iniciar despacio (10-20 kcal/kg) con tiamina y reposición de P, K, Mg."}, {"esp": "Digestivo y Nutrición", "q": "¿Cuál de las siguientes declaraciones sobre las pruebas de función hepática es cierta?", "o": ["La ALT se encuentra en hígado, miocardio, músculo y riñón.", "Elevaciones de AST y ALT >1.000 UI/L son típicas de la hepatitis isquémica.", "La AST es más específica de lesión hepática que la ALT.", "AST/ALT >3 es típico de la hepatitis viral aguda.", "La magnitud de la elevación de transaminasas tiene gran valor pronóstico."], "a": 1, "e": "Transaminasas >1.000: hepatitis viral aguda, isquémica (típicamente >1.000 con descenso rápido y LDH muy alta), tóxica (paracetamol), coledocolitiasis aguda (transitoria), HAI. La ALT es más específica (sobre todo hepática); la AST también está en músculo, corazón, riñón, cerebro, hematíe. AST/ALT >2 sugiere alcohol. La magnitud NO predice el pronóstico (sí el INR, bilirrubina, encefalopatía).\nPerla: hepatitis isquémica: ALT/LDH <1,5."}, {"esp": "Digestivo y Nutrición", "q": "Todos los siguientes pueden relacionarse con aumento de la amilasa sérica, EXCEPTO (según la clave de la fuente):", "o": ["Carcinoma esofágico", "Obstrucción intestinal", "Parotiditis", "Embarazo", "Insuficiencia renal"], "a": 3, "e": "Hiperamilasemia no pancreática: glándulas salivales (parotiditis), insuficiencia renal (menor aclaramiento), macroamilasemia, obstrucción/isquemia/perforación intestinal, cetoacidosis, tumores productores de amilasa ectópica (pulmón, ESÓFAGO, ovario), embarazo ectópico roto. La clave de la app da el embarazo (normal) como excepción.\nPerla: la lipasa es más específica y permanece elevada más tiempo; la amilasa no se correlaciona con la gravedad de la pancreatitis."}, {"esp": "Digestivo y Nutrición", "q": "Varón de 63 años con DM e IAM previo, en UCI por sepsis neumocócica que requirió dosis altas de noradrenalina. Al descender vasopresores, dolor abdominal intenso, distensión, heces sanguinolentas, abdomen silente y niveles hidroaéreos en delgado. ¿Diagnóstico más probable?", "o": ["Embolia arterial", "Colitis por C. difficile", "EII", "Isquemia mesentérica no oclusiva", "Trombosis venosa mesentérica"], "a": 3, "e": "Isquemia mesentérica no oclusiva: hipoperfusión esplácnica por bajo gasto/shock y vasopresores (vasoconstricción mesentérica), típica en UCI, cirugía cardiaca, diálisis. Diagnóstico con angio-TC; angiografía permite infundir papaverina intraarterial. La embolia suele asociarse a FA y dolor desproporcionado brusco.\nPerla: el lactato es tardío e inespecífico; alto índice de sospecha."}, {"esp": "Digestivo y Nutrición", "q": "Niño de 3 años recién llegado de Indonesia con placas blancas de epitelio queratinizado en la conjuntiva bulbar. ¿Tratamiento más apropiado?", "o": ["Biotina", "Piridoxina", "Vitamina A 200.000 UI VO los días 1, 2 y 14-15", "Vitamina B12", "Vitamina C"], "a": 2, "e": "Manchas de Bitot = xeroftalmía por déficit de vitamina A (primera causa de ceguera prevenible en niños). Pauta OMS en >12 meses: 200.000 UI VO días 1, 2 y 14 (100.000 UI en 6-12 meses; 50.000 en <6 meses). También reduce mortalidad por sarampión.\nPerla: otras manifestaciones: ceguera nocturna (precoz), queratomalacia, hiperqueratosis folicular."}, {"esp": "Digestivo y Nutrición", "q": "Varón de 54 años con diarrea de 1 mes, 8-10 deposiciones/día y pérdida de 3,6 kg. Heces 500 g/24 h; osmolalidad fecal medida 200 mOsm/kg y calculada 210 mOsm/kg. ¿Causa más probable?", "o": ["Enfermedad celíaca", "Pancreatitis crónica", "Déficit de lactasa", "Tumor productor de VIP", "Enfermedad de Whipple"], "a": 3, "e": "La brecha osmótica fecal (osmolalidad medida − 2×[Na+K]) es aquí ≈ 200 − 210 ≈ 0: los electrolitos explican toda la osmolalidad → diarrea SECRETORA (brecha <50). En la diarrea osmótica (déficit de lactasa, laxantes con Mg, sorbitol) la brecha es >100-125 y cede con el ayuno. Diarrea secretora de gran volumen (>1 L/día) que persiste en ayunas → VIPoma: diarrea acuosa, hipopotasemia, aclorhidria (WDHA).\nPerla: osmolalidad medida <250 sugiere contaminación con agua u orina diluida."}, {"esp": "Reumatología e Inmunología", "q": "Varón de 58 años con caídas de objetos, dificultad para levantarse y disfagia. Fuerza 4/5 en extensión de rodilla y 3/5 en flexores de los dedos, atrofia medial de muslos y antebrazos. CK 2×LSN. ¿Qué es probable ver en la biopsia muscular con microscopia óptica?", "o": ["Necrosis y regeneración multifocal con escasa inflamación", "Atrofia perifascicular", "Infiltrado perivascular sin inflamación endomisial", "Vacuolas ribeteadas e inclusiones", "Atrofia de fibras tipo 2"], "a": 3, "e": "Miositis por cuerpos de inclusión: >50 años, varones, debilidad asimétrica de flexores profundos de los dedos y cuádriceps, disfagia, CK normal o poco elevada, refractaria a corticoides. Biopsia: vacuolas ribeteadas, inclusiones (TDP-43, p62), infiltrado endomisial CD8 invadiendo fibras no necróticas. Anti-cN1A en ~30-60%. A = miopatía necrosante; B = dermatomiositis; C = dermatomiositis/perivascular.\nPerla: sospechar MCI ante 'polimiositis refractaria'."}, {"esp": "Reumatología e Inmunología", "q": "En pacientes con artritis reumatoide establecida, todos los siguientes hallazgos radiológicos pulmonares pueden explicarse por la AR, EXCEPTO:", "o": ["Infiltrados intersticiales bilaterales", "Bronquiectasias", "Infiltrado lobar (consolidación)", "Nódulo pulmonar solitario", "Derrame pleural unilateral"], "a": 2, "e": "Afectación pulmonar de la AR: EPID (NIU > NINE), nódulos reumatoides (solitarios o múltiples; Caplan con neumoconiosis), derrame pleural (exudado con glucosa muy baja, pH bajo, FR+), bronquiectasias, bronquiolitis obliterante/folicular. Un infiltrado lobar sugiere neumonía (inmunosupresión) y no la enfermedad de base.\nPerla: ojo con neumonitis por metotrexato (subaguda, vidrio deslustrado, eosinofilia) y TBC con anti-TNF."}, {"esp": "Reumatología e Inmunología", "q": "En EE. UU., ¿qué porcentaje de mayores de 60 años tiene artrosis sintomática de rodilla?", "o": ["1%", "5%", "12%", "30%", "43%"], "a": 2, "e": "Artrosis sintomática de rodilla ≈ 12% en >60 años (radiológica en un porcentaje mucho mayor, >30%). Es la artropatía más frecuente y una de las principales causas de discapacidad.\nPerla: la discordancia clínico-radiológica es la norma: la gravedad radiológica se correlaciona mal con el dolor."}, {"esp": "Reumatología e Inmunología", "q": "Varón de 52 años con artritis de 2.ª y 3.ª MCF bilaterales, ferritina elevada y mutación HFE: hemocromatosis. ¿Cuál es verdadera sobre su artropatía?", "o": ["La 2.ª-3.ª MCF también se afectan típicamente en la artrosis primaria.", "Es poco probable que se relacione con la hemocromatosis.", "La artropatía puede progresar pese a las flebotomías.", "Ocurre en <20% de los pacientes.", "Las radiografías mostrarán probablemente erosiones en MCF."], "a": 2, "e": "La artropatía hemocromatósica (20-40%; a veces primera manifestación) afecta 2.ª-3.ª MCF (localización atípica de artrosis primaria), con osteofitos 'en gancho', pinzamiento y condrocalcinosis (CPPD), sin erosiones. No mejora (y puede progresar) con la depleción de hierro, a diferencia de otras manifestaciones.\nPerla: artrosis de MCF → pensar en hemocromatosis, CPPD, trabajo manual intenso."}, {"esp": "Reumatología e Inmunología", "q": "Varón de 55 años con sarcoidosis, sin prednisona desde hace 2 meses, con Ca 12,2 mg/dL. ¿Mecanismo de la hipercalcemia?", "o": ["Afectación granulomatosa ósea directa", "Estimulación directa de la absorción intestinal de calcio", "Aumento de PTH", "Aumento de la producción de 1,25-(OH)2-vitamina D", "Aumento de la producción de 25-OH-vitamina D"], "a": 3, "e": "Los macrófagos del granuloma expresan 1α-hidroxilasa no regulada por PTH → exceso de calcitriol → absorción intestinal y resorción ósea; PTH suprimida. Ocurre en TBC, linfomas, micosis. Responde a corticoides (± hidroxicloroquina/ketoconazol) y evitar sol/suplementos de vitamina D.\nPerla: hipercalciuria es más frecuente (~40%) que hipercalcemia (~10%) en sarcoidosis."}, {"esp": "Reumatología e Inmunología", "q": "¿Qué articulación con frecuencia NO presenta artrosis?", "o": ["Columna cervical", "Interfalángicas distales", "Cadera", "Interfalángicas proximales", "Muñeca"], "a": 4, "e": "La artrosis primaria afecta IFD, IFP, trapeciometacarpiana, columna cervical/lumbar, cadera, rodilla y 1.ª MTF. Suele respetar muñeca, codo, hombro, tobillo y MCF; su afectación sugiere artrosis secundaria (traumatismo, CPPD, hemocromatosis, ocupación).\nPerla: IFD (Heberden) / IFP (Bouchard)."}, {"esp": "Reumatología e Inmunología", "q": "Mujer de 28 años con urticaria por frío de >10 años, dermografismo y prueba del cubito de hielo (agua fría) positiva. Sin atopia; toma anticonceptivos. ¿Siguiente paso?", "o": ["Anticuerpos antitiroideos", "Niveles de inhibidor de C1", "Suspender anticonceptivos", "Cetirizina 10 mg/día", "Ciproheptadina 8 mg/día"], "a": 3, "e": "Urticaria crónica inducible por frío (+ dermografismo): tratamiento con antihistamínicos H1 de 2.ª generación, pudiendo subir hasta 4 veces la dosis (EAACI/GA²LEN); omalizumab si refractaria. El C1-INH se estudia en angioedema SIN habones. Descartar crioglobulinas/crioaglutininas si es atípica.\nPerla: advertir del riesgo de anafilaxia al bañarse en agua fría."}, {"esp": "Reumatología e Inmunología", "q": "Se observan acropaquias (hipocratismo digital) en un varón de 42 años. Todas las enfermedades siguientes se asocian a este hallazgo, EXCEPTO:", "o": ["EPOC", "Cardiopatía congénita cianógena", "Fibrosis quística", "Carcinoma hepatocelular", "Hipertiroidismo (acropaquia tiroidea)"], "a": 0, "e": "La EPOC NO produce acropaquias; su presencia en un EPOC obliga a descartar cáncer de pulmón o bronquiectasias. Causas: neoplasias pulmonares, bronquiectasias/FQ, abscesos, FPI, cardiopatías cianógenas, endocarditis, EII, cirrosis/hepatocarcinoma, Graves (acropaquia tiroidea).\nPerla: osteoartropatía hipertrófica = acropaquias + periostitis + artritis (carcinoma pulmonar no microcítico)."}, {"esp": "Reumatología e Inmunología", "q": "¿En qué porcentaje de estadounidenses con espondilitis anquilosante está presente el HLA-B27?", "o": ["10%", "30%", "50%", "80%", "100%"], "a": 3, "e": "HLA-B27 en ~80-90% de pacientes blancos con EA (menor en afroamericanos, ~50%), frente al 6-8% de la población general. Solo ~5% de portadores B27 desarrolla EA. Su utilidad es aumentar la probabilidad pretest en lumbalgia inflamatoria.\nPerla: criterios ASAS de espondiloartritis axial: sacroileítis en imagen + ≥1 rasgo, o HLA-B27 + ≥2 rasgos."}, {"esp": "Reumatología e Inmunología", "q": "La fiebre reumática es un proceso autoinmune. ¿Cuál es el principal mecanismo?", "o": ["Anomalías endocrinas", "Mayor función de linfocitos B", "Desequilibrio intrínseco de citocinas", "Aumento de linfocitos T colaboradores por citocinas", "Mimetismo molecular"], "a": 4, "e": "Anticuerpos y linfocitos T frente a la proteína M y el carbohidrato del estreptococo del grupo A reaccionan de forma cruzada con miosina cardiaca, tropomiosina, laminina valvular, queratina y gangliósidos de núcleos basales (corea).\nPerla: solo tras faringitis estreptocócica (no piodermitis) — la GN postestreptocócica sí puede seguir a ambas."}, {"esp": "Reumatología e Inmunología", "q": "¿Qué afección es casi el doble de frecuente en la esclerosis sistémica cutánea DIFUSA que en la limitada?", "o": ["Afectación esofágica", "HAP", "Fibrosis pulmonar", "Raynaud", "Afectación cutánea"], "a": 2, "e": "ES difusa: afectación proximal rápida, EPID (anti-Scl-70/topoisomerasa I), crisis renal (anti-RNA pol III) y miocardiopatía más frecuentes y precoces. ES limitada (anticentrómero): HAP tardía más frecuente, calcinosis, telangiectasias (CREST). Raynaud y afectación esofágica ~90% en ambas.\nPerla: nintedanib y tocilizumab aprobados en EPID-ES; crisis renal → IECA (captopril), evitar prednisona >15 mg/día."}, {"esp": "Reumatología e Inmunología", "q": "¿Cuál de las siguientes afirmaciones sobre la artrosis es verdadera?", "o": ["La RM está justificada en el estudio de toda articulación presuntamente artrósica.", "El dolor se produce por estimulación de receptores del dolor del propio cartílago.", "Es la segunda causa de artritis tras la AR.", "El líquido sinovial suele tener <1.000 leucocitos/µL.", "La gravedad radiológica se correlaciona bien con los síntomas."], "a": 3, "e": "Líquido no inflamatorio (<2.000 leucocitos/µL, habitualmente <1.000). El cartílago es aneural: el dolor procede de hueso subcondral (edema), sinovitis, cápsula, ligamentos y sensibilización central. Es la artritis MÁS frecuente. El diagnóstico es clínico ± Rx; la RM no es necesaria de rutina.\nPerla: tratamiento: ejercicio y pérdida de peso (base), AINE tópicos en rodilla/mano, infiltración de corticoides en brotes."}, {"esp": "Reumatología e Inmunología", "q": "Los pacientes con AR tienen mayor riesgo de todas las siguientes afecciones respecto a la población general, EXCEPTO:", "o": ["Cáncer colorrectal", "Cardiopatía isquémica", "Hipoandrogenismo", "Linfoma", "Osteoporosis"], "a": 0, "e": "La AR aumenta el riesgo cardiovascular (~1,5-2 veces; factor multiplicador 1,5 en EULAR), linfoma (DLBCL, relacionado con la actividad inflamatoria), cáncer de pulmón y piel, osteoporosis e hipogonadismo. El riesgo de cáncer COLORRECTAL está DISMINUIDO (probablemente por el uso crónico de AINE).\nPerla: la mortalidad en AR es sobre todo cardiovascular → control de actividad y de FRCV."}, {"esp": "Reumatología e Inmunología", "q": "La mayoría de las manifestaciones de la fiebre reumática aparecen ~3 semanas tras la faringitis estreptocócica. ¿Cuál puede aparecer varios meses después?", "o": ["Corea (de Sydenham)", "Eritema marginado", "Fiebre", "Poliartritis", "Nódulos subcutáneos"], "a": 0, "e": "La corea de Sydenham tiene una latencia larga (1-8 meses), puede aparecer aislada y cuando ya no hay evidencia serológica (ASLO normal); por eso basta la corea para diagnosticar FR (criterios de Jones). Más frecuente en mujeres jóvenes; autolimitada.\nPerla: la corea sola no necesita evidencia de infección previa en los criterios de Jones."}, {"esp": "Reumatología e Inmunología", "q": "Varón de 22 años ADVP con xerostomía, tumefacción parotídea bilateral, pérdida de peso y sudoración nocturna, sin xeroftalmía. ANA, anti-Ro y anti-La negativos; Rx de tórax normal. ¿Diagnóstico más probable?", "o": ["Infección por VIH (síndrome de linfocitosis infiltrativa difusa)", "Enfermedad relacionada con IgG4", "Sjögren primario", "AR con Sjögren secundario", "Sarcoidosis"], "a": 0, "e": "DILS: infiltración de glándulas salivales por linfocitos CD8 en infección VIH (sobre todo no tratada), con síndrome seco y parotidomegalia, típicamente seronegativo (sin anti-Ro/La). Varón joven con factor de riesgo y síntomas constitucionales.\nPerla: diagnóstico diferencial del síndrome seco: VIH, VHC, IgG4, sarcoidosis, linfoma, amiloidosis, radioterapia, EICH."}, {"esp": "Reumatología e Inmunología", "q": "Mujer de 42 años, camarera, fumadora, con HTA (hidroclorotiazida) y anticonceptivos, con dolor plantar del talón derecho muy intenso en los primeros pasos de la mañana; pies planos; Rx con espolón calcáneo. Todas son ciertas, EXCEPTO:", "o": ["Los espolones calcáneos no son diagnósticos.", "La infiltración de corticoides conlleva riesgo de rotura de la fascia plantar.", "Los anticonceptivos orales y el tabaquismo son factores de riesgo.", "Las plantillas ortopédicas pueden ser útiles.", "El pronóstico es bueno."], "a": 2, "e": "Fascitis plantar: factores de riesgo = obesidad, pies planos o cavos, bipedestación prolongada, carrera, dorsiflexión limitada del tobillo, espondiloartritis. Anticonceptivos y tabaco no lo son. El espolón aparece en 50% de asintomáticos. >80% se resuelve en 12 meses con estiramientos, plantillas, AINE.\nPerla: fascitis bilateral en joven → pensar en espondiloartritis (entesitis)."}, {"esp": "Reumatología e Inmunología", "q": "Varón de 60 años con psoriasis en infliximab desde hace 1 año; mialgias, artralgias y erupción malar nuevas; ANA 1:320. ¿Qué autoanticuerpo es más probable?", "o": ["Anti-β2-glucoproteína", "Anti-CCP", "Anti-dsDNA", "Antihistonas", "Antiperoxidasa tiroidea"], "a": 3, "e": "Lupus inducido por fármacos: antihistonas en >90% (procainamida, hidralazina, isoniazida, minociclina, anti-TNF). Con anti-TNF es peculiar: hasta 90% puede tener también anti-dsDNA (a diferencia del lupus clásico por fármacos), pero la respuesta canónica es antihistonas. Se resuelve al suspender el fármaco.\nPerla: afectación renal y neurológica es rara en el lupus inducido."}, {"esp": "Reumatología e Inmunología", "q": "Joven de 19 años de Etiopía con FA reciente (metoprolol + warfarina), corea en la infancia y 3 episodios de artritis migratoria; soplos de valvulopatía mitral (doble lesión) y aórtica. Se deriva a cirugía valvular. ¿Qué otra intervención debe considerarse?", "o": ["AAS diario", "Doxiciclina diaria", "Corticoides a dosis bajas", "Penicilina G benzatina mensual (profilaxis secundaria)", "Penicilina solo cuando tenga faringitis"], "a": 3, "e": "Cardiopatía reumática establecida: profilaxis secundaria con penicilina G benzatina IM cada 3-4 semanas; con carditis y valvulopatía residual, durante 10 años o hasta los 40 años (lo que sea más largo), a veces de por vida. Es la intervención más coste-efectiva para evitar progresión.\nPerla: en FA con estenosis mitral moderada-grave → warfarina (no ACOD; INVICTUS)."}, {"esp": "Reumatología e Inmunología", "q": "¿Cuál es la manifestación clínica MÁS frecuente de la fiebre reumática aguda?", "o": ["Carditis", "Corea", "Eritema marginado", "Poliartritis", "Nódulos subcutáneos"], "a": 3, "e": "Poliartritis migratoria de grandes articulaciones (60-75%), muy sensible a AAS/AINE. La carditis (50-60%, pancarditis con valvulitis mitral) es la más grave y la única que deja secuelas. En poblaciones de alto riesgo, monoartritis o poliartralgia bastan como criterio mayor (Jones 2015).\nPerla: la ecocardiografía detecta carditis subclínica, que cuenta como criterio mayor."}, {"esp": "Reumatología e Inmunología", "q": "Todas las siguientes afirmaciones sobre las inmunodeficiencias primarias son ciertas, EXCEPTO:", "o": ["Las infecciones respiratorias altas o bajas sugieren defecto de anticuerpos.", "La mayoría se diagnostica por infecciones recurrentes o inusualmente graves.", "Las candidiasis recurrentes sugieren deterioro de la inmunidad T.", "Suelen ser genéticas con herencia mendeliana.", "La inmunidad innata no se ve afectada por estos trastornos."], "a": 4, "e": "Las IDP afectan también la inmunidad innata: defectos de fagocitos (EGC, LAD), complemento (C5-C9 → Neisseria), receptores tipo Toll/IRAK4/MyD88 (neumococo), NK, eje IL-12/IFN-γ (micobacterias). Anticuerpos → bacterias encapsuladas en vías respiratorias; linfocitos T → virus, hongos, oportunistas.\nPerla: la IDP sintomática más frecuente en adultos es la inmunodeficiencia común variable."}, {"esp": "Reumatología e Inmunología", "q": "Mujer de 32 años con LES de larga evolución; nuevo soplo y vegetación mitral en el ecocardiograma; afebril y sin síntomas. ¿Cuál es verdadera?", "o": ["Es poco probable que los hemocultivos sean positivos.", "Los glucocorticoides mejoran esta lesión.", "Suele acompañarse de pericarditis.", "Tiene bajo riesgo embólico.", "Está usando drogas intravenosas a escondidas."], "a": 0, "e": "Endocarditis de Libman-Sacks (verrugosa, estéril), muy asociada a anticuerpos antifosfolípido; en cara auricular de la mitral. Hemocultivos negativos (siempre deben obtenerse para descartar endocarditis infecciosa). Riesgo embólico relevante (ictus) → anticoagulación si embolia o SAF. Los corticoides no la mejoran.\nPerla: endocarditis trombótica no bacteriana también en cáncer avanzado (adenocarcinoma mucinoso)."}, {"esp": "Reumatología e Inmunología", "q": "Los siguientes fármacos tienen eficacia como FAME en la artritis reumatoide, EXCEPTO:", "o": ["Infliximab", "Leflunomida", "Metotrexato", "Naproxeno", "Rituximab"], "a": 3, "e": "Los AINE (naproxeno) alivian síntomas pero no modifican la progresión radiológica. FAME sintéticos: metotrexato (ancla), leflunomida, sulfasalazina, hidroxicloroquina; biológicos: anti-TNF, abatacept, rituximab, tocilizumab/sarilumab; dirigidos: JAK (ojo MACE/neoplasia en >65 fumadores, ORAL Surveillance).\nPerla EULAR 2022: MTX + corticoide puente, objetivo remisión/baja actividad en 6 meses (mejora ≥50% a los 3)."}, {"esp": "Endocrinología", "q": "¿Qué dato de laboratorio confirma el diagnóstico de hipotiroidismo SECUNDARIO (central)?", "o": ["TSH elevada", "T4 libre alta", "TSH baja", "T4 libre baja", "TSH normal"], "a": 3, "e": "En el hipotiroidismo central la TSH puede ser baja, normal o incluso algo elevada (TSH biológicamente inactiva), así que no sirve para el diagnóstico: lo que lo confirma es la T4L baja con TSH inapropiadamente no elevada. Se monitoriza con T4L (no TSH).\nPerla: antes de iniciar levotiroxina en hipotiroidismo central, descartar/tratar insuficiencia suprarrenal."}, {"esp": "Endocrinología", "q": "Todas se relacionan con T4 total elevada con T4 libre normal, EXCEPTO:", "o": ["Cirrosis (↑TBG)", "Síndrome del eutiroideo enfermo", "Hipertiroxinemia disalbuminémica familiar", "Exceso familiar de TBG", "Embarazo"], "a": 1, "e": "T4 total alta con libre normal = aumento de proteínas transportadoras: TBG (estrógenos, embarazo, hepatitis/cirrosis inicial, tamoxifeno, genética) o albúmina/transtiretina anómalas. En el eutiroideo enfermo (enfermedad no tiroidea) la T3 está BAJA (↓deiodinasa 1, ↑rT3) y, en graves, también la T4 total baja.\nPerla: no estudiar la función tiroidea en el paciente crítico salvo sospecha fundada."}, {"esp": "Endocrinología", "q": "Mujer de 36 años con hipotiroidismo, síndrome de ovario poliquístico y dos embarazos con HTA gestacional; abuela con ictus y madre con cáncer de colon. ¿Qué la sitúa en mayor riesgo de DM2?", "o": ["Antecedente familiar de ictus", "HTA gestacional", "Hipotiroidismo", "SOP", "B y D"], "a": 4, "e": "Factores de riesgo de DM2 (ADA): SOP (resistencia insulínica), HTA, antecedente de diabetes gestacional o macrosomía, familiares de primer grado con DM, obesidad, sedentarismo, etnia, prediabetes, VIH. La HTA gestacional/preeclampsia también se asocia a futuro riesgo cardiometabólico.\nPerla: cribado en adultos ≥35 años o con sobrepeso + ≥1 factor de riesgo."}, {"esp": "Endocrinología", "q": "Todas las siguientes son causas de hipomagnesemia, EXCEPTO:", "o": ["Diarrea", "Etanol", "Hipotiroidismo", "Malabsorción intestinal", "Déficit de vitamina D"], "a": 2, "e": "Causas de hipomagnesemia: digestivas (diarrea, malabsorción, IBP, síndrome del intestino corto), renales (diuréticos de asa/tiazidas, aminoglucósidos, cisplatino, anfotericina, calcineurínicos, alcohol, Gitelman), hungry bone, pancreatitis. El hipotiroidismo no la produce (el hipertiroidismo puede aumentar su excreción).\nPerla: la hipomagnesemia causa hipopotasemia refractaria e hipocalcemia (↓PTH) → reponer Mg primero."}, {"esp": "Endocrinología", "q": "Mujer de 75 años con cardiopatía isquémica e hipotiroidismo recién diagnosticado. ¿Cuál es verdadera sobre la interacción hipotiroidismo-sistema cardiovascular?", "o": ["Se acompaña de volumen sistólico disminuido.", "El flujo sanguíneo se deriva hacia la piel.", "Aumenta la contractilidad.", "El derrame pericárdico es raro.", "Disminuyen las resistencias periféricas."], "a": 0, "e": "Hipotiroidismo: ↓contractilidad y ↓volumen sistólico, bradicardia, ↑RVS (HTA diastólica), vasoconstricción cutánea (piel fría), derrame pericárdico frecuente (~30%, rara vez taponamiento), dislipemia.\nPerla: en ancianos con cardiopatía isquémica, iniciar levotiroxina a dosis bajas (12,5-25 µg/día) y subir lentamente."}, {"esp": "Endocrinología", "q": "Varón de 45 años con feocromocitoma (metanefrinas elevadas, masa suprarrenal derecha de 3 cm) que se presentó con crisis hipertensiva (250/140) y PRES. ¿Cuál es verdadera sobre el tratamiento?", "o": ["El betabloqueo está absolutamente contraindicado incluso tras α-bloqueo adecuado.", "Está indicada la cirugía inmediata por la crisis hipertensiva.", "Se restringen sal y líquidos.", "Fenoxibenzamina hasta dosis máxima 2-3 semanas y no operar hasta PA <180/100.", "La fentolamina IV está indicada en la crisis hipertensiva."], "a": 4, "e": "Crisis hipertensiva por feocromocitoma: fentolamina IV (o nitroprusiato/nicardipino). Preparación preoperatoria: α-bloqueo 7-14 días (fenoxibenzamina o doxazosina) con dieta RICA en sal y líquidos (reexpansión de volumen); betabloqueante solo DESPUÉS del α-bloqueo si hay taquicardia. Objetivo PA <130/80 sentado, no <180/100.\nPerla: nunca betabloquear primero (estimulación α sin oposición → crisis)."}, {"esp": "Endocrinología", "q": "Recién nacido 46,XX con genitales ambiguos (fusión labial, clitoromegalia) y 17-OH-progesterona elevada. ¿Qué anomalía bioquímica puede encontrarse?", "o": ["Cortisol elevado", "Hiperglucemia", "Hipernatremia", "Hipopotasemia", "Hiponatremia"], "a": 4, "e": "Hiperplasia suprarrenal congénita por déficit de 21-hidroxilasa (forma pierde-sal en ~75% de las clásicas): déficit de cortisol y aldosterona → hiponatremia, hiperpotasemia, hipovolemia e hipoglucemia (crisis a la 1.ª-2.ª semana); andrógenos elevados → virilización en 46,XX.\nPerla: cribado neonatal con 17-OHP; tratamiento con hidrocortisona + fludrocortisona + sal."}, {"esp": "Endocrinología", "q": "Varón de 75 años con obesidad abdominal, miopatía proximal e HIPERPIGMENTACIÓN de 1-2 meses; alcalosis metabólica hipopotasémica. Sospecha de Cushing. ¿Cuál es verdadera?", "o": ["La ACTH basal probablemente sea baja.", "La CRH circulante probablemente esté elevada.", "La RM hipofisaria mostrará todos los tumores productores de ACTH.", "Está indicado cateterismo urgente de senos petrosos.", "Un K sérico <3,3 mmol/L sugiere producción ectópica de ACTH."], "a": 4, "e": "Síndrome de ACTH ectópica (microcítico, carcinoides): instauración rápida, hiperpigmentación, hipopotasemia marcada (el cortisol muy elevado satura la 11β-HSD2 y actúa sobre el receptor mineralocorticoide), alcalosis, poco fenotipo cushingoide. ACTH ALTA. La RM no ve ~40% de los microadenomas; el cateterismo de senos petrosos distingue hipofisario vs ectópico pero no es urgente.\nPerla: hipopotasemia en ~90% de ectópicos vs ~10% de Cushing hipofisario."}, {"esp": "Endocrinología", "q": "Todos los siguientes son factores de riesgo de hipoglucemia en diabetes, EXCEPTO:", "o": ["Enfermedad coronaria", "Neuropatía autonómica", "Insuficiencia renal", "Déficit absoluto de insulina", "HbA1c por debajo del objetivo"], "a": 0, "e": "Factores de riesgo: déficit absoluto de insulina (DM1, DM2 avanzada), hipoglucemias previas/inadvertidas, neuropatía autonómica (falta de síntomas adrenérgicos), ERC (menor aclaramiento de insulina/sulfonilureas y menor gluconeogénesis renal), control glucémico intensivo, edad avanzada, alcohol, ejercicio. La coronariopatía es una CONSECUENCIA de riesgo (la hipoglucemia puede precipitar eventos), no un factor de riesgo.\nPerla: hipoglucemia inadvertida → evitar estrictamente hipoglucemias 2-3 semanas restaura los síntomas."}, {"esp": "Endocrinología", "q": "¿Con qué frecuencia se encuentran anticuerpos contra células de los islotes en pacientes con DM1 de nuevo diagnóstico?", "o": ["10%", "25%", "50%", "85%", "100%"], "a": 3, "e": "~85% tiene ≥1 autoanticuerpo (ICA, anti-GAD65, IA-2, anti-insulina, ZnT8). Los anti-GAD son los más útiles en adultos (LADA). La presencia de ≥2 autoanticuerpos en familiares predice DM1 (estadio 1) con riesgo ~70% a 10 años.\nPerla: teplizumab (anti-CD3) retrasa ~2-3 años el paso a DM1 clínica en estadio 2."}, {"esp": "Endocrinología", "q": "Varón de 57 años con DM2 e IAM previo, preocupado por el peso; intolerancia a metformina (diarrea) e hipoglucemias con glipizida; función cardiaca normal. ¿Mejor fármaco a continuación?", "o": ["Exenatida (arGLP-1)", "Glimepirida", "Repaglinida", "Rosiglitazona"], "a": 0, "e": "arGLP-1: pérdida de peso, sin hipoglucemia intrínseca y beneficio cardiovascular demostrado (liraglutida LEADER, semaglutida SUSTAIN-6/SELECT, dulaglutida REWIND; exenatida semanal fue neutra en EXSCEL). En enfermedad CV establecida, ADA/EASD recomiendan arGLP-1 o iSGLT2 con beneficio probado, independientemente de HbA1c. Sulfonilureas/glinidas: hipoglucemia y peso; glitazonas: peso, edema, IC.\nPerla: hoy se elegiría semaglutida o liraglutida (o tirzepatida) por evidencia CV."}, {"esp": "Endocrinología", "q": "Mujer de 37 años con obesidad, sed intensa, nicturia y dos candidiasis vaginales en el último año. ¿Estudio inicial más apropiado para diabetes?", "o": ["HbA1c", "SOG", "Péptido C", "Insulinemia", "Glucemia plasmática al azar"], "a": 4, "e": "Con síntomas clásicos de hiperglucemia, una glucemia al azar ≥200 mg/dL confirma el diagnóstico sin necesidad de repetir (ADA). HbA1c ≥6,5% y glucemia en ayunas ≥126 requieren confirmación en asintomáticos; la HbA1c es menos sensible y puede no reflejar hiperglucemia de rápida instauración.\nPerla: interferencias con HbA1c: anemia, hemoglobinopatías, ERC, embarazo, transfusión reciente."}, {"esp": "Endocrinología", "q": "Varón de 55 años alcohólico y diabético ingresado en UCI por neumonía neumocócica con shock, tratado con insulina IV, líquidos, omeprazol y nutrición enteral. Al 2.º día la Cr mejora (3,1 → 1,6) pero el fosfato es 1,0 mg/dL. Todas son causas de su hipofosfatemia, EXCEPTO:", "o": ["Lesión renal aguda", "Alcoholismo", "Insulina", "Desnutrición/realimentación", "Sepsis"], "a": 0, "e": "La insuficiencia renal causa HIPERfosfatemia (menor excreción). Hipofosfatemia en este contexto: redistribución intracelular por insulina, realimentación (síndrome de realimentación), alcalosis respiratoria/sepsis, alcoholismo (malnutrición, pérdidas renales, hipomagnesemia), antiácidos.\nPerla: fosfato <1 mg/dL → rabdomiólisis, debilidad respiratoria, disfunción miocárdica, hemólisis → reposición IV."}, {"esp": "Endocrinología", "q": "¿Cuál de los siguientes pacientes debe tratarse con IECA o ARA-II?", "o": ["Mujer de 24 años con DM1 y dos microalbuminurias positivas separadas una semana", "Mujer de 32 años con DM1, glucemia 328 y una microalbuminuria positiva", "Varón de 48 años con DM2 y una microalbuminuria positiva tras iniciar ejercicio", "Varón de 66 años con DM2 y dos microalbuminurias positivas separadas 3 meses", "Varón de 62 años con DM2 e HTA, una microalbuminuria con PA 190/113 ese día"], "a": 3, "e": "La albuminuria (CAC 30-300 mg/g) debe confirmarse en 2 de 3 muestras en 3-6 meses, ya que hay falsos positivos por ejercicio, fiebre, hiperglucemia grave, HTA muy elevada, ICC, infección urinaria o menstruación. Solo D cumple la confirmación adecuada.\nPerla (KDIGO/ADA): DM2 con ERC y albuminuria → IECA/ARA-II + iSGLT2 (± finerenona, ± arGLP-1)."}, {"esp": "Endocrinología", "q": "Varón de 72 años institucionalizado, con EPOC grave, ictus previo e IMC 18,5; se sospecha déficit de vitamina D. ¿Mejor prueba para confirmarlo?", "o": ["1,25-(OH)2-vitamina D", "25-OH-vitamina D", "Fosfatasa alcalina", "PTH", "Calcio total e iónico"], "a": 1, "e": "La 25-OH-D refleja los depósitos (vida media ~2-3 semanas). La 1,25-(OH)2-D puede ser normal o alta en el déficit (por hiperparatiroidismo secundario) y solo se mide en sospecha de producción extrarrenal (sarcoidosis) o defectos de la 1α-hidroxilasa/ERC.\nPerla: déficit <20 ng/mL; insuficiencia 20-30 (Endocrine Society)."}, {"esp": "Endocrinología", "q": "Mujer de 72 años con fractura de cadera; 25-OH-vitamina D de 18 ng/mL. ¿Qué se recomienda?", "o": ["Vitamina D3 800 UI/día", "D3 800 UI/día + calcio 1.500 mg/día", "D3 2.000 UI/día", "D3 2.000 UI/día + calcio 1.500 mg/día", "D3 50.000 UI/semana 4 semanas, luego 800 UI/semana + calcio"], "a": 3, "e": "La clave de Harrison es D3 2.000 UI/día + calcio (la ingesta total recomendada de calcio es 1.000-1.200 mg/día sumando dieta; suplementar solo lo que falte). En fractura por fragilidad, además del aporte de Ca/vitD, debe iniciarse tratamiento antiosteoporótico (zoledronato tras fractura de cadera reduce refracturas y mortalidad; HORIZON-RFT).\nPerla: los suplementos de vitamina D sin déficit no previenen fracturas (VITAL)."}, {"esp": "Endocrinología", "q": "Varón de 18 años con pancreatitis aguda, hepatoesplenomegalia, xantomas eruptivos y TG 1.019 mg/dL; se sospecha déficit de lipoproteína lipasa. Tras estabilizarse, ¿tratamiento recomendado?", "o": ["Restricción de grasa dietética a ~15 g/día (<10-15% de calorías)", "Aceite de pescado", "Gemfibrozilo", "Ácido nicotínico", "Simvastatina"], "a": 0, "e": "Síndrome de quilomicronemia familiar (LPL, APOC2, APOA5, GPIHBP1, LMF1): los fármacos que actúan vía LPL (fibratos, omega-3) son poco eficaces. La base es la restricción grasa muy estricta (<15-20 g/día) ± aceite MCT (se absorben por vía portal sin formar quilomicrones), evitar alcohol y estrógenos. Nuevos: volanesorsén, olezarsén (anti-APOC3).\nPerla: TG >1.000 mg/dL → riesgo de pancreatitis; hipertrigliceridemia puede dar pseudohiponatremia."}, {"esp": "Endocrinología", "q": "¿Cuál de los siguientes trastornos causa concentraciones BAJAS de colesterol LDL?", "o": ["Anorexia nerviosa", "Colestasis", "Hipotiroidismo", "Síndrome nefrótico", "Enfermedad hepática grave"], "a": 4, "e": "La insuficiencia hepatocelular grave reduce la síntesis de lipoproteínas (LDL bajo). Elevan el LDL: hipotiroidismo (↓receptores LDL), síndrome nefrótico, colestasis (lipoproteína X), anorexia nerviosa (paradójicamente), fármacos (ciclosporina, tiazidas, retinoides).\nPerla: LDL muy bajo también en hipobetalipoproteinemia (APOB, PCSK9 pérdida de función), malabsorción, hipertiroidismo y cáncer."}, {"esp": "Endocrinología", "q": "Todas las siguientes son causas de hipopituitarismo adquirido, EXCEPTO:", "o": ["Amiloidosis", "Ipilimumab", "Sarcoidosis", "Hemorragia subaracnoidea", "LES"], "a": 4, "e": "Hipopituitarismo adquirido: tumores (adenomas, craneofaringioma), cirugía/radioterapia, infiltrativas (sarcoidosis, hemocromatosis, histiocitosis, amiloidosis), hipofisitis (autoinmune, IgG4, inhibidores de checkpoint — ipilimumab/anti-CTLA-4), traumatismo craneal, HSA, Sheehan, apoplejía hipofisaria, infecciones. El LES no es causa reconocida.\nPerla: hipofisitis por ipilimumab → déficit de ACTH frecuente y a menudo permanente."}, {"esp": "Endocrinología", "q": "Durante la lactancia, la prolactina elevada produce todo lo siguiente, EXCEPTO:", "o": ["Anovulación", "Estrógenos bajos", "Aumento de la esteroidogénesis gonadal", "Acortamiento de la fase lútea", "Supresión de GnRH"], "a": 2, "e": "La hiperprolactinemia inhibe la pulsatilidad de GnRH (vía kisspeptina) → ↓LH/FSH → anovulación, fase lútea corta e hipoestrogenismo; también inhibe directamente la esteroidogénesis gonadal (no la aumenta). Base de la amenorrea de la lactancia.\nPerla: hiperprolactinemia en varón → ↓libido, disfunción eréctil; macroadenomas más frecuentes al diagnóstico."}, {"esp": "Endocrinología", "q": "¿Cuál de los siguientes trastornos causa descenso SECUNDARIO de la secreción de vasopresina (AVP)?", "o": ["Craneofaringioma", "Litio", "Cirugía hipofisaria", "Polidipsia primaria", "Sarcoidosis"], "a": 3, "e": "En la polidipsia primaria (psicógena o dipsogénica) la ingesta excesiva de agua reduce la osmolalidad y suprime fisiológicamente la AVP (descenso secundario). Craneofaringioma, cirugía y sarcoidosis producen diabetes insípida central (déficit primario de AVP); el litio causa DI nefrogénica.\nPerla: copeptina estimulada con arginina o salino hipertónico: distingue DI central (<4,9 pmol/L) de polidipsia primaria (>4,9)."}, {"esp": "Endocrinología", "q": "Varón de 37 años con azoospermia, talla alta, testículos pequeños, ginecomastia y escaso vello: síndrome de Klinefelter. ¿Cuál es verdadera?", "o": ["Los andrógenos son poco útiles.", "Su riesgo de cáncer de mama no está aumentado.", "Tiene estrógenos plasmáticos elevados.", "La mayoría se diagnostica antes de la pubertad.", "FSH y LH están bajas."], "a": 2, "e": "Klinefelter (47,XXY): hipogonadismo PRIMARIO (FSH y LH altas, testosterona baja-normal) con aumento relativo de estradiol (↑aromatización, ↑SHBG) → ginecomastia. Riesgo de cáncer de mama ~20-50 veces mayor, tumores de células germinales mediastínicos, DM, TEV, osteoporosis. La mayoría se infradiagnostica o se detecta en la edad adulta por infertilidad. La testosterona mejora virilización, hueso y ánimo.\nPerla: micro-TESE puede recuperar espermatozoides en ~40-50%."}, {"esp": "Endocrinología", "q": "Varón de 75 años con disfunción eréctil y disminución de la libido, ánimo deprimido, fatiga, lentitud cognitiva y menor capacidad física; testosterona total 200 ng/dL. ¿En qué síntoma se espera la mejora MÁS significativa con testosterona?", "o": ["Función cognitiva", "Depresión", "Función sexual (eréctil/libido)", "Fatiga", "Movilidad física"], "a": 2, "e": "Testosterone Trials (TTrials) en >65 años con testosterona baja: mejoría modesta de la función sexual (libido, actividad sexual, erección), leve del ánimo; sin beneficio en vitalidad/fatiga, cognición ni función física. Confirmar hipogonadismo con 2 determinaciones matinales en ayunas.\nPerla: TRAVERSE (2023): testosterona no aumentó MACE, pero sí FA, TEP y LRA."}, {"esp": "Endocrinología", "q": "Mujer de 38 años fumadora de 1 paquete/día, con HTA bien controlada con amlodipino; abuela con cáncer de ovario y padre con ictus. ¿Cuál es contraindicación absoluta para anticonceptivos orales combinados?", "o": ["Edad >35 años + tabaquismo", "Antecedente familiar de cáncer de ovario", "Antecedente familiar de ictus", "HTA controlada"], "a": 0, "e": "Criterios OMS/CDC categoría 4: ≥35 años y ≥15 cigarrillos/día, HTA ≥160/100 o con vasculopatía, TEV previa o trombofilia, migraña con aura, cardiopatía isquémica/ictus, cáncer de mama actual, cirrosis descompensada/adenoma hepático, <21 días posparto. La HTA controlada es categoría 3. Los AOC reducen el riesgo de cáncer de ovario.\nPerla: alternativa: gestágeno solo (DIU-LNG, implante, desogestrel)."}, {"esp": "Endocrinología", "q": "Varón de 19 años con talla baja, pubertad retrasada, daltonismo y anosmia: síndrome de Kallmann. ¿Tratamiento más apropiado para inducir pubertad/fertilidad?", "o": ["IECA", "Estrógenos cíclicos", "Gonadotropina coriónica (hCG) ± FSH", "Insulina", "Hormona tiroidea"], "a": 2, "e": "Hipogonadismo hipogonadotropo congénito con anosmia (KAL1/ANOS1, FGFR1…): el defecto está en la GnRH, por lo que la hCG (actividad LH → testosterona intratesticular) + FSH recombinante induce virilización y espermatogénesis; alternativa: GnRH pulsátil. La testosterona virilizaría pero no produce fertilidad.\nPerla: hasta 10-20% de hipogonadismos hipogonadotropos congénitos revierten en la edad adulta."}, {"esp": "Endocrinología", "q": "Todos los siguientes causan disfunción testicular al reducir la testosterona, EXCEPTO:", "o": ["Alcohol", "Cirrosis", "Ketoconazol", "Marihuana", "Radioterapia en la adolescencia"], "a": 3, "e": "Ketoconazol inhibe la esteroidogénesis (CYP17); el alcohol es tóxico testicular directo; la cirrosis combina fallo testicular e hipofisario; la radioterapia daña células de Leydig en niños/adolescentes. La marihuana se asocia a alteraciones espermáticas pero NO inhibe la síntesis de testosterona (según la fuente).\nPerla: espironolactona bloquea la acción androgénica; la quimioterapia daña sobre todo la espermatogénesis → banco de semen."}, {"esp": "Endocrinología", "q": "Mujer de 28 años con amenorrea secundaria de 6 meses tras años de reglas regulares; β-hCG negativa, testosterona y DHEA-S normales, PROLACTINA elevada y FSH disminuida. ¿Diagnóstico más probable?", "o": ["Síndrome de insensibilidad androgénica", "Tumor neuroendocrino (prolactinoma)", "SOP", "Embarazo", "Insuficiencia ovárica prematura"], "a": 1, "e": "Hiperprolactinemia con hipogonadismo hipogonadotropo → adenoma hipofisario productor de prolactina (tumor neuroendocrino hipofisario, PitNET). Descartar embarazo, fármacos (antipsicóticos, metoclopramida), hipotiroidismo, ERC y efecto 'tallo'. IOP: FSH ALTA; SOP: andrógenos elevados, FSH normal.\nPerla: tratamiento de primera línea: cabergolina (incluso macroadenomas con afectación visual)."}, {"esp": "Endocrinología", "q": "Pareja con infertilidad: mujer de 35 años con 14 años de AOC suspendidos hace 16 meses, ciclos de 35-60 días, antecedente de EPI gonocócica; varón de 39 años con lisinopril y consumo previo de marihuana. ¿Cuál es verdadera?", "o": ["No hace falta confirmar ovulación: sus ciclos son regulares con mastalgia.", "Debe suspenderse de inmediato el lisinopril del varón por teratogenia.", "Debe valorarse la permeabilidad tubárica (histerosalpingografía); si hay daño importante, considerar FIV para reducir el riesgo de ectópico.", "El uso prolongado de AOC causó anovulación e infertilidad.", "La marihuana es la causa probable de su infertilidad."], "a": 2, "e": "Antecedente de EPI → riesgo de factor tubárico (y de embarazo ectópico): HSG obligada; con daño tubárico relevante, FIV. Ciclos de 35-60 días sugieren oligoovulación → confirmarla. El uso prolongado de AOC no causa infertilidad. El IECA del varón no es teratógeno por vía paterna (sí en la mujer).\nPerla: estudio básico de pareja: ovulación (progesterona lútea), permeabilidad tubárica (HSG/histerosonografía), seminograma, reserva ovárica (AMH)."}, {"esp": "Endocrinología", "q": "Pareja de 32 años sin enfermedades, 12 meses intentando concebir sin éxito. ¿Causa más frecuente de infertilidad (según la fuente)?", "o": ["Endometriosis", "Factor masculino", "Disfunción ovulatoria", "Factor tubárico", "Inexplicada"], "a": 2, "e": "Distribución aproximada (Harrison): factor masculino ~25%, disfunción ovulatoria ~20-30% (la más frecuente en la mujer; SOP), factor tubárico ~15-20%, endometriosis ~10%, inexplicada ~15-25%. La clave de la fuente da la disfunción ovulatoria.\nPerla: estudiar tras 12 meses (<35 años) o 6 meses (≥35 años)."}, {"esp": "Endocrinología", "q": "En el ciclo menstrual, ¿qué hormona se secreta antes de la ovulación como resultado de la retroalimentación POSITIVA de los estrógenos?", "o": ["Cortisol", "FSH", "GnRH", "LH (pico)", "TSH"], "a": 3, "e": "Cuando el estradiol del folículo dominante supera ~200 pg/mL durante ~48 h, la retroalimentación pasa a positiva y desencadena el pico de LH; la ovulación ocurre ~36 h después del inicio del pico (10-12 h tras el máximo). La FSH también sube, pero en menor medida.\nPerla: la LH urinaria es la base de los test de ovulación."}, {"esp": "Endocrinología", "q": "Todas las siguientes manifestaciones pueden verse en formas del síndrome de Ehlers-Danlos, EXCEPTO:", "o": ["Luxación congénita de cadera", "Hipermovilidad articular", "Luxación del cristalino (ectopia lentis)", "Pérdida prematura de dientes", "Hiperextensibilidad cutánea"], "a": 2, "e": "La ectopia lentis es característica de Marfan (hacia arriba) y homocistinuria (hacia abajo), no de Ehlers-Danlos. SED: hiperlaxitud, piel hiperextensible con cicatrices atróficas, fragilidad vascular (tipo IV, COL3A1), periodontitis (SED periodontal, pérdida dental precoz), luxación de cadera (artrocalasia).\nPerla: SED vascular → rotura arterial, uterina e intestinal; evitar procedimientos invasivos."}, {"esp": "Endocrinología", "q": "Varón de 39 años con vesículas dolorosas en dorso de manos tras exposición solar que dejan cicatrices, empeoran con alcohol; piel engrosada. ¿Tratamiento con mayor probabilidad de mejora prolongada?", "o": ["Evitar el sol y hemina IV en brotes", "Hidroxicloroquina 200 mg/12 h", "Flebotomías de 450 mL cada 1-2 semanas", "Prednisona", "Triamcinolona tópica"], "a": 2, "e": "Porfiria cutánea tarda (déficit de uroporfirinógeno descarboxilasa, adquirido o familiar): desencadenantes = hierro (HFE), alcohol, estrógenos, VHC, VIH, tabaco. Flebotomías hasta ferritina ~20 ng/mL o hidroxicloroquina a DOSIS BAJAS (100 mg 2 veces/semana; las dosis altas son hepatotóxicas). Hemina = porfirias agudas.\nPerla: siempre cribar VHC y HFE."}, {"esp": "Endocrinología", "q": "Varón de 27 años con cólicos renales y hematuria recurrentes en verano; ácido úrico normal; cálculos radiotransparentes/poco densos en Rx y visibles en TC; cristales HEXAGONALES en orina acidificada. ¿Componente probable?", "o": ["Carbonato cálcico", "Oxalato cálcico", "Cistina", "Estruvita", "Ácido úrico"], "a": 2, "e": "Cistinuria (defecto del transportador de aminoácidos dibásicos COLA: cistina, ornitina, lisina, arginina; SLC3A1/SLC7A9): cristales hexagonales, cálculos recurrentes desde jóvenes. Test de nitroprusiato. Tratamiento: hiperhidratación (>3-4 L/día), alcalinizar orina a pH 7-7,5 y, si persiste, tiopronina o penicilamina.\nPerla: estruvita = ataúd; oxalato = sobre/pesas; ácido úrico = romboides."}, {"esp": "Endocrinología", "q": "En EE. UU., ¿cuál de las siguientes es causa de muerte MÁS frecuente en mujeres que en varones?", "o": ["Enfermedad de Alzheimer", "Cáncer", "Enfermedad cardiovascular", "Diabetes", "Suicidio"], "a": 0, "e": "Dos tercios de los pacientes con Alzheimer son mujeres (mayor longevidad y quizá factores hormonales/genéticos, APOE4 con mayor efecto en mujeres); es causa de muerte relativamente más frecuente en mujeres. Cáncer, ECV, diabetes y suicidio tienen tasas mayores en varones.\nPerla: la ECV sigue siendo la primera causa de muerte en ambos sexos."}, {"esp": "Endocrinología", "q": "¿Cuál es verdad respecto a las diferencias por sexo en la enfermedad?", "o": ["Las autoinmunes son más prevalentes en mujeres y los AOC elevan el riesgo de autoinmunidad.", "La obesidad reduce el riesgo de cáncer de endometrio.", "La testosterona aumenta la apnea del sueño en varones pero no en mujeres.", "Las mujeres son más sensibles a la insulina, por eso tienen menos DM2.", "Las mujeres tienen un QT más largo y mayor riesgo de torsade de pointes inducida por fármacos."], "a": 4, "e": "El QTc es ~10-20 ms más largo en mujeres (los andrógenos acortan la repolarización) → ~2/3 de las torsades farmacológicas ocurren en mujeres. La obesidad AUMENTA el cáncer de endometrio (estrógenos). No hay evidencia firme de que los AOC aumenten la autoinmunidad.\nPerla: fármacos QT: macrólidos, quinolonas, antipsicóticos, ondansetrón, metadona, citalopram (crediblemeds.org)."}, {"esp": "Neurología y Psiquiatría", "q": "Varón joven con crisis convulsivas. Todas las siguientes son verdaderas, EXCEPTO:", "o": ["Las crisis focales se originan en redes limitadas a una región cerebral.", "Las generalizadas se inician en una red y activan rápidamente redes bilaterales.", "Las crisis focales no suelen relacionarse con anomalías estructurales.", "Las focales pueden evolucionar a tónico-clónicas bilaterales.", "Todo lo anterior es verdadero."], "a": 2, "e": "Las crisis focales se asocian con frecuencia a lesiones estructurales (esclerosis mesial temporal, displasias corticales, tumores, ictus, TCE) → toda crisis focal nueva requiere RM. Clasificación ILAE 2017: inicio focal (con/sin alteración de consciencia), generalizado o desconocido.\nPerla: primera crisis → EEG + RM; la TC urgente descarta sangrado/lesión aguda."}, {"esp": "Neurología y Psiquiatría", "q": "Mujer de 58 años con paroxismos de dolor lancinante de ~1 min en mejilla y labio derechos, en salvas, desencadenados al lavarse la cara, sin déficit sensitivo ni motor. ¿Mejor paso siguiente?", "o": ["Carbamazepina 100 mg, titulando hasta 200 mg/6 h", "RM o angio-RM cerebral", "Biopsia de arteria temporal", "EMG", "Descompresión microvascular"], "a": 0, "e": "Neuralgia del trigémino clásica sin signos de alarma: el tratamiento de primera línea es carbamazepina (u oxcarbazepina), con respuesta diagnóstica. La RM (con secuencias para conflicto neurovascular) está recomendada en todos para descartar secundaria (EM, tumor) y planificar cirugía, pero la respuesta de la fuente prioriza iniciar tratamiento; se reserva urgencia de RM si déficit sensitivo, <40 años, bilateral o dolor persistente.\nPerla: carbamazepina y HLA-B*15:02 (asiáticos) → SJS/NET."}, {"esp": "Neurología y Psiquiatría", "q": "Varón de 78 años con deterioro cognitivo leve pide algo que reduzca su probabilidad de progresar a Alzheimer. ¿Qué se recomienda?", "o": ["Ejercicios de entrenamiento cerebral", "Donepezilo", "Ginkgo biloba", "Memantina", "Hasta ahora ningún tratamiento ha demostrado retrasar la progresión"], "a": 4, "e": "Ni anticolinesterásicos, ni memantina, ni ginkgo, ni vitamina E han demostrado retrasar la conversión del DCL a demencia (AAN 2018). Se recomienda ejercicio regular (mejora cognición, recomendación de apoyo) y control de FRCV. (Actualización: anticuerpos anti-amiloide lecanemab/donanemab aprobados para DCL/demencia leve por Alzheimer con amiloide confirmado: enlentecen ~27-35% el deterioro, con riesgo de ARIA.)\nPerla: DCL: queja cognitiva objetivada sin pérdida de independencia funcional."}, {"esp": "Neurología y Psiquiatría", "q": "Todos los siguientes son factores predisponentes del síndrome de fatiga crónica, EXCEPTO:", "o": ["Maltrato emocional infantil", "Sexo masculino", "Inactividad física en la infancia", "Hiperactividad premórbida", "Enfermedad psiquiátrica premórbida"], "a": 1, "e": "El SFC/EM es 2-4 veces más frecuente en MUJERES. Factores predisponentes: traumas infantiles, personalidad perfeccionista/hiperactiva, inactividad en la infancia, enfermedad psiquiátrica previa; desencadenantes: infecciones (VEB, COVID-19), estrés.
