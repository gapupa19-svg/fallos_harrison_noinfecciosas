<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>REPASO FALLOS · Harrison por especialidades</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f7f5;--card:#fff;--ink:#3c3c3c;--mute:#777;--line:#e5e5e5;--green:#58cc02;--green-d:#46a302;--green-bg:#d7ffb8;--red:#ff4b4b;--red-d:#ea2b2b;--red-bg:#ffdfe0;--blue:#1cb0f6;--blue-d:#1899d6;--sel:#ddf4ff;--gold:#ffc800;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#131f24;--card:#1b2a31;--ink:#e8eef0;--mute:#9fb0b7;--line:#37464f;--green-bg:#1f3a12;--red-bg:#3d1f22;--sel:#16384a}}
:root[data-theme="dark"]{--bg:#131f24;--card:#1b2a31;--ink:#e8eef0;--mute:#9fb0b7;--line:#37464f;--green-bg:#1f3a12;--red-bg:#3d1f22;--sel:#16384a}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Nunito",ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 140px}
header.top{display:flex;align-items:center;gap:10px;padding:8px 0 14px}
.logo{width:40px;height:40px;border-radius:12px;background:var(--green);display:grid;place-items:center;font-size:22px;box-shadow:0 4px 0 var(--green-d)}
.brand{font-weight:900;font-size:20px;letter-spacing:-.3px;line-height:1.1}
.brand small{display:block;font-weight:700;font-size:12px;color:var(--mute);letter-spacing:0}
.chips{margin-left:auto;display:flex;gap:6px}
.chip{border:2px solid var(--line);border-radius:12px;padding:4px 9px;font-weight:800;font-size:14px;background:var(--card);white-space:nowrap}
.hero{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:18px;margin-bottom:16px}
.hero h1{margin:0 0 4px;font-size:24px;font-weight:900}
.hero p{margin:0;color:var(--mute);font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stat{border:2px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px;font-weight:900}
.stat span{font-size:12px;color:var(--mute);font-weight:800}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btn{border:none;border-radius:16px;padding:14px 18px;font-weight:900;font-size:15px;letter-spacing:.4px;text-transform:uppercase;color:#fff;background:var(--green);box-shadow:0 4px 0 var(--green-d);transition:transform .05s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--green-d)}
.btn.blue{background:var(--blue);box-shadow:0 4px 0 var(--blue-d)}
.btn.ghost{background:var(--card);color:var(--mute);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.red{background:var(--red);box-shadow:0 4px 0 var(--red-d)}
.btn[disabled]{background:var(--line);color:var(--mute);box-shadow:none;cursor:default}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.esp{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:14px;text-align:left;color:var(--ink);box-shadow:0 4px 0 var(--line);display:flex;flex-direction:column;gap:8px}
.esp:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.esp .ic{font-size:30px}
.esp .nm{font-weight:900;font-size:16px;line-height:1.15}
.esp .ct{font-size:13px;color:var(--mute);font-weight:800}
.bar{height:12px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .4s}
.sec{font-weight:900;font-size:18px;margin:22px 0 10px}
/* quiz */
.qtop{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:12px;padding:10px 0}
.x{background:none;border:none;font-size:26px;color:var(--mute);padding:0 4px;line-height:1}
.qtop .bar{flex:1;height:16px}
.tag{display:inline-block;font-size:12px;font-weight:900;color:var(--blue);text-transform:uppercase;letter-spacing:.6px;margin:6px 0 8px}
.tag.again{color:var(--red)}
.stem{font-size:19px;font-weight:800;line-height:1.45;margin:0 0 18px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:16px;padding:12px 14px;font-size:16px;font-weight:700;line-height:1.35;box-shadow:0 3px 0 var(--line)}
.opt .k{flex:none;width:28px;height:28px;border:2px solid var(--line);border-radius:9px;display:grid;place-items:center;font-size:14px;font-weight:900;color:var(--mute)}
.opt.sel{background:var(--sel);border-color:var(--blue);box-shadow:0 3px 0 var(--blue)}
.opt.sel .k{border-color:var(--blue);color:var(--blue)}
.opt.ok{background:var(--green-bg);border-color:var(--green);box-shadow:0 3px 0 var(--green)}
.opt.ok .k{border-color:var(--green);color:var(--green-d)}
.opt.bad{background:var(--red-bg);border-color:var(--red);box-shadow:0 3px 0 var(--red)}
.opt.bad .k{border-color:var(--red);color:var(--red)}
.opt[disabled]{cursor:default}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:2px solid var(--line);padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px))}
.foot.ok{background:var(--green-bg);border-color:var(--green-bg)}
.foot.bad{background:var(--red-bg);border-color:var(--red-bg)}
.foot .in{max-width:720px;margin:0 auto}
.fb{font-weight:900;font-size:21px;margin:0 0 6px;display:flex;align-items:center;gap:8px}
.foot.ok .fb{color:var(--green-d)}.foot.bad .fb{color:var(--red-d)}
.exp{max-height:38vh;overflow:auto;font-size:15px;font-weight:600;line-height:1.5;white-space:pre-line;margin-bottom:12px;padding-right:4px}
.exp b{font-weight:900}
.foot .btn{width:100%}
.foot.bad .btn{background:var(--red);box-shadow:0 4px 0 var(--red-d)}
.end{text-align:center;padding-top:30px}
.end .big{font-size:64px}
.end h2{font-size:28px;font-weight:900;margin:8px 0}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}
.kpi{border:2px solid var(--line);border-radius:16px;overflow:hidden}
.kpi .h{font-size:12px;font-weight:900;color:#fff;padding:5px;text-transform:uppercase}
.kpi b{display:block;font-size:24px;font-weight:900;padding:10px 4px}
.fail-list{text-align:left;margin-top:14px}
.fail-list div{border:2px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px;font-weight:700;font-size:14px;background:var(--card)}
.fail-list em{font-style:normal;color:var(--green-d);font-weight:900}
.small{font-size:13px;color:var(--mute);font-weight:700}
.linkbtn{background:none;border:none;color:var(--blue);font-weight:900;font-size:14px;padding:6px 0}
.hidden{display:none!important}
.toggle{display:flex;gap:6px;flex-wrap:wrap}
.toggle button{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:8px 12px;font-weight:800;font-size:13px}
.toggle button.on{border-color:var(--blue);background:var(--sel);color:var(--blue)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="foot hidden" id="foot"><div class="in" id="footIn"></div></div>
<script>
const DATA = [{"esp": "Hematología", "q": "Todas las siguientes declaraciones sobre la leucemia mieloide crónica (LMC) son verdaderas, EXCEPTO:", "o": ["El trasplante alogénico de progenitores casi siempre se ofrece como tratamiento de segunda o tercera línea.", "Un antecedente familiar y la quimioterapia alquilante previa se relacionan con mayor riesgo de desarrollar LMC.", "La mayoría de los pacientes se presenta en fase crónica, no en fase acelerada o blástica.", "La enfermedad está impulsada por el producto del gen quimérico BCR-ABL1.", "La supervivencia estimada a 10 años con los tratamientos actuales es del 85%."], "a": 1, "e": "La LMC no tiene agregación familiar ni se asocia a quimioterapia alquilante; el único factor de riesgo reconocido es la exposición a radiación ionizante (supervivientes de Hiroshima/Nagasaki). Con ITK (imatinib y sucesores) la supervivencia a 10 años ronda el 85% y el alo-TPH queda relegado a resistencia/intolerancia a ≥2 ITK o fase avanzada. ~85-90% se diagnostica en fase crónica.\nPerla: radiación = LMC; alquilantes = LMA/SMD (latencia 5-7 años, del 5q/-7)."}, {"esp": "Hematología", "q": "Varón de 76 años con dolor y edema 2+ en tobillo izquierdo de 4 días. Fumador activo, ERGE, TVP hace 9 meses resuelta e HTA controlada. Dímero D elevado. ¿Cuál de los siguientes hace que el dímero D sea MENOS predictivo de TVP en este paciente?", "o": ["Edad > 70 años", "Consumo activo de tabaco", "Falta de síntomas sugestivos", "Signo de Homans negativo", "TVP en el año precedente"], "a": 0, "e": "La especificidad del dímero D cae con la edad (y en cáncer, embarazo, hospitalización, inflamación): en >80 años apenas un 10% de pacientes tiene dímero D negativo. De ahí el umbral ajustado por edad (edad×10 µg/L en >50 años; estudio ADJUST-PE), validado en EP y extrapolado a TVP.\nPerla: el dímero D sirve para EXCLUIR con probabilidad clínica baja/intermedia (alto VPN); nunca para confirmar."}, {"esp": "Hematología", "q": "Varón afrodescendiente de 64 años con insuficiencia cardiaca, insuficiencia renal (Cr 6,3), polineuropatía y pápulas céreas en axilas e ingles. Proteínas totales 9 g/dL con albúmina 3,2 g/dL, Hto 24%, proteinuria 3+ sin cilindros celulares. Eco: engrosamiento del VI con FE conservada. ¿Qué prueba tiene mayor probabilidad de diagnosticar el TRASTORNO SUBYACENTE?", "o": ["Biopsia de médula ósea", "EMG con estudios de conducción", "Biopsia de grasa abdominal", "Cateterismo cardiaco derecho", "Ecografía renal"], "a": 0, "e": "Amiloidosis AL multisistémica (corazón, riñón, nervio, piel) con gran brecha proteica → discrasia de células plasmáticas. La biopsia de grasa demostraría amiloide, pero la pregunta pide el trastorno subyacente: la médula ósea demuestra la clona plasmocelular (y permite tipificar el amiloide y descartar mieloma).\nPerla: toda amiloidosis → inmunofijación sérica/urinaria + cadenas ligeras libres; en cardiopatía, descartar ATTR con gammagrafía con pirofosfato (si no hay componente monoclonal)."}, {"esp": "Hematología", "q": "Mujer de 19 años, remera, con fatiga intensa y dolor en hipocondrio izquierdo. Hace 2 días recibió ceftriaxona + azitromicina por sospecha de gonorrea (ya tratada antes a los 17 años). FC 100, esplenomegalia, Hb 5 g/dL con leucocitos y plaquetas normales; frotis con esferocitos abundantes. ¿Qué prueba confirmará el diagnóstico?", "o": ["Actividad de ADAMTS-13", "Prueba de antiglobulina directa (Coombs)", "Citometría de flujo", "Déficit de G6PD", "Electroforesis de hemoglobina"], "a": 1, "e": "Hemólisis inmune inducida por fármacos: la ceftriaxona es la causa más frecuente (junto a cefotetán y piperacilina), típicamente con reexposición (sensibilizada en el episodio previo). Los esferocitos traducen hemólisis extravascular por anticuerpos; el Coombs directo confirma. G6PD daría células mordidas/cuerpos de Heinz con oxidantes.\nPerla: esferocitos + Coombs+ = AHAI (caliente o farmacológica); esferocitos + Coombs− = esferocitosis hereditaria."}, {"esp": "Hematología", "q": "Varón de 66 años con mieloma múltiple (anemia, lesiones líticas dorsolumbares) en tratamiento con varios fármacos desde hace 6 semanas; se encuentra mejor. ¿Qué prueba es MÁS útil para valorar la respuesta?", "o": ["Hemograma completo", "PET-TC con FDG", "Citometría de flujo", "LDH", "Cuantificación de la inmunoglobulina monoclonal (componente M)"], "a": 4, "e": "La respuesta en mieloma se define por los criterios IMWG, basados en la reducción del componente M sérico/urinario (y cadenas ligeras libres si no es medible): RP ≥50%, MBRP ≥90%, RC con inmunofijación negativa. La PET-TC y la EMR por citometría/NGS se usan en respuestas profundas, no como primera herramienta de seguimiento.\nPerla: si no hay componente M medible → ratio de cadenas ligeras libres (FLC)."}, {"esp": "Hematología", "q": "Varón de 72 años, asintomático y activo (instructor de yoga). Brecha gamma elevada; Cr 1,1, albúmina 3,9, Ca 10,1 mg/dL. Médula ósea con 20% de células plasmáticas; IgA monoclonal 15 g/L. ¿Cuál es el mejor paso siguiente?", "o": ["Dexametasona", "Lenalidomida + dexametasona", "PET-TC", "Analítica y seguimiento anual"], "a": 2, "e": "Cumple criterios de mieloma quiescente (≥10% plasmocitos y/o CM ≥30 g/L sin eventos CRAB). Antes de etiquetarlo hay que descartar biomarcadores/lesiones definitorias de mieloma: lesiones óseas en TC de baja dosis/PET-TC (o >1 lesión focal en RM), plasmocitos ≥60%, ratio FLC ≥100. Si todo negativo → seguimiento estrecho (cada 3-4 meses, no anual).\nPerla: SLiM-CRAB = Sixty (≥60%), Light chains (ratio ≥100), MRI (>1 lesión focal ≥5 mm)."}, {"esp": "Hematología", "q": "Varón de 64 años con fatiga, gingivorragia, febrícula y esplenomegalia. Pancitopenia con blastos; médula: leucemia promielocítica aguda con t(15;17). ¿Qué fármaco específico de la LPA se incluirá en la inducción?", "o": ["Aciclovir", "Daunorrubicina", "Rituximab", "Sildenafilo", "Tretinoína (ATRA)"], "a": 4, "e": "La LPA (PML-RARA) responde a la diferenciación con ATRA; en riesgo bajo-intermedio (leucocitos ≤10.000) el estándar es ATRA + trióxido de arsénico sin quimioterapia (APL0406), con curación >90%. La daunorrubicina/idarrubicina se usa, pero no es específica de LPA.\nPerla: iniciar ATRA ante la mera SOSPECHA (riesgo de CID hemorrágica); vigilar síndrome de diferenciación → dexametasona."}, {"esp": "Hematología", "q": "Varón de 73 años asintomático; en urgencias tras un accidente de tráfico se detectan leucocitos 95×10⁹/L con predominio linfocitario. Frotis con linfocitos pequeños maduros y sombras de Gumprecht. ¿Cuál es el siguiente paso?", "o": ["Ingreso para quimioterapia de inducción a dosis altas", "Biopsia de médula ósea", "Citometría de flujo de sangre periférica", "Observación", "PET-TC"], "a": 2, "e": "Linfocitosis absoluta con morfología de LLC: el diagnóstico se establece con inmunofenotipo en sangre periférica (CD5+, CD19+, CD20 débil, CD23+, Ig de superficie débil con restricción de cadena ligera; ≥5.000 linfocitos B clonales/µL). No se necesita médula ósea para el diagnóstico. Tras confirmarla, la mayoría en estadio precoz se observa ('watch and wait').\nPerla: tratar solo si enfermedad activa (criterios iwCLL): citopenias progresivas, síntomas B, adenopatías/esplenomegalia masivas, tiempo de duplicación <6 meses."}, {"esp": "Hematología", "q": "Mujer de 28 años con anemia en un chequeo: Hb 8 g/dL, VCM 105, leucocitos 4.000, plaquetas 235.000. Dieta omnívora, fumadora, toma multivitamínico con hierro; menstruaciones normales. Frotis con macroovalocitos y neutrófilos hipersegmentados. ¿Diagnóstico más probable?", "o": ["Leucemia mieloblástica aguda", "Esferocitosis hereditaria", "Anemia ferropénica", "Anemia megaloblástica nutricional", "Anemia perniciosa"], "a": 4, "e": "Anemia megaloblástica en una joven con dieta omnívora (sin déficit dietético) y aporte de folato vía multivitamínico → la causa más probable es malabsorción de B12 por gastritis autoinmune (anemia perniciosa), que puede aparecer en jóvenes (más en mujeres y en ciertos grupos étnicos).\nPerla: diagnóstico con B12 baja ± MMA/homocisteína elevadas + anticuerpos anti-factor intrínseco (específicos) / anti-célula parietal (sensibles). Tratamiento parenteral o dosis oral alta (1-2 mg/día)."}, {"esp": "Hematología", "q": "Todas las siguientes alteraciones genéticas se relacionan con mayor riesgo de trombosis venosa profunda, EXCEPTO:", "o": ["Factor V Leiden", "Receptor plaquetario de la glucoproteína Ib", "Déficit heterocigoto de proteína C", "Protrombina G20210A", "Activador tisular del plasminógeno (polimorfismos)"], "a": 1, "e": "La GP Ib (complejo GPIb-IX-V, receptor de FvW) se asocia a trastornos hemorrágicos (Bernard-Soulier) y sus polimorfismos se han estudiado en trombosis ARTERIAL, no venosa. FVL, PT G20210A y déficits de anticoagulantes naturales son trombofilias venosas clásicas; alteraciones del sistema fibrinolítico (t-PA, PAI-1) también se han relacionado.\nPerla: trombofilias 'fuertes' (déficit de AT, homocigotos, dobles heterocigotos, SAF) pueden modificar la duración de la anticoagulación; las 'débiles' (FVL/PT heterocigotos) casi nunca."}, {"esp": "Hematología", "q": "Mujer de 68 años con fatiga, fiebre intermitente y sudoración nocturna de 2 semanas. Palidez; T 38 °C. Leucocitos 900/µL, Hb 8 g/dL, plaquetas 98.000/µL. Bioquímica normal. ¿Causa más probable según la clave de la fuente?", "o": ["Anemia aplásica adquirida", "Deficiencia de cobre", "Síndrome mielodisplásico", "Mielofibrosis", "Infección por parvovirus"], "a": 4, "e": "La clave del banco (Harrison) da el parvovirus B19 como causa de supresión medular transitoria en un cuadro febril agudo de 2 semanas con citopenias (el virus infecta progenitores eritroides y puede producir pancitopenia/leucopenia transitoria). Razonamiento: la instauración aguda con fiebre orienta a causa infecciosa reversible antes que a SMD o aplasia.\nPerla práctica: en >65 años con citopenias persistentes, el SMD es la causa más frecuente → si no se recupera en semanas, aspirado/biopsia medular con citogenética. Descartar también déficit de cobre (cirugía bariátrica, exceso de zinc)."}, {"esp": "Hematología", "q": "Varón de 78 años con fatiga progresiva, dos sinusitis recientes, cefalea, palidez y petequias mucosas. Se diagnostica leucemia mieloide aguda. ¿Cuál de los siguientes hallazgos citogenéticos/moleculares confiere PEOR pronóstico?", "o": ["t(8;21)", "inv(16)", "Ninguna anomalía citogenética (cariotipo normal)", "Mutación NPM1 (sin FLT3-ITD)", "Cariotipo monosómico"], "a": 4, "e": "ELN 2022: riesgo favorable = t(8;21), inv(16)/t(16;16) (core-binding factor), NPM1 mutado sin FLT3-ITD adverso, CEBPA bZIP. Cariotipo normal = intermedio. Adverso: cariotipo complejo, cariotipo MONOSÓMICO, -5/del(5q), -7, 17p/TP53, inv(3), t(6;9), t(9;22), KMT2A reordenado, mutaciones relacionadas con mielodisplasia.\nPerla: en ancianos con LMA adversa, la opción habitual es azacitidina + venetoclax (VIALE-A)."}, {"esp": "Hematología", "q": "Mujer de 29 años con adenopatías cervicales indoloras de 1 mes y sudoración nocturna. TC: adenopatías cervicales, axilares y mediastínicas, captantes en PET. La biopsia muestra células grandes con núcleo bilobulado y nucléolos prominentes sobre un infiltrado pleomórfico. ¿Cuál es verdadera?", "o": ["Se relaciona con HTLV-1.", "La t(14;18) con sobreexpresión de BCL-2 es confirmatoria.", "La mayoría de los pacientes no se curará con quimioterapia sola.", "Suele haber sobreexpresión de PD-L1 que contribuye a la evasión inmunitaria.", "Es una neoplasia de origen T."], "a": 3, "e": "Linfoma de Hodgkin clásico (células de Reed-Sternberg, origen B del centro germinal). La amplificación de 9p24.1 (PD-L1/PD-L2/JAK2) es característica y explica la eficacia de nivolumab/pembrolizumab en recaídas. La mayoría se cura con quimioterapia (ABVD, BV-AVD, BEACOPP) ± RT. t(14;18) = folicular; HTLV-1 = LLTA.\nPerla: VEB presente en ~40% del LH clásico (más en celularidad mixta)."}, {"esp": "Oncología", "q": "Varón de 75 años, exfumador de 40 paquetes-año, disnea de reposo. TC: nódulo periférico izquierdo de 3 cm, tres adenopatías ipsilaterales y derrame pleural izquierdo grande. Se biopsia por sospecha de cáncer de pulmón. ¿Mejor paso siguiente y por qué?", "o": ["Esperar la anatomía patológica porque si tiene mutación KRAS pueden ofrecerse terapias dirigidas.", "Esperar la anatomía patológica porque si tiene mutación EGFR pueden ofrecerse terapias dirigidas.", "Oncología médica para quimioterapia urgente en el hospital.", "Oncología radioterápica para radioterapia urgente.", "Cirugía: la lobectomía probablemente sea el único tratamiento necesario."], "a": 1, "e": "El derrame pleural maligno = M1a (estadio IV): no quirúrgico. En CPNM avanzado no escamoso hay que esperar el perfil molecular (EGFR, ALK, ROS1, BRAF, KRAS G12C, MET, RET, NTRK, HER2) y PD-L1 antes de iniciar tratamiento sistémico, salvo urgencia vital. El EGFR es la diana clásica con mayor beneficio (osimertinib, FLAURA). Hoy KRAS G12C también es tratable (sotorasib/adagrasib), pero en 2.ª línea.\nPerla: no iniciar inmunoterapia antes de conocer EGFR/ALK (toxicidad y menor eficacia)."}, {"esp": "Oncología", "q": "Varón de 63 años con adenocarcinoma de pulmón IIIB en quimioterapia (paclitaxel-carboplatino). Fiebre 38,3 °C; eritema en el orificio de salida de su catéter tunelizado, túnel no doloroso ni eritematoso. Hemocultivos negativos a 48 h. Neutrófilos 1.550/µL. ¿Mejor estrategia?", "o": ["Retirar solo el catéter", "Ceftazidima + vancomicina", "Antibiótico tópico en el orificio", "Vancomicina sola", "Vancomicina y retirada del catéter"], "a": 3, "e": "Infección del orificio de salida (sin tunelitis ni bacteriemia) en paciente NO neutropénico (>500): se trata con antibiótico activo frente a grampositivos (S. aureus/estafilococos coagulasa negativos) sin retirar el catéter. La cobertura antipseudomónica no está indicada sin neutropenia. Retirada si tunelitis, infección del bolsillo, bacteriemia persistente, S. aureus, Pseudomonas, micobacterias u hongos.\nPerla: neutropenia febril = <500 neutrófilos (o <1.000 con descenso previsto) + T ≥38,3 °C única o ≥38 °C mantenida 1 h."}, {"esp": "Oncología", "q": "Todos los siguientes son mecanismos de las células tumorales para evadir el sistema inmunitario, EXCEPTO:", "o": ["Alteración de la señalización celular", "Producción de citocinas inmunosupresoras", "Inducción de CTLA-4", "Reducción de los linfocitos T reguladores", "Aumento de macrófagos (asociados a tumor)"], "a": 3, "e": "Los tumores AUMENTAN (no reducen) los linfocitos T reguladores, que suprimen la respuesta antitumoral. Otros mecanismos: pérdida de MHC-I, secreción de TGF-β/IL-10, expresión de ligandos de checkpoint (PD-L1), inducción de CTLA-4, reclutamiento de macrófagos M2 y células supresoras mieloides.\nPerla: la base de la inmunoterapia es bloquear estos frenos (anti-CTLA-4 ipilimumab; anti-PD-1/PD-L1)."}, {"esp": "Oncología", "q": "Todas las siguientes son alteraciones genéticas frecuentes en el cáncer, EXCEPTO:", "o": ["Amplificación de oncogenes", "Modificaciones epigenéticas", "Inserciones y deleciones en oncogenes", "Grandes deleciones en genes supresores", "Mutaciones puntuales en oncogenes"], "a": 2, "e": "Los oncogenes se activan por mutaciones puntuales (KRAS), amplificación (HER2, MYC) o translocaciones; las inserciones/deleciones que interrumpen la lectura producen pérdida de función, típica de genes SUPRESORES, no de oncogenes. Los supresores se inactivan por deleciones, mutaciones y silenciamiento epigenético (hipermetilación de promotores).\nPerla: oncogén = ganancia de función (1 alelo basta, dominante); supresor = pérdida de función (2 hits, Knudson)."}, {"esp": "Oncología", "q": "Todas las siguientes declaraciones sobre la prevención del cáncer de próstata son verdaderas, EXCEPTO:", "o": ["Las crucíferas y el tomate podrían ser protectores.", "En ensayos aleatorizados, los inhibidores de la 5α-reductasa redujeron el riesgo de desarrollar cáncer de próstata.", "No hay fármacos aprobados hoy para prevenir el cáncer de próstata.", "En ensayos clínicos se ha demostrado que la vitamina E reduce el riesgo de cáncer de próstata."], "a": 3, "e": "El ensayo SELECT (vitamina E ± selenio) no mostró beneficio; de hecho, la vitamina E AUMENTÓ el riesgo (~17%). Finasterida (PCPT) y dutasterida (REDUCE) redujeron ~25% la incidencia, pero con aumento aparente de tumores de alto grado; la FDA no los aprobó para prevención.\nPerla: licopeno/crucíferas: evidencia observacional débil."}, {"esp": "Oncología", "q": "Todos los siguientes factores se relacionan con MAYOR riesgo de cáncer de mama, EXCEPTO:", "o": ["Menarquia precoz", "Primer embarazo a término a edad tardía (>30 años)", "Lactancia materna prolongada", "Consumo moderado de alcohol", "Obesidad central (posmenopáusica)"], "a": 2, "e": "La lactancia prolongada y el primer embarazo a término precoz son PROTECTORES (menor exposición estrogénica acumulada y diferenciación del epitelio). Aumentan el riesgo: menarquia precoz, menopausia tardía, nuliparidad/primer embarazo tardío, alcohol (dosis-dependiente), obesidad posmenopáusica (aromatización periférica), THS combinada, radiación torácica, BRCA.\n(Nota: en la captura original la opción B aparecía como 'embarazo a edad temprana', que también es protector; se ha corregido para que la pregunta tenga una única respuesta.)"}, {"esp": "Oncología", "q": "Varón de 68 años con dolor en flanco de 2 meses, hematuria progresiva, hiporexia, pérdida de 2,3 kg y masa palpable >5 cm en flanco derecho. Función renal normal. Todo lo siguiente sobre su diagnóstico probable es verdadero, EXCEPTO:", "o": ["La anemia es más frecuente que la eritrocitosis.", "La presentación más frecuente es la tríada hematuria, dolor en flanco y masa palpable.", "La obesidad aumenta el riesgo.", "Los pacientes con von Hippel-Lindau pueden presentar esta neoplasia.", "La histología más probable es carcinoma de células claras."], "a": 1, "e": "Carcinoma renal: la tríada clásica aparece solo en 10-20%; hoy >50% se diagnostica incidentalmente por imagen. Anemia (~30%) es más frecuente que la eritrocitosis (~3%, por EPO). Factores de riesgo: tabaco, obesidad, HTA, ERC/diálisis (quística adquirida), VHL (células claras, VHL-HIF). Células claras ≈ 75-85%.\nPerla: paraneoplasias: hipercalcemia (PTHrP), Stauffer (colestasis sin metástasis), fiebre, eritrocitosis."}, {"esp": "Oncología", "q": "Varón de 63 años con síndrome de Cowden y hematuria macroscópica de 1 mes sin células ni cilindros; HTA y tabaquismo; síntomas miccionales irritativos. ¿Cuál es verdadera?", "o": ["La citología rara vez detecta los cánceres vesicales de alto grado.", "Las mujeres tienen mayor probabilidad que los varones de desarrollar cáncer vesical.", "El tratamiento intravesical no es eficaz en el cáncer vesical sin invasión muscular.", "El carcinoma epidermoide es la histología probable.", "El síndrome de Cowden aumenta su riesgo de cáncer vesical."], "a": 4, "e": "Cowden (PTEN hamartoma) se asocia a mama, tiroides, endometrio, renal, colon y también a urotelial. El cáncer vesical es 3-4 veces más frecuente en varones; 90% urotelial (epidermoide si esquistosomiasis/sonda crónica). La citología es sensible precisamente en el ALTO grado (baja en bajo grado). BCG/quimio intravesical son eficaces en tumores no músculo-invasivos.\nPerla: hematuria macroscópica en >35 años sin causa clara → cistoscopia + uro-TC."}, {"esp": "Oncología", "q": "¿Cuál de las siguientes declaraciones describe la relación entre los tumores testiculares y los marcadores séricos?", "o": ["Deben medirse β-hCG y AFP para vigilar la progresión.", "La β-hCG es poco útil porque es idéntica a la LH.", "Medir marcadores el día siguiente a la cirugía de la enfermedad localizada es útil para saber si la resección fue completa.", "Más del 40% de los no seminomatosos no produce marcadores.", "Los seminomas puros producen AFP o β-hCG en >90%."], "a": 0, "e": "~90% de los TCG no seminomatosos elevan AFP y/o β-hCG; los seminomas puros NUNCA elevan AFP (si la AFP está alta, se trata como no seminoma) y solo ~15-20% elevan β-hCG. La β-hCG comparte subunidad α con LH, pero se mide la subunidad β específica. La normalización debe valorarse según vida media (AFP 5-7 días, β-hCG 24-36 h), no al día siguiente.\nPerla: marcadores (AFP, β-hCG, LDH) forman parte de la estadificación (S0-S3) y del pronóstico IGCCCG."}, {"esp": "Oncología", "q": "Varón de 39 años sin antecedentes personales de cáncer solicita un test genético. Su abuelo paterno, su padre y su hermano tienen cáncer de próstata y su hermana cáncer de mama a los 50 años. ¿Qué se le responde?", "o": ["No, porque los antecedentes de cáncer de próstata no justifican estudio genético.", "Sí, debido a sus antecedentes familiares se recomendarían las pruebas genéticas.", "No, porque no tiene edad suficiente.", "No, porque no tiene un síndrome de cáncer familiar.", "No, porque aún no se han iniciado cribados."], "a": 1, "e": "Tres generaciones con cáncer de próstata + cáncer de mama en un familiar de primer grado sugieren síndrome hereditario (BRCA2 sobre todo, BRCA1, ATM, CHEK2, HOXB13, genes de Lynch). Las guías (NCCN) recomiendan asesoramiento y test genético; idealmente se estudia primero a un familiar afecto.\n(Nota: en la captura original las opciones A y B eran casi idénticas; se ha reformulado A.)\nPerla: BRCA2 en varones → cáncer de próstata agresivo, mama masculina, páncreas."}, {"esp": "Oncología", "q": "Varón de 85 años con dificultad para iniciar la micción, esfuerzo y chorro débil de 20 años de evolución. Próstata aumentada sin nódulos; PSA estable de 3 ng/mL. Se prescribe tamsulosina. ¿Mecanismo por el que mejora los síntomas?", "o": ["Reduce el volumen prostático", "Prolonga el efecto del óxido nítrico", "Reduce el tono parasimpático", "Reduce el tono simpático (α1) del músculo liso prostático y del cuello vesical", "Inhibe la 5α-reductasa"], "a": 3, "e": "La tamsulosina es un antagonista α1A (uroselectivo): relaja el músculo liso del estroma prostático y del cuello vesical (componente dinámico). No reduce el volumen (eso lo hacen los inhibidores de 5α-reductasa, en 6-12 meses). Los iPDE5 (tadalafilo) actúan por la vía NO-GMPc.\nPerla: efectos adversos: hipotensión ortostática y síndrome del iris flácido intraoperatorio (avisar antes de cirugía de cataratas)."}, {"esp": "Oncología", "q": "Varón de 72 años con tos. Masa hiliar izquierda y derrame pleural moderado; toracocentesis y biopsia: células pequeñas, basófilas e hipercromáticas, cromogranina y sinaptofisina positivas. ¿Cuál es correcta?", "o": ["Está indicada la RM cerebral en todos los pacientes.", "Tiene enfermedad limitada al tórax y es candidato a radiación.", "La cirugía sola cura a la mayoría en este estadio.", "La radioterapia no tiene papel en esta enfermedad.", "Pocos pacientes se diagnostican en este estadio."], "a": 0, "e": "Carcinoma microcítico con derrame pleural maligno = enfermedad extensa (estadio IV), que es la forma de presentación de ~2/3 de los casos. La RM cerebral está indicada en todos (alta frecuencia de metástasis cerebrales, incluso asintomáticas). Tratamiento de la extensa: platino-etopósido + inmunoterapia (atezolizumab/durvalumab). La RT se usa en limitada (concurrente) y paliativa/consolidación.\nPerla: cirugía solo en T1-2N0 (muy raro)."}, {"esp": "Oncología", "q": "Todos los siguientes se han identificado como factores de riesgo del carcinoma epidermoide de cabeza y cuello, EXCEPTO:", "o": ["Alcohol", "Virus de Epstein-Barr", "VPH", "Tabaco", "Tratamiento previo de un cáncer de cabeza y cuello"], "a": 4, "e": "El antecedente de cáncer de cabeza y cuello aumenta el riesgo de SEGUNDOS primarios por cancerización de campo (tabaco/alcohol), pero el tratamiento previo en sí no se considera factor de riesgo. Tabaco y alcohol son sinérgicos; VPH-16 → orofaringe (mejor pronóstico, p16+); VEB → nasofaringe.\nPerla: segundos primarios ~3-5%/año (cabeza-cuello, pulmón, esófago)."}, {"esp": "Oncología", "q": "Todas las siguientes declaraciones sobre el cáncer cutáneo no melanoma son verdaderas, EXCEPTO:", "o": ["La queratosis actínica y la queilitis actínica son lesiones premalignas del carcinoma espinocelular.", "Toda exposición UV, incluidas cabinas de bronceado, aumenta el riesgo.", "El carcinoma basocelular es el que tiene mayor probabilidad de metastatizar.", "Los queratoacantomas deben tratarse como carcinomas espinocelulares.", "El trasplante de órgano sólido aumenta mucho el riesgo de espinocelular y basocelular agresivos."], "a": 2, "e": "El basocelular es el cáncer cutáneo más frecuente pero casi nunca metastatiza (<0,1%); es localmente destructivo. El espinocelular metastatiza en ~2-5% (más en labio, oreja, inmunodeprimidos). En trasplantados el riesgo de espinocelular aumenta 65-250 veces (inversión de la ratio BCC:SCC).\nPerla: en trasplantados con SCC múltiples, cambiar a inhibidores de mTOR y quimioprevención con acitretina/nicotinamida."}, {"esp": "Cardiología", "q": "Desde el punto de vista fisiopatológico, todos los siguientes están aumentados (regulación al alza) en la insuficiencia cardiaca con FE reducida, EXCEPTO:", "o": ["Angiotensina II", "Endotelina", "Captación de calcio por el retículo sarcoplásmico", "Noradrenalina", "TNF-α"], "a": 2, "e": "En la ICFEr hay activación neurohormonal (SRAA, simpático, endotelina, citocinas como TNF-α) y alteración del manejo del calcio: la SERCA2a está DISMINUIDA (menor recaptación de Ca²⁺ al RS) y aumenta la fuga por el receptor de rianodina → alteración de relajación y contractilidad.\nPerla: por eso fracasaron terapias génicas con SERCA2a (CUPID-2); la clave sigue siendo el bloqueo neurohormonal (4 pilares)."}, {"esp": "Cardiología", "q": "¿Cuál de las siguientes afirmaciones sobre la ortopnea es verdadera?", "o": ["Puede estar causada por obesidad abdominal.", "No mejora con la postura erguida.", "Se debe a redistribución de sangre desde la circulación central hacia la periférica y esplácnica.", "Suele aparecer antes que la disnea de esfuerzo.", "La tos nocturna de la IC no se relaciona con la ortopnea."], "a": 0, "e": "La ortopnea no es específica de IC: aparece en obesidad abdominal, ascitis, EPOC o parálisis diafragmática. En la IC se produce por redistribución de sangre desde las extremidades/esplácnico HACIA la circulación central al tumbarse; mejora al incorporarse y suele ser más tardía que la disnea de esfuerzo. La tos nocturna es un equivalente de ortopnea.\nPerla: la bendopnea (disnea al agacharse) sugiere presiones de llenado elevadas."}, {"esp": "Cardiología", "q": "Varón de 45 años con disnea progresiva de 4 meses; PFR y TC torácica normales. Eco: PSVD elevada y disfunción diastólica con FEVI normal. Cateterismo derecho: AD 10, AP 55/35 (42), PCP 34 mmHg, PTDVI 34, GC 4,5 L/min, RVP 1,8 UW. ¿Causa más probable de la HP?", "o": ["Neumopatía crónica", "HPTEC", "Insuficiencia cardiaca con FE conservada", "HAP idiopática", "Estenosis mitral"], "a": 2, "e": "HP poscapilar aislada (grupo 2): PAPm >20, PCP >15 y RVP ≤2 UW (ESC/ERS 2022). La PCP igual a la PTDVI (34) excluye estenosis mitral (en ella PCP > PTDVI por el gradiente transmitral). Con FEVI normal y disfunción diastólica → ICFEp.\nPerla: si RVP >2 UW con PCP >15 = HP combinada pre y poscapilar (peor pronóstico). Los vasodilatadores pulmonares no están indicados en el grupo 2."}, {"esp": "Cardiología", "q": "Joven de 19 años con insuficiencia cardiaca aguda y disfunción del VI; biopsia endomiocárdica confirma miocarditis viral aguda. ¿Qué tratamiento se recomienda?", "o": ["Ibuprofeno", "Lisinopril (tratamiento estándar de la IC)", "Oseltamivir", "Prednisona", "Timoglobulina"], "a": 1, "e": "En la miocarditis viral no hay tratamiento específico eficaz: se trata la disfunción ventricular según guías (IECA/ARNI, betabloqueante, ARM, diuréticos) y soporte mecánico si shock. Los AINE se evitan (aumentan daño miocárdico y retención). Inmunosupresión solo en miocarditis de células gigantes, eosinofílica, sarcoidosis o por ICI, tras excluir virus activo.\nPerla: evitar ejercicio competitivo 3-6 meses."}, {"esp": "Cardiología", "q": "Mujer de 47 años con disnea grave de semanas y edemas. PA 145/78, FC 123, exoftalmos, crepitantes bibasales, IY, tercer ruido, piernas calientes y temblor fino. ¿Explicación fisiopatológica más probable de su IC?", "o": ["Anemia con gasto alto", "HTA crónica con HVI e IC no sistólica", "Hemocromatosis con miocardiopatía restrictiva", "Infarto con depresión sistólica", "Tirotoxicosis con gasto cardiaco alto"], "a": 4, "e": "Exoftalmos + temblor + taquicardia + extremidades calientes = Graves. La IC de gasto alto por tirotoxicosis (vasodilatación, taquicardia, aumento del volumen) puede evolucionar a taquimiocardiopatía. Tratamiento: betabloqueante (propranolol) + tionamidas.\n(Nota: en la app original aparecía D como correcta; la explicación de Harrison confirma E.)\nPerla: causas de IC de gasto alto: tirotoxicosis, anemia grave, beriberi, fístulas AV, Paget, sepsis, cirrosis."}, {"esp": "Cardiología", "q": "Varón de 72 años con fatiga progresiva al hacer jardinería. Exploración, Rx, analítica, ECG y ecocardiograma normales. En la ergometría alcanza FC máxima de 96 lpm sin cambios del ST. ¿Causa más probable?", "o": ["Insuficiencia cronotrópica", "ICFEp", "Enfermedad pulmonar", "Envejecimiento normal", "Síntomas psicosomáticos"], "a": 0, "e": "FC máxima teórica ≈ 220 − 72 = 148; alcanzar 96 lpm es <80% (índice cronotrópico bajo) → incompetencia cronotrópica, forma de disfunción del nodo sinusal. Puede tratarse con marcapasos con respuesta en frecuencia si es sintomática y no hay fármacos causales.\n(Nota: la app marcaba E; la explicación de Harrison da A.)\nPerla: descartar betabloqueantes/antiarrítmicos antes de diagnosticarla."}, {"esp": "Cardiología", "q": "Todos los siguientes son factores de riesgo de miocardiopatía periparto, EXCEPTO:", "o": ["Edad materna avanzada", "Desnutrición", "Primiparidad", "Embarazo gemelar", "Uso de tocolíticos"], "a": 2, "e": "Factores de riesgo según Harrison: edad materna avanzada, MULTIparidad, gestación múltiple, ascendencia africana, preeclampsia/HTA, desnutrición y tocolíticos (β-agonistas). La clave de la fuente considera la primiparidad no asociada.\nPerla: fisiopatología 'hormonal-vascular': fragmento de 16 kDa de prolactina (escindido por catepsina D) → bromocriptina como tratamiento adyuvante (ESC). Contraindicado nuevo embarazo si no se recupera la FE."}, {"esp": "Cardiología", "q": "Mujer de 42 años con síncope, dolor torácico, disnea, FC 110, PA 77/62, extremidades frías, lactato alto, oliguria y salvas de TVNS. FEVI 15%. Biopsia endomiocárdica urgente: lesiones granulomatosas difusas con extenso infiltrado inflamatorio (células gigantes). ¿Cuál es verdadera?", "o": ["La mayoría se recupera con tratamiento de soporte.", "Los esteroides son muy eficaces.", "La evolución es mala, con deterioro rápido que a menudo requiere trasplante urgente.", "Las taquiarritmias ventriculares son poco frecuentes.", "Ninguna de las anteriores."], "a": 2, "e": "Miocarditis de células gigantes (asociada a autoinmunidad: tiroiditis, EII, timoma): curso fulminante con shock y TV frecuentes; mortalidad/trasplante ~70-90% sin tratamiento. La inmunosupresión combinada (esteroides + ciclosporina ± ATG) mejora la supervivencia, pero los esteroides solos no bastan. Frecuente necesidad de soporte mecánico.\nPerla: diferenciar de sarcoidosis cardiaca (granulomas no necrotizantes, BAV, TV)."}, {"esp": "Cardiología", "q": "Varón de 28 años con palpitaciones al actuar. En Holter se registra TV monomorfa con morfología de bloqueo de rama izquierda y R altas en II, III y aVF, autolimitada. Eco y RM cardiaca normales. ¿Causa probable?", "o": ["Displasia arritmogénica del VD", "Miocardiopatía hipertrófica", "TV del tracto de salida del VI", "TV del tracto de salida del VD", "TV por reentrada en cicatriz"], "a": 3, "e": "TV idiopática del tracto de salida del VD: BRI + eje inferior, corazón estructuralmente normal, desencadenada por catecolaminas/estrés (actividad desencadenada mediada por AMPc). Buen pronóstico; tratamiento con betabloqueantes/verapamilo o ablación (curativa >90%). La RM normal aleja la DAVD.\nPerla: TV fascicular (VI) = BRD + eje superior, sensible a verapamilo."}, {"esp": "Cardiología", "q": "Mujer de 28 años con HTA de difícil control desde los 26 años en tratamiento con labetalol, lisinopril, clonidina y amlodipino. PA 168/100. K 2,8 mEq/L, bicarbonato 32, glucemia 114. ¿Diagnóstico más probable?", "o": ["Hiperplasia suprarrenal congénita", "Síndrome de Cushing", "Hiperaldosteronismo primario (Conn)", "Displasia fibromuscular", "Feocromocitoma"], "a": 2, "e": "HTA resistente + hipopotasemia + alcalosis metabólica = hiperaldosteronismo primario (causa endocrina más frecuente de HTA secundaria, 5-10% de hipertensos). Cribado con cociente aldosterona/renina (idealmente sin ARM ni diuréticos; los IECA elevan la renina y pueden dar falsos negativos).\nPerla: tras confirmación (sobrecarga salina/captopril), TC suprarrenal + cateterismo de venas suprarrenales antes de adrenalectomía."}, {"esp": "Cardiología", "q": "¿Cuál de las siguientes afirmaciones sobre la estenosis de la arteria renal (EAR) es verdadera?", "o": ["Una velocidad de flujo reducida en el Doppler predice estenosis significativa.", "Al inicio de la evolución de la EAR es frecuente el aumento de la renina sistémica.", "La displasia fibromuscular es rara en la población general (<1%).", "La actividad de renina predice la respuesta al tratamiento médico.", "La primera manifestación de la DFM suele ser el deterioro de la función renal."], "a": 1, "e": "La hipoperfusión renal activa el SRAA (modelo de Goldblatt 2 riñones-1 clip): al principio la HTA es renina-dependiente; con el tiempo participan otros mecanismos. En el Doppler lo significativo es la velocidad sistólica pico AUMENTADA (>200 cm/s). La DFM puede estar presente de forma subclínica en ~3-6% (donantes renales); se manifiesta como HTA en mujeres jóvenes, no como insuficiencia renal.\nPerla: DFM → angioplastia sin stent; aterosclerótica → tratamiento médico (CORAL, ASTRAL)."}, {"esp": "Cardiología", "q": "¿Cuál de las siguientes afirmaciones sobre la hipertensión en la población afrodescendiente de EE. UU. es cierta?", "o": ["Aparece a edad más temprana.", "Se asocia con mayor morbimortalidad.", "Es más grave.", "Es más prevalente.", "Todas las anteriores son verdaderas."], "a": 4, "e": "La HTA en afroamericanos es más prevalente (~45%), aparece antes, es más grave y produce más daño orgánico (ictus, IC, ERC terminal). Responden mejor a diuréticos tiazídicos y calcioantagonistas que a IECA/ARA-II en monoterapia (menor actividad de renina).\n(Nota: la app marcaba A; la explicación de Harrison da E.)\nPerla: mayor riesgo de angioedema por IECA en esta población."}, {"esp": "Cardiología", "q": "Varón de 75 años ingresado por IAMSEST: toma AAS a diario, IAM previo con stent en DA hace 5 años, angina acelerada al menos 2 veces/día en los últimos 4 días, descenso del ST de 3 mm en II, III, aVF y troponina positiva. Todos los siguientes confieren peor pronóstico, EXCEPTO:", "o": ["Episodios de angina en 24 h", "Edad", "Consumo diario de AAS", "Enfermedad coronaria conocida", "Todos los anteriores conllevan mayor riesgo"], "a": 4, "e": "Todos forman parte del TIMI risk score para SCASEST: edad ≥65, ≥3 FRCV, estenosis coronaria conocida ≥50%, AAS en los 7 días previos, ≥2 episodios de angina en 24 h, desviación del ST ≥0,5 mm y marcadores positivos. Este paciente suma 6-7 puntos (riesgo muy alto).\nPerla: hoy se prefiere el GRACE para estratificar y decidir coronariografía <24 h (GRACE >140)."}, {"esp": "Cardiología", "q": "Durante una ergometría, un paciente presenta angina por oclusión coronaria parcial. En el miocardio isquémico se observaría todo lo siguiente, EXCEPTO:", "o": ["Aumento del calcio citosólico", "Aumento del pH intracelular", "Paso del metabolismo aerobio a anaerobio", "Agotamiento de fosfatos de alta energía", "Salida de potasio de los miocitos"], "a": 1, "e": "La isquemia produce glucólisis anaerobia con acumulación de lactato y H⁺ → ACIDOSIS intracelular (descenso del pH). Se agotan ATP y fosfocreatina, sube el Ca²⁺ citosólico y sale K⁺ (base de los cambios del ST).\nPerla: 'cascada isquémica': perfusión → disfunción diastólica → sistólica → ECG → angina (el dolor es tardío)."}, {"esp": "Cardiología", "q": "Mujer de 67 años con FA sin adherencia a la anticoagulación; náuseas, vómitos y dolor en flanco, PA 220/140, LDH muy elevada y leucocitosis moderada. La angio-TC muestra pérdida de perfusión del polo superior renal derecho. ¿Diagnóstico?", "o": ["Síndrome de Cushing", "Feocromocitoma", "Infarto renal (tromboembólico)", "PTT", "Infección urinaria"], "a": 2, "e": "Infarto renal por embolia en FA no anticoagulada: dolor en flanco, fiebre/leucocitosis, náuseas y LDH desproporcionadamente elevada con transaminasas normales; HTA por liberación de renina desde el riñón isquémico. La angio-TC muestra defecto de perfusión en cuña.\n(Nota: la app marcaba D; la explicación de Harrison da C.)\nPerla: 'LDH muy alta + dolor lumbar + FA' → pensar en infarto renal (a menudo confundido con cólico)."}, {"esp": "Cardiología", "q": "Mujer de 66 años, cartera, con opresión torácica y disnea al subir una cuesta durante su ruta, que cede con 3 min de reposo; estable desde hace 9 meses. ¿Término y clase CCS apropiados?", "o": ["Angina estable CCS I", "Angina estable CCS II", "Angina estable CCS III", "Angina estable CCS IV", "Angina inestable"], "a": 1, "e": "CCS I: solo con esfuerzos extenuantes o prolongados. CCS II: limitación ligera de la actividad ordinaria (subir cuestas, escaleras rápido, tras comidas, frío). CCS III: limitación marcada (caminar 1-2 manzanas en llano o un piso). CCS IV: con cualquier actividad o en reposo. Estable 9 meses → no es inestable.\nPerla: angina inestable = de reposo, de nueva aparición (≥CCS III) o progresiva."}, {"esp": "Cardiología", "q": "Tras angioplastia primaria de un IAM anterior, en UCI hay extrasístoles ventriculares frecuentes sin TV. K 3,2 mEq/L y Mg 1,1 mEq/L. Todas las medidas siguientes están indicadas, EXCEPTO:", "o": ["Lidocaína IV", "Reposición de magnesio", "Metoprolol", "Reposición de potasio", "Todas están indicadas"], "a": 0, "e": "La lidocaína profiláctica no se recomienda: aumenta la mortalidad (bradiasistolia) sin reducir la FV. Las extrasístoles se tratan corrigiendo K (>4,0) y Mg (>2,0) y con betabloqueante. Los antiarrítmicos se reservan para TV/FV sostenida (amiodarona, lidocaína).\nPerla: el RIVA post-reperfusión es benigno y no requiere tratamiento."}, {"esp": "Cardiología", "q": "Durante una coronariografía, un trombo del catéter emboliza la DA con oclusión completa y no puede extraerse. ¿Cuándo se detectaría la CK-MB en un análisis sérico estándar?", "o": ["5-10 min", "1-2 h", "4-8 h", "12-24 h", "24-48 h"], "a": 2, "e": "La CK-MB empieza a elevarse a las 4-8 h, con pico a las 24 h y normalización en 48-72 h (útil para detectar reinfarto). La troponina de alta sensibilidad se detecta antes (1-3 h) y persiste 7-14 días.\nPerla: mioglobina = la más precoz (1-2 h) pero inespecífica."}, {"esp": "Cardiología", "q": "En ausencia de contraindicaciones, la fibrinólisis en el IAMCEST debe administrarse dentro de los siguientes minutos tras el primer contacto/llegada del paciente:", "o": ["30 min", "60 min", "90 min", "120 min", "Sin límite de tiempo"], "a": 0, "e": "Tiempo puerta-aguja ≤30 min (ESC 2023: bolo en ≤10 min desde el diagnóstico si se opta por fibrinólisis). Se elige fibrinólisis cuando la ICP primaria no puede realizarse en ≤120 min desde el diagnóstico, dentro de las 12 h de síntomas. Tras fibrinolisar → coronariografía en 2-24 h (estrategia farmacoinvasiva) o rescate inmediato si no reperfunde.\nPerla: ICP primaria: objetivo puerta-balón ≤90 min (≤60 si acude a centro con hemodinámica)."}, {"esp": "Cardiología", "q": "Varón de 67 años con dolor torácico opresivo 8/10; toma amlodipino, simvastatina y tadalafilo a diario. PA 145/85, FC 90, sin congestión. Troponina elevada y descenso del ST de 1 mm en II, III, aVF, V5 y V6. Es razonable administrar todo lo siguiente, EXCEPTO:", "o": ["AAS oral", "Clopidogrel oral", "Heparina IV", "Metoprolol IV", "Nitroglicerina sublingual"], "a": 4, "e": "Los nitratos están contraindicados en las 48 h siguientes al tadalafilo (24 h con sildenafilo/vardenafilo) por hipotensión grave (potenciación de GMPc). Tampoco en IAM de VD, PAS <90 o estenosis aórtica grave. Metoprolol es razonable sin IC, bajo gasto ni bloqueos.\nPerla: morfina, con precaución (retrasa la absorción de antiagregantes orales)."}, {"esp": "Cardiología", "q": "En un paciente de 54 años con sospecha de hipertensión pulmonar, ¿qué prueba se requiere para confirmar el diagnóstico y descartar enfermedad de cavidades izquierdas?", "o": ["BNP", "ECG", "Prueba de esfuerzo", "Cateterismo cardiaco derecho", "Ecocardiograma transtorácico"], "a": 3, "e": "El eco estima la probabilidad de HP, pero el diagnóstico exige cateterismo derecho: PAPm >20 mmHg, con PCP ≤15 (precapilar) o >15 (poscapilar) y RVP >2 UW (ESC/ERS 2022). Es imprescindible antes de iniciar vasodilatadores específicos y permite test de vasorreactividad.\nPerla: si PCP dudosa (13-18) en sospecha de ICFEp → sobrecarga de volumen o ejercicio."}, {"esp": "Cardiología", "q": "Paciente con aneurisma aórtico torácico, hipertelorismo, úvula bífida y carótidas tortuosas 'en sacacorchos'. Se sospecha síndrome de Loeys-Dietz. ¿Qué gen/proteína está mutado?", "o": ["CFTR", "Fibrilina 1", "STK11", "Receptor del TGF-β (TGFBR1/2)", "Procolágeno tipo III"], "a": 3, "e": "Loeys-Dietz: mutaciones en TGFBR1/2 (también SMAD3, TGFB2/3) → aneurismas agresivos que se disecan con diámetros menores (cirugía ~4,0-4,5 cm), tortuosidad arterial, úvula bífida/paladar hendido, hipertelorismo. Fibrilina 1 = Marfan; COL3A1 = Ehlers-Danlos vascular; STK11 = Peutz-Jeghers.\nPerla: estudio de imagen de TODO el árbol arterial (cabeza a pelvis)."}, {"esp": "Cardiología", "q": "¿Cuál de las afirmaciones sobre la enfermedad venosa crónica es verdadera?", "o": ["Las varices son más frecuentes en varones.", "La insuficiencia venosa crónica con edema es más frecuente en varones.", "Más del 50% de los >70 años tiene insuficiencia venosa crónica.", "La mayoría de los pacientes con IVC desarrolla úlceras venosas.", "Todas son verdaderas."], "a": 1, "e": "Según Harrison, las varices son más prevalentes en mujeres, mientras que la IVC con edema/cambios cutáneos afecta algo más a varones. Solo una minoría progresa a úlcera (~1-2% de la población). Clasificación CEAP (C0-C6).\nPerla: tratamiento: compresión (20-30/30-40 mmHg), elevación, ejercicio; ablación endovenosa de la safena reduce recurrencias de úlcera (EVRA)."}, {"esp": "Cardiología", "q": "¿Cuál de las siguientes afirmaciones sobre los tumores cardiacos es verdadera?", "o": ["Los tumores cardiacos benignos nunca requieren resección.", "Los primarios son mucho más frecuentes que las metástasis.", "Los primarios suelen ser malignos.", "Los orígenes más frecuentes de metástasis cardiacas son mama y pulmón.", "Todas."], "a": 3, "e": "Las metástasis cardiacas son 20-40 veces más frecuentes que los tumores primarios; sobre todo pulmón, mama, melanoma (el de mayor tropismo proporcional), linfoma y leucemia; afectan con más frecuencia al pericardio. El 75% de los primarios son benignos (mixoma), que se resecan por riesgo embólico/obstructivo.\nPerla: mixoma: aurícula izquierda, 'plop' tumoral, embolias, síntomas constitucionales (IL-6); Carney si es múltiple/recurrente."}, {"esp": "Neumología y UCI", "q": "Varón de 45 años con disnea de esfuerzo progresiva de 2 años. Padre y tío con fibrosis pulmonar; encanecimiento en la cuarta década. Crepitantes basales; SatO2 94% que desciende a 86% al subir escaleras. TC: fibrosis subpleural de lóbulos inferiores con panal y vidrio deslustrado. ¿Explicación más probable?", "o": ["Concentraciones de α1-antitripsina", "Función de los canales de cloro", "Función ciliar", "Anticuerpos anti-GM-CSF", "Longitud de los telómeros"], "a": 4, "e": "Fibrosis pulmonar familiar + encanecimiento prematuro → telomeropatía (mutaciones TERT/TERC, RTEL1, PARN). Otras pistas: citopenias/macrocitosis, cirrosis críptica, disqueratosis. Los telómeros cortos implican peor tolerancia a inmunosupresores y más complicaciones tras trasplante. Anti-GM-CSF = proteinosis alveolar autoinmune.\nPerla: en FPI familiar también MUC5B (polimorfismo promotor, el factor genético más frecuente, curiosamente de mejor pronóstico)."}, {"esp": "Neumología y UCI", "q": "Mujer de 75 años con isquemia mesentérica intervenida; el día 1 posoperatorio desarrolla disnea e hipoxemia con infiltrados alveolares bilaterales sin sobrecarga de volumen (SDRA temprano). Todos los siguientes tienen evidencia de eficacia, EXCEPTO:", "o": ["Uso temprano de bloqueantes neuromusculares", "Restricción de líquidos (estrategia conservadora)", "Glucocorticoides", "Ventilación con volumen corriente bajo", "Decúbito prono"], "a": 2, "e": "Con evidencia: VT 6 mL/kg de peso ideal con Pmeseta ≤30 (ARDSNet), prono ≥16 h/día en PaO2/FiO2 <150 (PROSEVA), estrategia hídrica conservadora (FACTT: más días sin ventilador) y bloqueo neuromuscular precoz en SDRA grave (ACURASYS; ROSE no confirmó beneficio). Los glucocorticoides no tenían evidencia sólida en la fuente.\nPerla (actualización): las guías ESICM 2023/ATS 2024 sugieren corticoides en SDRA moderado-grave (sobre todo neumonía/COVID) con recomendación condicional."}, {"esp": "Neumología y UCI", "q": "Mujer de 57 años con EPOC, disnea creciente y confusión. FR 25, uso de musculatura accesoria. Con O2 3 L: pH 7,30, PaCO2 75, PaO2 65; HCO3 30 mEq/L. ¿Qué explica mejor su estado acidobásico?", "o": ["Acidosis metabólica y respiratoria", "Alcalosis metabólica con acidosis metabólica compensadora", "Acidosis respiratoria crónica agudizada con alcalosis metabólica compensadora", "Acidosis respiratoria aguda", "Acidosis respiratoria crónica con alcalosis metabólica compensadora"], "a": 2, "e": "Cálculo del HCO3 esperado (PaCO2 +35 sobre 40): aguda → 24 + 3,5 = 27,5; crónica → 24 + 12 ≈ 36. El HCO3 de 30 queda entre ambos y el pH 7,30 está más ácido del esperado para una crónica pura (~7,35) → crónica agudizada.\nPerla: VMNI en exacerbación de EPOC con pH <7,35 y PaCO2 >45 (reduce intubación y mortalidad)."}, {"esp": "Neumología y UCI", "q": "Mujer de 32 años con SDRA por gripe, ventilación en volumen control: FR 35, VT 420 mL (PCI 70 kg = 6 mL/kg), FiO2 0,6, PEEP 12. pH 7,21, PaCO2 65, PaO2 65, SatO2 91%; Pmeseta 22 cmH2O; hemodinámicamente estable. ¿Siguiente paso?", "o": ["Aumentar FiO2 a 0,8", "Aumentar PEEP a 14", "Aumentar FR a 40", "Aumentar VT a 480 mL", "Mantener los ajustes actuales"], "a": 4, "e": "Hipercapnia permisiva: pH ≥7,15-7,20 es aceptable si no hay HTIC ni inestabilidad. Oxigenación objetivo PaO2 55-80 / SatO2 88-95% → ya cumplida. Aumentar VT violaría la ventilación protectora; subir FR a 40 favorece auto-PEEP.\nPerla: si pH <7,15 → subir FR (máx. 35), valorar bicarbonato o ECCO2R; driving pressure (Pmeseta − PEEP) objetivo <15."}, {"esp": "Neumología y UCI", "q": "Varón de 23 años con fibrosis quística y colonización crónica por Pseudomonas; más exacerbaciones pese a buena adherencia. Sibilancias y crepitantes; TC: bronquiectasias extensas de lóbulos superiores con tapones mucosos. Además de cultivos (incluidas micobacterias), ¿qué prueba está indicada?", "o": ["Gasometría arterial", "Broncoscopia con LBA", "Angio-TC", "Óxido nítrico exhalado", "IgE sérica total"], "a": 4, "e": "Sospecha de aspergilosis broncopulmonar alérgica (1-15% de FQ): sibilancias, deterioro, tapones mucosos, bronquiectasias centrales/superiores. Cribado con IgE total (>500 UI/mL; >1.000 en criterios ISHAM), luego IgE/IgG específicas frente a Aspergillus y eosinofilia.\nPerla: tratamiento: prednisona ± itraconazol; el cribado anual de IgE está recomendado en FQ."}, {"esp": "Neumología y UCI", "q": "Mujer de 32 años con crisis asmática tras visitar a un amigo con 7 gatos. Aire ambiente: pH 7,34, PaCO2 32, PaO2 48. Con O2 al 40%: PaO2 200 y PaCO2 32. ¿Causa más probable de la hipoxemia inicial?", "o": ["Hipoventilación alveolar", "Defecto de difusión", "Aumento del espacio muerto", "Cortocircuito (shunt)", "Alteración ventilación/perfusión"], "a": 4, "e": "La hipoxemia que se corrige bien con O2 suplementario indica desequilibrio V/Q (en el asma: unidades mal ventiladas por broncoespasmo/tapones). El shunt verdadero apenas responde a O2. PaCO2 baja excluye hipoventilación.\nPerla: en crisis asmática, una PaCO2 'normal' (≥40) indica fatiga e insuficiencia respiratoria inminente."}, {"esp": "Neumología y UCI", "q": "Varón de 47 años con alcoholismo crónico: confusión, marcha atáxica, limitación de la mirada lateral bilateral y neuropatía sensitiva distal. Na 129, glucosa 55 mg/dL. ¿Cuál es probablemente verdad?", "o": ["La glucosa IV producirá una mejoría rápida.", "El daño excitotóxico por acumulación de glutamato contribuye a su síndrome.", "Tiene desmielinización osmótica por caída rápida del sodio.", "La mayoría de los síntomas se deben a toxicidad directa del alcohol.", "La limitación de la mirada lateral sugiere infartos bilaterales del VIII par."], "a": 1, "e": "Encefalopatía de Wernicke (confusión, oftalmoparesia —VI par—, ataxia) por déficit de tiamina; la disfunción de enzimas dependientes de tiamina altera el metabolismo energético con acidosis láctica local y excitotoxicidad por glutamato en regiones periacueductales, tálamos y cuerpos mamilares. La glucosa sin tiamina previa puede precipitar/empeorar el cuadro.\nPerla: tiamina IV 200-500 mg/8 h ANTES de la glucosa; la oftalmoparesia mejora en horas-días, la memoria (Korsakoff) a menudo no."}, {"esp": "Neumología y UCI", "q": "Varón de 60 años fumador activo (30 años) con tos y disnea de 3 meses. Crepitantes bibasales sin acropaquias. FEV1/FVC normal, TLC 75%, DLCO 55%. TC: nódulos centrolobulillares difusos y vidrio deslustrado parcheado. ¿Tratamiento más eficaz?", "o": ["Azatioprina", "Nintedanib", "Prednisona", "Sirolimus", "Cese del tabaquismo"], "a": 4, "e": "Bronquiolitis respiratoria asociada a EPID (RB-ILD), enfermedad intersticial relacionada con el tabaco (junto a la neumonía intersticial descamativa y la histiocitosis de Langerhans). El abandono del tabaco es el tratamiento principal y a menudo suficiente; corticoides si progresión.\nPerla: histiocitosis de Langerhans: nódulos + quistes de lóbulos superiores respetando ángulos costofrénicos; neumotórax."}, {"esp": "Neumología y UCI", "q": "Mujer de 48 años con HSA por aneurisma de ACM tratado con espirales; derivación ventricular externa y nimodipino. El día 6 presenta confusión progresiva con Na 125 mEq/L. ¿Cuál es la afirmación verdadera más probable?", "o": ["Hiponatremia hipervolémica tratable con salino normal", "Natriuresis inducida por nimodipino", "Debe tratarse con restricción hídrica", "La hiponatremia permisiva es bien tolerada en HSA", "Es un síndrome pierde-sal cerebral y puede requerir salino hipertónico"], "a": 4, "e": "Tras HSA, la hiponatremia (SIADH o pierde-sal cerebral, por péptidos natriuréticos) es frecuente entre los días 4-14. En HSA la restricción hídrica está CONTRAINDICADA (hipovolemia → vasoespasmo e isquemia diferida); se trata con salino isotónico/hipertónico ± fludrocortisona.\nPerla: diferenciar SIADH (euvolémico) de pierde-sal (hipovolémico) es difícil; en HSA se evita la restricción en ambos casos."}, {"esp": "Neumología y UCI", "q": "Varón de 55 años con FPI y trasplante bipulmonar. Al día 2 empeora la hipoxemia; al día 3 presenta infiltrados bilaterales difusos, PaO2/FiO2 90 pese a soporte máximo e inotrópicos. ¿Diagnóstico más probable?", "o": ["Rechazo agudo", "Rechazo crónico", "Infección fúngica diseminada", "Rechazo hiperagudo", "Disfunción primaria del injerto"], "a": 4, "e": "La disfunción primaria del injerto (lesión por isquemia-reperfusión) aparece en las primeras 72 h con infiltrados bilaterales e hipoxemia (graduada por PaO2/FiO2; grado 3 <200). Es la principal causa de mortalidad precoz; tratamiento de soporte, ventilación protectora, NO inhalado, ECMO. El rechazo hiperagudo (anticuerpos preformados) es rarísimo e inmediato.\nPerla: rechazo agudo celular: semanas-meses; crónico (CLAD/BOS): >3-6 meses."}, {"esp": "Neumología y UCI", "q": "Mujer de 56 años con HSA por rotura de aneurisma de la A. cerebral anterior tratada con espirales, en nimodipino. El día 7 presenta deterioro súbito del nivel de consciencia y empeoramiento de la hemiparesia; la TC no muestra resangrado ni hidrocefalia. ¿Tratamiento?", "o": ["Neurocirugía para clipaje", "Restricción de agua libre", "Ventriculostomía", "Intubación con hiperventilación y manitol", "Noradrenalina IV (hipertensión inducida) y angioplastia transluminal"], "a": 4, "e": "Isquemia cerebral diferida por vasoespasmo (pico días 4-14). Tratamiento: euvolemia + hipertensión inducida con vasopresores (el 'triple H' se abandonó: la hipervolemia no aporta) y, si no responde, angioplastia o vasodilatadores intraarteriales. Diagnóstico de apoyo: Doppler transcraneal, angio-TC/perfusión.\nPerla: el nimodipino (60 mg/4 h, 21 días) mejora el pronóstico sin reducir el vasoespasmo angiográfico."}, {"esp": "Neumología y UCI", "q": "Mujer de 38 años que fallece por estado asmático. Es probable encontrar todos los siguientes hallazgos anatomopatológicos, EXCEPTO:", "o": ["Infiltración de la mucosa por eosinófilos y linfocitos T activados", "Infiltración de los espacios ALVEOLARES por eosinófilos y neutrófilos", "Oclusión de la luz por tapones de moco", "Engrosamiento y edema de la pared", "Engrosamiento de la membrana basal con depósito subepitelial de colágeno"], "a": 1, "e": "El asma es una enfermedad de la VÍA AÉREA: el parénquima alveolar está respetado. En el asma fatal: tapones mucosos, infiltrado eosinofílico/Th2 mucoso, hipertrofia de músculo liso, hiperplasia caliciforme y engrosamiento de la membrana basal reticular (remodelado).\nPerla: la infiltración alveolar eosinofílica sugiere neumonía eosinofílica o EGPA."}, {"esp": "Neumología y UCI", "q": "Mujer de 48 años con contusión pulmonar y SDRA tras politrauma. Peso real 90 kg, talla 1,67 m, peso corporal ideal 59 kg. SatO2 92% con FiO2 1,0; pH 7,28, PaCO2 48, PaO2 68. ¿Mejor volumen corriente inicial?", "o": ["236 mL", "354 mL", "472 mL", "540 mL", "590 mL"], "a": 1, "e": "Ventilación protectora: 6 mL/kg de peso IDEAL (no real): 6 × 59 = 354 mL (rango 4-8 mL/kg). Usar el peso real en obesos provoca volutrauma. Ajustar para Pmeseta ≤30 cmH2O.\nPerla: PCI (kg) ♀ = 45,5 + 0,91 × (talla cm − 152,4); ♂ = 50 + 0,91 × (talla − 152,4)."}, {"esp": "Neumología y UCI", "q": "Mujer de 73 años con hepatopatía alcohólica ingresada por sepsis urinaria; disminución progresiva del nivel de consciencia con ojos desviados a la izquierda. ¿Qué lesión lo explicaría?", "o": ["Encefalopatía hepática", "Hemorragia pontina izquierda", "Hemorragia del lóbulo frontal derecho", "Crisis epiléptica del lóbulo frontal derecho", "Herniación uncal por hemorragia derecha"], "a": 3, "e": "Los campos oculares frontales dirigen la mirada al lado contrario. Una lesión DESTRUCTIVA frontal derecha desvía los ojos hacia la derecha (miran a la lesión); una CRISIS frontal derecha (irritativa) los desvía hacia la izquierda (se alejan del foco). La lesión pontina izquierda desvía hacia la derecha.\nPerla: ante desviación de la mirada 'al revés' de lo esperado → pensar en crisis no convulsiva → EEG."}, {"esp": "Neumología y UCI", "q": "¿Cuál de las siguientes declaraciones sobre el término 'coma' es verdadera?", "o": ["Todos los trastornos que producen coma causan daño cerebral irreversible.", "La catatonia es una forma de coma.", "El coma es sinónimo del estado vegetativo persistente.", "El coma es un estado semejante al sueño con ojos cerrados del cual no es posible despertar al paciente.", "El coma se refiere a cualquier trastorno que altere la consciencia."], "a": 3, "e": "Coma: estado de arreactividad profunda, ojos cerrados, sin ciclos sueño-vigilia, del que el paciente no puede despertar. El estado vegetativo (vigilia sin consciencia) tiene ojos abiertos y ciclos sueño-vigilia. La catatonia es un trastorno psiquiátrico/neurológico con paciente consciente.\nPerla: descartar síndrome de enclaustramiento (movimientos oculares verticales y parpadeo conservados; lesión pontina ventral)."}, {"esp": "Neumología y UCI", "q": "Mujer de 38 años con FQ, trasplante bipulmonar hace 4 años (DPI leve inicial, dos rechazos agudos tratados) en prednisona, tacrolimus y micofenolato. Desde hace 3 meses, disnea leve y caída del FEV1 de 85% a 65%. ¿Qué hallazgo sugiere síndrome de bronquiolitis obliterante?", "o": ["Estenosis del 50% del bronquio del lóbulo medio distal a la anastomosis", "Aspergillus en 3/5 placas del LBA", "Infiltrados linfocitarios perivasculares en la biopsia transbronquial", "Nuevo atrapamiento aéreo en la TC en espiración sin infiltrados", "Nueva restricción moderada en las PFR"], "a": 3, "e": "El BOS (fenotipo obstructivo de la disfunción crónica del injerto, CLAD) se define por caída persistente del FEV1 ≥20% del mejor basal postrasplante, con patrón obstructivo y atrapamiento aéreo en TC espiratoria, tras excluir otras causas. Los infiltrados perivasculares indican rechazo agudo celular; la restricción sugiere el fenotipo RAS (peor pronóstico).\nPerla: tratamiento: azitromicina, fotoféresis extracorpórea, ajuste de inmunosupresión, retrasplante."}, {"esp": "Neumología y UCI", "q": "Varón de 19 años con cuadro viral hace 2 semanas; ahora disnea y fatiga, PA 88/75 (presión de pulso estrecha), FC 112, IY hasta la mandíbula, crepitantes, galope S3 y extremidades frías. Si se colocara un catéter de arteria pulmonar, ¿qué dato sería más probable?", "o": ["Gasto cardiaco elevado", "Volumen sistólico elevado", "Saturación venosa mixta (arteria pulmonar) disminuida", "Saturación capilar pulmonar disminuida", "RVS disminuida"], "a": 2, "e": "Shock cardiogénico por miocarditis: GC bajo → mayor extracción tisular de O2 → SvO2 baja (<65%), PCP elevada y RVS elevadas (vasoconstricción compensadora). La saturación capilar pulmonar (sangre arterializada) no se ve afectada por el gasto.\nPerla: SvO2 alta con shock sugiere distributivo (sepsis) o shunts."}, {"esp": "Neumología y UCI", "q": "Varón de 52 años con ronquidos, pausas observadas, somnolencia diurna (incluso conduciendo), HTA, IMC 37, cuello 43 cm. Sin comorbilidad cardiopulmonar significativa. ¿Siguiente paso?", "o": ["Polisomnografía en laboratorio", "Estudio del sueño domiciliario (poligrafía respiratoria)", "Oximetría nocturna", "Amigdalectomía", "CPAP autoajustable empírica"], "a": 1, "e": "Con alta probabilidad pretest de SAOS moderado-grave y sin comorbilidades relevantes (IC, EPOC grave, enfermedad neuromuscular, hipoventilación, opiáceos, ictus, insomnio grave), la AASM recomienda la poligrafía domiciliaria. Si es negativa o no concluyente → PSG.\nPerla: no se inicia CPAP sin confirmación diagnóstica."}, {"esp": "Neumología y UCI", "q": "Mujer de 47 años con HAP idiopática mal adherente al tratamiento (incluido epoprostenol IV), IC derecha avanzada con disfunción grave del VD e índice cardiaco 1,7 L/min/m². Se remite a trasplante pulmonar. ¿Cuál es cierta?", "o": ["Necesita trasplante cardiopulmonar por la IC derecha.", "La HAP idiopática tiene peor supervivencia a 5 años que otros receptores.", "El trasplante unipulmonar es el preferido en HAP.", "Su función ventricular derecha se recuperará tras el trasplante pulmonar.", "Tiene riesgo de recurrencia de la HAP tras el trasplante."], "a": 3, "e": "El VD se remodela y recupera tras normalizar la poscarga con trasplante BIPULMONAR (preferido en HAP). El cardiopulmonar se reserva para cardiopatías congénitas complejas o disfunción VI. La HAP tiene mayor mortalidad precoz (DPI) pero supervivencia a largo plazo similar; no recurre.\nPerla: derivar a trasplante si riesgo intermedio-alto pese a terapia óptima (triple con prostanoide parenteral)."}, {"esp": "Neumología y UCI", "q": "Varón de 45 años con derrame pleural derecho grande de aspecto lechoso: triglicéridos 160 mg/dL, exudado, Gram y cultivos negativos. Sin traumatismo ni cirugía torácica. ¿Siguiente paso?", "o": ["Diuréticos y toracocentesis repetidas", "Tubo de tórax y octreótido", "Linfangiografía y TC de mediastino", "Antibióticos de amplio espectro", "Ligadura quirúrgica del conducto torácico"], "a": 2, "e": "Quilotórax (TG >110 mg/dL; quilomicrones confirman). Sin traumatismo, la causa más frecuente es el LINFOMA (también otras neoplasias, linfangioleiomiomatosis). Hay que buscar la causa (TC de mediastino) y localizar la fuga (linfangiografía, que además puede ser terapéutica con embolización).\nPerla: pseudoquilotórax (colesterol >200, TG <110; cristales de colesterol) = derrames crónicos (AR, TBC)."}, {"esp": "Neumología y UCI", "q": "Varón de 75 años al 6.º día de ventilación mecánica por neumonía, FiO2 0,3, candidato a prueba de respiración espontánea. Todo lo siguiente predice fracaso de la prueba, EXCEPTO:", "o": ["SatO2 <90%", "FC >140 lpm", "FR <25 rpm", "PAS >180 mmHg", "PAS <90 mmHg"], "a": 2, "e": "Criterios de fracaso de la PRE (30-120 min con tubo en T o PS baja): FR >35 o f/VT >105, SatO2 <90%, FC >140 o cambio >20%, PAS >180 o <90, agitación, diaforesis, uso de musculatura accesoria. Una FR <25 es un signo favorable.\nPerla: índice de Tobin (f/VT) <105 predice éxito del destete.\n(Nota: la clave de Access/Harrison marca D, pero su propia explicación incluye PAS >180 como predictor de fracaso; la única opción que NO predice fracaso es C. Error de clave en la fuente.)"}, {"esp": "Neumología y UCI", "q": "Granjero de 53 años con fiebre, escalofríos, malestar y disnea sin sibilancias horas después de apilar heno. Rx: infiltrados alveolares bilaterales difusos. ¿Agente causal más probable?", "o": ["Nocardia asteroides", "Histoplasma capsulatum", "Cryptococcus neoformans", "Actinomicetos termófilos", "Aspergillus fumigatus"], "a": 3, "e": "Pulmón del granjero: neumonitis por hipersensibilidad aguda (4-8 h tras exposición) por actinomicetos termófilos (Saccharopolyspora rectivirgula, Thermoactinomyces) del heno enmohecido. Tratamiento: evitar la exposición ± corticoides.\nPerla: TC en NH: vidrio deslustrado, nódulos centrolobulillares y atrapamiento aéreo ('signo del queso de cabeza'); linfocitosis en LBA >30-50%."}, {"esp": "Neumología y UCI", "q": "Relacione con la ENFERMEDAD PULMONAR OBSTRUCTIVA CRÓNICA el patrón de pruebas funcionales más probable:", "o": ["TLC aumentada, VC disminuida, FEV1/FVC disminuido", "TLC, VC y RV disminuidos, FEV1/FVC aumentado, PIM normal", "TLC disminuida, RV aumentado, FEV1/FVC normal, PIM disminuida", "TLC, RV, FEV1/FVC y PIM normales"], "a": 0, "e": "EPOC: obstrucción (FEV1/FVC <0,7) con hiperinsuflación (TLC y RV aumentados) y atrapamiento que reduce la VC; DLCO baja si enfisema.\nPerla (serie de 4): EPOC = A; fibrosis pulmonar idiopática = B (restricción parenquimatosa); miastenia/neuromuscular = C (PIM baja, RV alto por incapacidad espiratoria); HAP = D (volúmenes normales, DLCO baja aislada)."}, {"esp": "Neumología y UCI", "q": "Relacione con la FIBROSIS PULMONAR IDIOPÁTICA el patrón de pruebas funcionales más probable:", "o": ["TLC aumentada, VC disminuida, FEV1/FVC disminuido", "TLC, VC y RV disminuidos, FEV1/FVC aumentado, PIM normal", "TLC disminuida, RV aumentado, FEV1/FVC normal, PIM disminuida", "TLC, RV, FEV1/FVC y PIM normales"], "a": 1, "e": "Restricción parenquimatosa: todos los volúmenes reducidos proporcionalmente, FEV1/FVC normal o AUMENTADO (mayor retracción elástica que 'tracciona' la vía aérea), PIM normal (músculos sanos) y DLCO disminuida.\nPerla: en restricción extraparenquimatosa neuromuscular la PIM está baja y el RV puede aumentar."}, {"esp": "Neumología y UCI", "q": "Relacione con la HIPERTENSIÓN PULMONAR (arterial) familiar el patrón de pruebas funcionales más probable:", "o": ["TLC aumentada, VC disminuida, FEV1/FVC disminuido", "TLC, VC y RV disminuidos, FEV1/FVC aumentado, PIM normal", "TLC disminuida, RV aumentado, FEV1/FVC normal, PIM disminuida", "TLC, RV, FEV1/FVC y PIM normales"], "a": 3, "e": "En la HAP la mecánica ventilatoria suele ser normal; la alteración típica es la DLCO disminuida aislada (enfermedad vascular). HAP hereditaria: BMPR2 (70-80%), ACVRL1, ENG, SMAD9, TBX4.\nPerla: DLCO muy baja (<45%) con volúmenes normales en esclerodermia → sospecha de HAP."}, {"esp": "Neumología y UCI", "q": "Relacione con la MIASTENIA GRAVE el patrón de pruebas funcionales más probable:", "o": ["TLC aumentada, VC disminuida, FEV1/FVC disminuido", "TLC, VC y RV disminuidos, FEV1/FVC aumentado, PIM normal", "TLC disminuida, RV aumentado, FEV1/FVC normal, PIM disminuida", "TLC, RV, FEV1/FVC y PIM normales"], "a": 2, "e": "Restricción extraparenquimatosa neuromuscular: debilidad inspiratoria (PIM baja → TLC baja) y espiratoria (no se vacía el pulmón → RV AUMENTADO), con FEV1/FVC normal y DLCO normal.\nPerla: en crisis miasténica, monitorizar CVF (<20 mL/kg o caída >30%) y PIM (menos negativa de −30 cmH2O) → intubar; la SatO2 es tardía."}, {"esp": "Neumología y UCI", "q": "Varón de 58 años trasplantado renal (tacrolimus + prednisona), HTA basal. Cefalea, crisis convulsiva y ceguera cortical; PA 160/90; tacrolimus 8 ng/mL (rango). RM FLAIR: edema de sustancia blanca parietooccipital. ¿Causa probable?", "o": ["Daño endotelial por inhibidor de la calcineurina", "La HTA elevada rompió la barrera hematoencefálica causando edema y convulsiones", "Toxicidad aguda por tacrolimus", "Ictus extenso de circulación posterior", "LMP por virus JC"], "a": 0, "e": "Síndrome de encefalopatía posterior reversible (PRES) por inhibidor de calcineurina: la toxicidad endotelial produce disfunción de la barrera y edema vasogénico, incluso con niveles terapéuticos y PA solo moderadamente elevada (la HTA no es suficiente para explicarlo). Tratamiento: control de PA, anticonvulsivos y reducir/cambiar el ICN (p. ej., a belatacept o mTOR).\nPerla: otras causas de PRES: eclampsia, quimioterapia, anti-VEGF, LES, IRA."}, {"esp": "Neumología y UCI", "q": "Mujer de 24 años con disnea y sibilancias al hacer ejercicio al aire libre y con gatos; rinitis estacional y eccema infantil. FEV1 79%, FVC 97%, FEV1/FVC 70%; tras salbutamol el FEV1 aumenta 12,4% (330 mL). ¿Cuál es verdad?", "o": ["La confirmación requiere prueba de metacolina.", "La mortalidad por asma ha aumentado en la última década.", "El factor de riesgo más frecuente es la predisposición genética.", "La prevalencia no ha cambiado en décadas.", "La gravedad de la enfermedad no varía de forma significativa en un paciente determinado."], "a": 4, "e": "La prueba broncodilatadora positiva (≥12% y ≥200 mL) confirma asma; la metacolina se usa si la espirometría es normal. Según Harrison, la gravedad del asma tiende a ser estable en un individuo (el leve rara vez evoluciona a grave). La atopia es el principal factor de riesgo; la prevalencia aumentó y la mortalidad ha disminuido.\nPerla GINA: ICS-formoterol a demanda como tratamiento preferente también en el escalón 1-2."}, {"esp": "Neumología y UCI", "q": "Mujer de 55 años con bronquiectasias NO relacionadas con FQ, en evaluación para trasplante. Para el Lung Allocation Score (UNOS), ¿en qué grupo diagnóstico se incluye?", "o": ["Fibrosis quística (grupo C)", "Enfermedad intersticial (grupo D)", "Enfermedad obstructiva (grupo A)", "Enfermedad vascular pulmonar (grupo B)", "Enfermedad restrictiva"], "a": 2, "e": "Grupos LAS: A = obstructivas (EPOC, déficit de α1-AT, bronquiectasias no FQ, LAM, sarcoidosis sin HP); B = vasculares (HAP); C = FQ e inmunodeficiencias; D = restrictivas (FPI, EPID). (Desde 2023 EE. UU. usa el Composite Allocation Score.)\nPerla: el grupo D (FPI) tiene mayor mortalidad en lista."}, {"esp": "Neumología y UCI", "q": "Varón de 35 años con anafilaxia tras picadura de avispa: edema facial, PA 72/45, FC 135. En un catéter de arteria pulmonar, ¿qué patrón hemodinámico se esperaría?", "o": ["PVC/PCP ↓, GC ↓, RVS ↑, SvO2 ↓ (hipovolémico)", "PVC/PCP ↑, GC ↓, RVS ↑, SvO2 ↓ (cardiogénico)", "PVC/PCP ↓, GC ↑ (o normal), RVS ↓, SvO2 ↑ (distributivo)", "PVC ↑ con PCP ↓, GC ↓, RVS ↑ (obstructivo)", "PVC/PCP ↓, GC ↓, RVS ↓, FC baja (neurogénico)"], "a": 2, "e": "La anafilaxia es un shock distributivo: vasodilatación y fuga capilar → precarga baja (PVC y PCP ↓), RVS ↓, GC normal o ↑ y SvO2 normal/alta. Tratamiento: adrenalina IM 0,5 mg (0,01 mg/kg), fluidos y, si refractario, adrenalina IV; glucagón si betabloqueado.\nPerla (tus notas): único con GC elevado y RVS bajas = distributivo; único con PCP alta = cardiogénico; todo bajo = neurogénico; RVS alta y resto bajo = hipovolémico. (Las opciones se han reescrito porque la tabla original no era legible.)"}, {"esp": "Neumología y UCI", "q": "Varón de 42 años politraumatizado, esplenectomizado, intubado. Hb 5,2 g/dL, SatO2 92%, PaO2 72 mmHg con FiO2 0,6, GC 7,8 L/min, lactato 4,8. ¿Cuál es el factor MENOS importante en el aporte de O2 (DO2)?", "o": ["Gasto cardiaco", "Hemoglobina", "PaO2", "SaO2"], "a": 2, "e": "DO2 = GC × CaO2 × 10; CaO2 = (1,34 × Hb × SaO2) + (0,003 × PaO2). El O2 disuelto (0,003 × PaO2) es mínimo; lo determinante es GC, Hb y SaO2. En este paciente la anemia grave es el principal problema → transfundir.\nPerla: por eso aumentar PaO2 por encima de la saturación casi completa apenas mejora el aporte."}, {"esp": "Neumología y UCI", "q": "Varón de 50 años con tos productiva intermitente, bronquitis repetidas, artralgias/sinovitis matutina de muñeca que mejora con ibuprofeno y sequedad ocular intensa. Roncus y crepitantes basales; la TC muestra bronquiectasias. ¿Prueba con mayor probabilidad de diagnóstico?", "o": ["Estudio genético de CFTR", "Biopsia de mucosa nasal", "Factor reumatoide y anticuerpos anti-Ro/anti-La", "Cultivo de esputo con BAAR", "Test del sudor"], "a": 2, "e": "Bronquiectasias + artritis + xeroftalmia → síndrome de Sjögren (± AR). La afectación pulmonar del Sjögren incluye enfermedad de vía aérea (bronquiolitis, bronquiectasias), NIL, NINE y linfoma MALT.\nPerla: estudio etiológico de bronquiectasias (SEPAR/ERS): Ig séricas, ABPA, autoinmunidad (FR, anti-CCP, ANA/Ro/La), α1-AT, micobacterias, FQ si sospecha."}, {"esp": "Neumología y UCI", "q": "Mujer de 78 años con neumonía multilobar intubada: FiO2 1,0, PEEP 12, VT 6 mL/kg; pH 7,20, PaCO2 32, PaO2 54. ¿Causa de la hipoxemia?", "o": ["Solo hipoventilación", "Hipoventilación y alteración V/Q", "Cortocircuito (shunt)", "Alteración V/Q"], "a": 2, "e": "Hipoxemia refractaria a FiO2 1,0 → shunt intrapulmonar (alvéolos perfundidos pero ocupados por exudado). La alteración V/Q se corrige con O2. La PaCO2 baja excluye hipoventilación.\nPerla: gradiente A-a con FiO2 1,0 >300-500 mmHg y PaO2/FiO2 54 = SDRA grave → prono."}, {"esp": "Neumología y UCI", "q": "Mujer de 84 años ingresada por infección respiratoria, con suero salino a 200 mL/h desde hace 48 h. Ahora disnea, FR 28, PA 165/95, crepitantes hasta campos medios y presión venosa yugular elevada. Todas son opciones razonables, EXCEPTO:", "o": ["Suspender el salino IV", "Furosemida 80 mg IV", "Morfina IV", "Cefepima + vancomicina inmediatas", "Nitroglicerina sublingual"], "a": 3, "e": "Edema agudo de pulmón iatrogénico por sobrecarga de volumen (Rx de ingreso normal, 48 h de sueroterapia, HTA, IY): suspender fluidos, diurético, nitratos (con PAS alta), VMNI. No hay datos de neumonía nosocomial que justifiquen ampliar antibióticos.\nPerla: la morfina en EAP es controvertida (MIMO: tendencia a más mortalidad); hoy se desaconseja de rutina."}, {"esp": "Nefrología", "q": "Varón de 57 años con DM y ERC (Cr 1,8) que desarrolla nefropatía por contraste tras cateterismo por IAM. Todas son verdaderas, EXCEPTO:", "o": ["La excreción fraccional de sodio
